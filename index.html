    win: "The Warden shudders and kneels, and its great body softens into moss and flowers — violets, foxgloves, things that haven't bloomed here in years. The grey drains out of the trees like water from a cloth. Far away in the Hollow, axes are lowered at last. The woodcutters look at their hands, at their houses, at each other, and they weep. The Shard of Life is warm against your chest.",
    last: "As you pass back through the Hollow, one of the woodcutters looks up at you, puzzled. “Hearthguard? You came back?” Then his eyes cloud over, and he has forgotten.",
    lose: "The briars close in and the light of your torch gutters out. You stumble back to camp with nothing. The Heartroot will still be waiting tomorrow.",
    skipIf: null,
    skipText: ""
  }
};

EXP_REGIONS[2] = {
  n: 2,
  name: "The Drowned Archive",
  tagline: "A flooded valley where the kingdom's records sleep beneath black water.",
  gate: {INT:2},
  guardian: "The Archivist",
  shard: "Shard of Memory",
  intro: "The valley is gone. Where the Archive of Aldmere once stood, there is only a still black lake, and beneath it, lamps burning where no lamp should burn. The fog stops at the waterline as if afraid of it. You find the old stair down, slick with weed, and descend into the hush of a million drowned pages.",
  sites: [
    {id:"stacks", name:"The Flooded Stacks", stats:["INT","ORD"], desc:"Half-sunken shelves, swollen catalogues, and riddles written in the damp."},
    {id:"causeway", name:"The Lantern Causeway", stats:["VIT","DIS"], desc:"A narrow stone path through cold water, lit by lamps that should have drowned."},
    {id:"rooms", name:"The Reading Rooms", stats:["INT","DIS"], desc:"Quiet halls where the books whisper, and some of them want to be read."}
  ],
  acts: ["Under the Lake", "The Keeper's Hoard", "The Lamp Room"],
  fragments: [
    {t:"A sign", x:"A brass sign hangs crooked over the flooded entrance hall, green with age: “Archive closed by order of the Keeper.” Beneath it, someone has scratched: “Let us in.”"},
    {t:"A dry lantern", x:"In a sunken alcove you find a lantern, perfectly dry. As you watch, it relights itself with a soft blue flame. Someone down here does not want the dark to win."},
    {t:"A list of names", x:"A long ledger of names, neat and careful, and beside each one a single word in red ink: “TAKEN.” Some of the names have been written more than once, as if the hand forgot it had already written them."},
    {t:"A child's drawing", x:"Pinned to a shelf, a child's crayon drawing: a tall man holding a lamp, and a small figure holding his hand. Both are smiling. The paper has been folded and unfolded many times."},
    {t:"The Keeper's journal", x:"Edric's journal, in a cramped, tired hand: “Water keeps it out. But the forgetting gets in anyway.” Further down: “If I cannot stop it, I will keep everything. Everything.”"},
    {t:"Childhood handwriting", x:"A book written in wobbling childish letters, every page a little map — the garden, the kitchen, the way to the river. The name on the cover has been carefully cut away."},
    {t:"Grey thread", x:"A whole shelf of memories, each bound into its own slim book with grey thread. A wedding. A first snow. A mother's voice. None of them belong to anyone anymore."},
    {t:"The King weeping", x:"One book opens onto a memory not its own: the King himself, alone among the shelves late at night, weeping over a ledger of the dead. The Keeper watched from the shadows and did not dare approach."},
    {t:"The lamp-room key", x:"Deep in a flooded vault, behind a door that took all your breath to open, lies an iron key stamped with a lamp. The water around it is strangely warm."},
    {t:"An unsent letter", x:"“My girl — I took the memory of me so that you wouldn't grieve when the Grey came for me. You will be angry, if you ever know. Be angry. Be anything. Just don't fade.” It was never sent."},
    {t:"A map to the Lamp Room", x:"A careful plan of the lowest level, every corridor drawn true, every flooded stair marked. At its heart, a single room labelled in a steady hand: the Lamp Room."},
    {t:"Her name", x:"Written on the flyleaf of the child's book, the cut-away name, restored in the Keeper's hand: “Maren — so she'd always find her way home.”"}
  ],
  lore: {
    "r2_archive": {t:"The Archive of Aldmere", x:"Every birth, every death, every law and land-deed of the kingdom was copied here. The Archive was meant to be the kingdom's memory, so that no one and nothing would ever be truly lost."},
    "r2_catalogue": {t:"The Keeper's system", x:"The catalogue is sorted not by subject or date, but by grief: the oldest sorrows at the bottom, the freshest at the top. Whoever kept it had stopped thinking of books as books."},
    "r2_hearthstone": {t:"A record of the Hearthstone", x:"A dry clerk's note: “The Hearthstone is to be tended night and day. It warms the land; it is said, too, that it keeps the people feeling. Without it, the old scholars warn, we would not grieve — nor love.”"},
    "r2_feast": {t:"A memory of a feast", x:"You stood at the edge of a palace feast in armour, not eating, watching the room. Someone laughed and called you by a name you couldn't catch. You were on duty, and you were happy."},
    "r2_crest": {t:"The crest", x:"The crest on your breastplate in the memory was a hearth crowned with a flame — the same seal carved on the milestones of the King's road. Whatever you were, you served the crown, and you served something close to its heart."},
    "r2_scholar": {t:"The scholar's sentence", x:"“We were not meant to forget.” The Faded scholar wrote it thousands of times, on every page he could find, until the ink ran out and his pen kept moving anyway."},
    "r2_flood": {t:"The flooding of the valley", x:"When the Grey came over the hills, the Keeper opened the old sluices and let the river drown the valley. The fog would not cross the water. The townsfolk who did not reach the hills in time were never counted."},
    "r2_threads": {t:"Bound memories", x:"The grey thread is not thread. It is a strand of the fog itself, spun fine, and it holds a memory in a book the way a net holds a fish. Whoever lost the memory doesn't know they lost it."},
    "r2_lamps": {t:"The drowned lamps", x:"The lamps along the causeway burn on something that isn't oil. Their makers' marks all lead to one source, deep below: a light that remembers being part of something greater."},
    "r2_keeper": {t:"The Keeper's rules", x:"A card nailed above a reading desk: “1. Nothing leaves. 2. Nothing is forgotten. 3. No one need grieve again.” The third rule was added later, in a different ink."},
    "r2_taken": {t:"The taken", x:"The spilled ink spells out names — travellers who came to the lake's edge, lost and grey. The Keeper brought them below and took what they remembered, one book at a time. He called it saving them."},
    "r2_page": {t:"A glowing page", x:"A single page torn from a lamp ledger, still faintly shining: “Light the lamps from the stone and the water will remember.” The stone is not named. Someone underlined it twice."}
  },
  campfire: [
    "You make camp on a dry landing, a ring of drowned shelves around you like a stone circle. Water drips somewhere, steady as a clock. The fire is small, and the books seem to lean toward it.",
    "Your clothes will not dry down here. You sit close to the flame, shivering, and listen to the pages rustle in a current you can't feel.",
    "You pick up a book at random to use as a pillow, then think better of it. Someone's whole life might be inside. You use your pack instead.",
    "Far below, a lamp flickers on and off, on and off, like someone signalling. You watch it until your eyes close. You don't know who would be signalling to you.",
    "You try to recall a single face from before Last Light. For a moment, something almost surfaces — then sinks again, like a stone in deep water.",
    "The silence down here is different from the forest's. It isn't empty. It is full of everything that's been written and never read again.",
    "You eat cold rations and read the spines nearest you by firelight: births, deaths, a book of recipes, a book of lullabies. You hum one without knowing how you know it."
  ],
  encounters: [
    {id:"r2_whispers", sites:["rooms","stacks"], x:"A shelf of books is whispering names — hundreds of them, soft and overlapping. One name keeps rising above the others, but you can't catch it.", c:[
      {t:"Read the spines in order to find the right one", s:"INT", dc:12, ok:"You follow the whispers spine by spine until one book falls silent in your hand. Inside is the history of this place.", no:"The names tangle together until your head aches. You walk away with nothing.", win:{lore:"r2_archive"}},
      {t:"Ignore the whispers", s:"DIS", dc:11, ok:"You fix your eyes forward and walk. The whispers follow, then fall behind.", no:"One name sounds almost like yours. You stop, and lose an hour listening."},
      {t:"Pull the whole shelf down to search", s:"STR", dc:13, ok:"The shelf crashes into the water, and in the wreck of the books you find what someone hid behind them.", no:"The shelf won't budge — then it does, all at once, onto your pack.", win:{loot:2}}
    ]},
    {id:"r2_rising", sites:["causeway","stacks"], x:"A low groan runs through the stone, and the water starts to rise — fast. It's at your knees. Then your waist.", c:[
      {t:"Swim for the stairs", s:"VIT", dc:12, ok:"You kick hard through the cold and haul yourself up the steps, gasping.", no:"The current drags you back twice. You make it, but your pack is half-drowned."},
      {t:"Stay calm and find the drain lever", s:"ORD", dc:12, ok:"You feel along the wall where the old plans said it would be. The lever grinds, and the water drains away.", no:"You find it — too late. You climb out soaked and shaking."}
    ]},
    {id:"r2_catalogue", sites:["stacks"], x:"A catalogue cabinet stands on a dry ledge, its drawers pulled out and its cards strewn everywhere, swollen and out of order. Someone was looking for something in a hurry.", c:[
      {t:"Sort it", s:"ORD", dc:11, ok:"Card by card, you rebuild the order — and realise what it's sorted by.", no:"Every card you place seems to move when you look away. You give up.", win:{lore:"r2_catalogue"}},
      {t:"Skim for anything about the Hearthstone", s:"INT", dc:12, ok:"One card, worn soft from handling, points to a clerk's note on the Hearthstone. You find it two shelves down.", no:"There's nothing — or rather, every card that might have mattered has been torn out.", win:{lore:"r2_hearthstone"}}
    ]},
    {id:"r2_feast", sites:["rooms"], x:"A book falls open in your hands, and suddenly you are not here. You are in the palace, at a feast, music and candlelight all around. You are in it — standing at the wall, in armour.", c:[
      {t:"Close it", s:"DIS", dc:12, ok:"You shut the book. The feast is gone, and you are alone in the cold again. It's better this way. Probably.", no:"Your hands won't obey. You stay in the memory until it spits you out, dizzy and drained."},
      {t:"Keep reading", s:"INT", dc:13, ok:"You stay inside the memory, watching yourself watch the room. You were on duty. You were happy.", no:"The memory turns on you, faces blurring, and you claw your way out exhausted.", win:{lore:"r2_feast"}},
      {t:"Notice the crest on your armour", s:"INT", int:4, ok:"Before the memory fades, you look down. On your breastplate: a hearth, crowned with a flame. You have seen that sign before.", win:{lore:"r2_crest"}}
    ]},
    {id:"r2_eels", sites:["causeway"], x:"Something moves in the dark water beside the causeway. Eels, long and pale, with grey eyes that catch your lamplight. They circle closer.", c:[
      {t:"Wade through quickly", s:"VIT", dc:11, ok:"You splash across before they decide what you are.", no:"They strike at your legs and your pack. You reach the far side lighter."},
      {t:"Lure them away with your rations", s:null, cost:1, ok:"You toss a strip of dried meat far out into the dark. The water boils, and you walk on in peace."},
      {t:"Fight", s:"STR", dc:13, ok:"You stamp and strike until the eels scatter. One coughs up something bright on the stones.", no:"They are faster than you, and there are more of them than you thought.", win:{loot:1}}
    ]},
    {id:"r2_scholar", sites:["rooms"], x:"A Faded scholar sits at a reading desk, writing the same sentence over and over. His pen ran dry long ago. It keeps moving.", c:[
      {t:"Read it", s:"INT", dc:11, ok:"You lean over his shoulder. “We were not meant to forget.”", no:"The words smear and swim. You can't make them out, and it unsettles you more than it should.", win:{lore:"r2_scholar"}},
      {t:"Take his pen", s:"DIS", dc:12, ok:"You ease the pen from his fingers. His hand goes still. He lets out a long breath, lays his head on the desk, and finally rests.", no:"His grip tightens and he keeps writing, faster, scratching the desk. You back away.", win:{next:1}}
    ]},
    {id:"r2_ladder", sites:["stacks"], x:"A library ladder hangs from a rusted rail high above the water. The top shelves are dry, and something up there catches the light.", c:[
      {t:"Work along the shelves methodically", s:"ORD", d:"normal", ok:"Shelf by shelf, row by row, until you find what was tucked behind the atlases.", no:"You search the wrong row for an hour.", win:{loot:1}},
      {t:"Climb the rusted ladder", s:"VIT", d:"hard", ok:"The ladder shrieks and sways, but holds. At the top is a traveller's stash, kept dry for years.", no:"A rung snaps. You fall into the water and climb out freezing.", win:{loot:2}}
    ]},
    {id:"r2_index", sites:["stacks"], x:"A great index book lies chained to a lectern, pages fat with damp. Cross-references run in every direction like roots.", c:[
      {t:"Follow the references", s:"INT", d:"normal", ok:"One reference leads to another, and another, and at last to the Keeper's own rules.", no:"The trail loops back on itself. You've been reading in circles.", win:{lore:"r2_keeper"}},
      {t:"Copy out the floor plan", s:"ORD", d:"easy", ok:"A sketch of the stacks is printed inside the cover. You copy it carefully. The next stretch will go easier.", no:"Your copy smudges in the damp until it's useless.", win:{next:2}}
    ]},
    {id:"r2_strongbox", sites:["stacks"], x:"A strongbox sits half-sunk among the shelves, its lid sealed by a lock of rotating letters. Someone has scratched a riddle on the side: “I am kept by giving, and lost by keeping.”", c:[
      {t:"Solve the riddle", s:"INT", d:"hard", ok:"“A promise,” you murmur, and spell it out. The lock clicks open on something precious.", no:"Every answer jams the dials tighter.", win:{loot:"rare"}},
      {t:"Pry it open", s:"STR", d:"normal", ok:"The hinges give with a wet crack. Most of it is ruined, but not all.", no:"The bar slips and your knuckles meet the shelf.", win:{loot:1}}
    ]},
    {id:"r2_mapcase", sites:["stacks"], x:"A tall map cabinet, its wide drawers swollen shut. One has been forced open. Inside, a chart of the valley as it was — farms, a river, a road — before the lake.", c:[
      {t:"Compare it to the lake above", s:"ORD", d:"normal", ok:"You line the old roads up with the causeway and find where the river was turned. The valley was drowned on purpose.", no:"The old landmarks are gone. You can't make the two maps agree.", win:{lore:"r2_flood"}},
      {t:"Notice the sluice marks in the margin", s:"INT", int:3, ok:"Tiny notes beside the dam: dates, depths, and the words “let them reach the hills first.” Then, below, crossed out: “No time.”", win:{lore:"r2_flood", supply:1}}
    ]},
    {id:"r2_alcove", sites:["stacks","rooms"], x:"A dry alcove behind a shelf, with a cot, a candle stub and a crate of tins. Someone lived here once. A note is pinned above the cot.", c:[
      {t:"Go through the crate carefully", s:"ORD", d:"easy", ok:"Most tins have rusted, but a few are sound. You pack them.", no:"You open the wrong tin. The smell drives you out.", win:{supply:1}},
      {t:"Read the note", s:"INT", d:"normal", ok:"A list of rules, in a hand that grows shakier as it goes on.", no:"The ink has bled into nothing.", win:{lore:"r2_keeper"}}
    ]},
    {id:"r2_lamps", sites:["causeway"], x:"Lamps line the causeway, burning blue beneath the surface of the water. Some have gone out. Between them, the dark is total.", c:[
      {t:"Wade out and relight the dead lamps", s:"VIT", d:"normal", ok:"The water numbs your arms to the shoulder, but one by one, the lamps catch. The path ahead is bright.", no:"The cold beats you. You stumble on in darkness.", win:{next:1}},
      {t:"Walk the dark stretches without hesitating", s:"DIS", d:"normal", ok:"You keep your eyes on the next light and never look down.", no:"In the dark, something brushes your leg. You panic, and drop what you were carrying."},
      {t:"Read the lamp-maker's mark", s:"INT", int:5, ok:"Every lamp bears the same tiny sign, and every sign points the same way: down, toward a single source.", win:{lore:"r2_lamps"}}
    ]},
    {id:"r2_breath", sites:["causeway"], x:"The causeway dips under the water for a long stretch. Far ahead, the stone rises again into the lamplight. There's no other way.", c:[
      {t:"Hold your breath and swim it", s:"VIT", d:"hard", ok:"Your lungs burn, your vision spots — and you burst up the other side, clutching a pouch you snagged on the way.", no:"You surface twice, choking, and lose half your pack to the deep.", win:{loot:2}},
      {t:"Find the air pockets under the arches", s:"ORD", d:"normal", ok:"You count the arches and surface beneath each one, steady and careful.", no:"You miscount, and the water closes over you where there should be air."}
    ]},
    {id:"r2_cold", sites:["causeway"], x:"The water here is waist-deep and colder than any you've known. Your legs go numb within a dozen steps. The far landing glimmers.", c:[
      {t:"Push on through the cold", s:"VIT", d:"normal", ok:"You clench your jaw and keep moving until the landing takes your weight.", no:"You lose feeling in your feet and have to stop, shaking, for too long."},
      {t:"Refuse to stop, whatever your body says", s:"DIS", d:"easy", ok:"Every part of you wants to stand still. You don't let it.", no:"You stop, just for a breath — and nearly don't start again."}
    ]},
    {id:"r2_dark", sites:["causeway"], x:"Your lantern gutters and dies. The dark down here is the thick kind, the kind that has weight. Somewhere, water laps against stone.", c:[
      {t:"Keep calm in the dark", s:"DIS", d:"normal", ok:"You breathe slowly until your eyes find the faint blue of the next lamp.", no:"Panic takes you. You run, and fall, and lose something in the water."},
      {t:"Count your steps back to the last landing", s:"ORD", d:"easy", ok:"Forty steps. A turn. Twelve more. You find the landing and relight your lamp.", no:"You lose count somewhere around thirty."}
    ]},
    {id:"r2_ferry", sites:["causeway"], x:"A Faded ferryman poles his flat boat in a slow circle, round and round in the dark water. There is room for one passenger.", c:[
      {t:"Step aboard and wait it out", s:"DIS", d:"normal", ok:"You ride three circles in silence, then step off at the right moment onto a ledge you could never have reached on foot.", no:"The circling lulls you. You come to yourself an hour later, chilled to the bone.", win:{next:1}},
      {t:"Take the pole and steer", s:"STR", d:"normal", ok:"You wrestle the pole from his hands and steer the boat to shore. He sits down in the stern and rests. Under the bench, a forgotten fare.", no:"The pole slips and you go overboard.", win:{loot:1}}
    ]},
    {id:"r2_bell", sites:["causeway"], x:"Beneath the water, a bell is tolling. Slow, deep, and somehow you can hear it in your chest. You feel a pull to step off the causeway toward it.", c:[
      {t:"Dive for the bell", s:"VIT", d:"hard", ok:"You dive into the cold and find the bell — and, tangled in its rope, a pouch of old offerings.", no:"The cold drives the breath from you. You surface gasping, empty-handed.", win:{loot:"rare"}},
      {t:"Resist the pull", s:"DIS", d:"normal", ok:"You grip the stone and wait until the tolling stops.", no:"You've taken three steps toward the edge before you notice."}
    ]},
    {id:"r2_echo", sites:["rooms"], x:"A book on a lectern is reading itself aloud — in your voice. It describes a morning you don't remember: bread, a warm kitchen, someone calling you in from the cold.", c:[
      {t:"Walk away before it finishes", s:"DIS", d:"normal", ok:"You leave it mid-sentence. It hurts more than you expect.", no:"You listen to the end. It doesn't say who was calling. You feel emptier than before."},
      {t:"Work out whose memory it really is", s:"INT", d:"normal", ok:"The dates are wrong for you. It's a stranger's morning, borrowed — and on the shelf behind it, a stranger's provisions.", no:"You can't tell. That is the worst part.", win:{supply:1}}
    ]},
    {id:"r2_thread", sites:["rooms"], x:"A slim book bound with grey thread lies warm on a reading table. Inside is a memory of a wedding — someone's whole joyful day, stitched shut.", c:[
      {t:"Study the binding", s:"INT", d:"normal", ok:"The thread is not thread. You understand now how the memories are kept here.", no:"The thread burns cold against your fingers. You drop the book.", win:{lore:"r2_threads"}},
      {t:"Unpick the thread and set it free", s:"DIS", d:"hard", ok:"The memory lifts from the page like warm breath and drifts away to find its owner. In the empty binding, a silver needle remains.", no:"The thread fights you. The memory tears, and you feel it go out like a candle.", win:{loot:"rare"}}
    ]},
    {id:"r2_summer", sites:["rooms"], x:"A memory takes hold of you as you pass a shelf: a hot summer field, a stranger's childhood, a river you've never swum. It's lovely. It doesn't want to let go.", c:[
      {t:"Pull yourself free", s:"DIS", d:"normal", ok:"You find the cold of the Archive again beneath the warmth, and step back into it.", no:"You wade in that river for hours. When you come back, your fire's out and your food's gone damp."},
      {t:"Find the page where it ends", s:"ORD", d:"easy", ok:"Every memory has an ending. You skip to it, and the field fades politely.", no:"There's no last page. You have to wait it out."}
    ]},
    {id:"r2_reader", sites:["rooms"], x:"A Faded woman turns the same page of the same book, back and forth, back and forth. Her bookmark has fallen to the floor.", c:[
      {t:"Mark her place for her", s:"ORD", d:"normal", ok:"You find the right page and slip the bookmark in. She closes the book and folds her hands, at rest. On the cover: the Archive's charter.", no:"You choose the wrong page. She keeps turning.", win:{lore:"r2_archive"}},
      {t:"Pass by quietly", s:"DIS", d:"easy", ok:"You let her be. Some things you can't fix today.", no:"The sound of the turning page follows you for an hour."}
    ]},
    {id:"r2_ink", sites:["rooms","stacks"], x:"A pot of ink has spilled across a desk, and the ink is moving — sliding into letters, then names, then more names.", c:[
      {t:"Read the names as they form", s:"INT", d:"normal", ok:"Travellers, scholars, a ferryman. All of them taken, all of them brought below.", no:"The ink runs faster than you can read and drips off the desk.", win:{lore:"r2_taken"}},
      {t:"Search the desk drawers", s:"ORD", d:"easy", ok:"Behind the blotter: a clerk's purse, never claimed.", no:"The drawers are full of ink. All of them.", win:{loot:1}}
    ]},
    {id:"r2_chair", sites:["rooms"], x:"A reading chair sits by a lamp that is still warm, a blanket folded over its arm. Everything about it says: sit, rest, read awhile.", c:[
      {t:"Refuse the comfort", s:"DIS", d:"normal", ok:"You know what happens to people who sit down in the Grey. You walk on, and you find a dropped satchel past the next shelf.", no:"You sit for just a moment. You wake hours later, your rations nibbled by something.", win:{loot:1}},
      {t:"Rest, but keep one foot in the cold water", s:"VIT", d:"easy", ok:"The chill keeps you awake. You rest your body without letting go of yourself.", no:"The cold creeps up your leg and leaves you shivering.", win:{supply:1}}
    ]},
    {id:"r2_flotsam", sites:["any"], x:"A raft of debris drifts past on a slow current: crates, a chair, a child's toy boat, a sodden coat with full pockets.", c:[
      {t:"Hook the crates in methodically", s:"ORD", d:"normal", ok:"One by one, you draw them in with a pole and pry them open.", no:"The current takes them out of reach.", win:{loot:1}},
      {t:"Swim out for the coat", s:"VIT", d:"normal", ok:"The water is bitter cold, but the pockets were worth it.", no:"You get the coat. The pockets are empty.", win:{supply:1}}
    ]},
    {id:"r2_seep", sites:["any"], x:"High above, a crack has opened in the old dam, and a thin grey mist is seeping through, trickling down the walls like smoke. Where it touches the water, the water goes still.", c:[
      {t:"Hold your breath and walk through", s:"DIS", d:"normal", ok:"You hold on to the thought of the next lamp and pass beneath it without breathing.", no:"You breathe in. For a while you forget where you were going."},
      {t:"Brace the crack shut", s:"STR", d:"hard", ok:"You jam broken shelving into the crack and lean until it seals. Wedged in the old mortar, you find a stonemason's lost tools.", no:"The shelving splinters and the mist pours over you.", win:{loot:2}}
    ]}
  ],
  story: [
    {id:"r2_maren_kind", at:2, who:"maren", sites:["any"], req:{flag:"helped_maren"}, x:"A little boat noses out of the dark, a lantern hanging from its bow. Maren, the one-eyed cartographer, is mapping the lake. She sees you and her mouth twitches. “Look who it is. Still alive, then.”", c:[
      {t:"Share her lantern a while", s:null, ok:"She lets you warm your hands at her lantern and passes you a heel of bread without comment. “Don't make it weird,” she says.", win:{supply:1}}
    ]},
    {id:"r2_maren_cold", at:2, who:"maren", sites:["any"], req:{noflag:"helped_maren"}, x:"A little boat noses out of the dark, a lantern hanging from its bow. Maren, the one-eyed cartographer, is mapping the lake. She sees you and her face closes like a door. “Oh. You.”", c:[
      {t:"Let her row on", s:null, ok:"She dips her oars and turns away without another word. Her light grows small in the dark, and then it's gone."}
    ]},
    {id:"r2_maren_book", at:6, who:"maren", sites:["any"], x:"You find Maren in the Reading Rooms, sitting on the floor with a small book open in her lap. It's full of wobbly little maps, in a child's hand. Her hand. She has gone very quiet.", c:[
      {t:"Sit down beside her", s:null, ok:"You don't say anything. After a while she leans her shoulder against yours. “I don't remember drawing these,” she says. “I don't remember who I drew them for.”", win:{set:"comforted_maren"}},
      {t:"Press on", s:null, ok:"You leave her there. When you glance back, she's still staring at the same page."}
    ]}
  ],
  corwin: [
    {id:"r2_corwin_page", sites:["any"], x:"A familiar crow swoops past, a glowing page clamped in his beak. He lands just out of reach. “Found it,” says Corwin, muffled. “Finders keepers. Unless you'd like to make an offer.”", c:[
      {t:"Pay him with a trinket", s:null, ok:"He drops the page and snatches the trinket in one smooth motion. “Pleasure doing business. Mostly the business part.”", win:{fed:1, lore:"r2_page"}},
      {t:"Grab for the page", s:"STR", d:"normal", ok:"You snatch it from his beak. He shrieks something unrepeatable and flaps off.", no:"He hops back, and you land face-first in cold water. “Hah,” says Corwin.", win:{lore:"r2_page"}},
      {t:"Pretend you don't care", s:null, ok:"“Fine,” he says, and swallows a corner of it out of spite. “It was boring anyway.”"}
    ]}
  ],
  finale: {
    name: "The Lamp Room",
    intro: "The key turns, and the last door opens on a vast drowned chamber full of light. Lamps hang everywhere, each one burning blue around a page. At the centre, half-sunk in the water, stands a man wrapped in paper like a mummy in bandages, holding a lamp that blazes with the Shard of Memory. He will not let a single memory go — not even the ones that hurt.",
    stages: [
      {id:"r2_fin_whirl", sites:["any"], x:"The Archivist raises his lamp and the water begins to turn. Pages rise from every shelf and whirl around you in a storm — names, faces, birthdays, funerals — all of them cutting like paper does.", c:[
        {t:"Fight through the current", s:"VIT", d:"normal", ok:"You lean into the whirlpool and wade through it, step by brutal step, until the storm breaks around you.", no:"The current spins you off your feet and drags you under the swirling pages."},
        {t:"Close your mind to the memories", s:"DIS", d:"normal", ok:"A thousand lives scream for your attention. You give them none, and walk calmly through the eye of the storm.", no:"One memory catches you — a stranger's funeral — and you stand weeping in the water while the pages cut."}
      ]},
      {id:"r2_fin_argue", sites:["any"], x:"“Every memory is safe here,” the Archivist says, his voice dry as old paper. “No one will forget. No one will lose anyone again.” Behind him, the bound books tremble.", c:[
        {t:"Argue that memory must be lived, not kept", s:"INT", d:"normal", ok:"“Remembering is something people do,” you say. “You've taken it from them.” His lamp trembles.", no:"He has an answer for everything. He has had years to prepare."},
        {t:"Turn his own rules against him", s:"INT", d:"hard", ok:"“No one need grieve again,” you quote. “Then why are you grieving?” For the first time, he has no answer.", no:"He shakes his head. “You don't understand,” he says, and the pages close in."},
        {t:"Read him his unsent letter", s:null, frag:10, ok:"“My girl — be angry. Be anything. Just don't fade.” The Archivist goes utterly still. “Where did you find that?” he whispers."}
      ]},
      {id:"r2_fin_letgo", sites:["any"], x:"The Archivist clutches the lamp to his chest, and the Shard of Memory blazes inside it. “If I let go,” he says, “they'll forget. She'll forget. I'll be nothing.”", c:[
        {t:"Tell him to let go", s:"DIS", d:"normal", ok:"You hold his gaze and do not look away. “It's not yours to keep,” you say. His fingers loosen, one by one.", no:"His grip tightens and the lamp flares, throwing you back into the water."},
        {t:"Hold his hands until they open", s:"DIS", d:"hard", ok:"You wrap your cold hands around his paper ones and wait, as long as it takes. At last, he lets go.", no:"Paper cuts your palms and you lose your grip."},
        {t:"Let Maren speak", s:null, flag:"helped_maren", ok:"Maren steps out of the dark beside you, her map case on her back. She looks at the Archivist for a long moment. “Whoever you are,” she says quietly, “you can put it down now.” He does."}
      ]}
    ],
    after: null,
    win: "The Archivist lets go. The lamp gutters, and every page in the Lamp Room rises at once and flies upward through the water like a flock of white birds. Across the drowned valley and beyond it, the Faded lift their heads and remember their names, just for a moment. Maren, who has followed the light down to the doorway, sees the old man as he dissolves into light, and her face changes. She remembers him. She says nothing for a long time. Then: “Let's keep moving.”",
    last: "As you climb back toward the surface, a memory of your own rises with you: you, standing on a tower wall at night, watching the great flame of the capital burn on the horizon.",
    lose: "The pages close over you like water, and you surface far from the Lamp Room, gasping, your supplies gone. The lamps will burn on below. You can try again tomorrow.",
    skipIf: null,
    skipText: ""
  }
};

EXP_REGIONS[3] = {
  n: 3,
  name: "Ironpeak Pass",
  tagline: "A high mountain road where a whole village stands frozen in a single moment.",
  gate: {STR:3},
  guardian: "Hrumm the Frost Giant",
  shard: "Shard of Strength",
  intro: "The road climbs out of the grey lowlands into snow that squeaks underfoot. Somewhere above, the village of Holtvar sits on the pass, silent under a skin of blue ice. The wind carries a deep voice down the slopes, talking to no one. Your breath freezes on your scarf before you have gone a mile.",
  sites: [
    {id:"switchbacks", name:"The Switchbacks", stats:["STR","VIT"], desc:"A narrow road folding back and forth up the cliff, buried in drifts."},
    {id:"holtvar", name:"Holtvar", stats:["ORD","DIS"], desc:"A village frozen mid-laugh, every face turned toward a hearth."},
    {id:"stair", name:"The Giant's Stair", stats:["STR","INT"], desc:"Steps cut for feet ten times your size, carved with runes and hollowed by ice caves."}
  ],
  acts: ["The Cold Road", "Holtvar", "The Giant's Watch"],
  fragments: [
    {t:"A frozen messenger", x:"A courier sits against a milestone, rimed white, a letter still clutched in his glove. You ease it free. It says only: “Hrumm will protect us.”"},
    {t:"Giant footprints", x:"Prints the size of a cart are pressed into the bare stone itself, as if rock were mud to whoever walked here. They lead up, always up, toward the village."},
    {t:"A frozen bell", x:"Holtvar's bell hangs tilted in its tower, caught mid-swing. A cone of ice spills from its mouth like the shape of a sound that never finished."},
    {t:"An ice-locked shrine", x:"A wayside shrine is sealed in ice to the roof. On its step, unfrozen and dry, someone has left a fresh offering of tea leaves."},
    {t:"The family at supper", x:"Through a frosted window: a family frozen around a dinner table, spoons halfway to their mouths. The father is mid-story. The youngest is laughing so hard her eyes are shut."},
    {t:"The list of names", x:"Gouged into the side of a barn, high above any human reach, is a list of every villager's name. Each one has been scratched over and over, as if someone traced them every night so as not to forget."},
    {t:"A mother's note", x:"Nailed inside a door, written in a hurried hand: “Don't let them fade. Freeze us if you must.” The ink is smeared where it was folded wet."},
    {t:"Tracks up the mountain", x:"Sandal prints, unhurried, climb past the last house toward the summit. Behind them the snow has gone grey and soft, as if the fog walked in his footsteps."},
    {t:"The mountain's song", x:"Carved along a cliff, the verses of a slow giant's song: a song about stone keeping watch over small warm things. You can almost hear the low hum it was meant to be sung in."},
    {t:"Light in the ice", x:"A crack runs through a glacier wall, and deep inside it something burns a steady, stubborn gold. The shard. It is the only warm colour for miles."},
    {t:"The thaw-rune", x:"Beneath an overhang, a single rune is carved and recarved, never finished, as if its maker kept starting and losing his nerve. You trace it with a mitten. It means: wake."},
    {t:"Hrumm's promise", x:"Cut deep into a cliff above Holtvar, in letters taller than you: “Not one of them. Not one.”"}
  ],
  lore: {
    "r3_alive": {t:"They are still breathing", x:"The frozen of Holtvar are not dead. Their chests rise once every long while, slow as the turning of seasons. Whatever Hrumm did, he did it to keep them, not to bury them."},
    "r3_icefire": {t:"The frozen fire", x:"The ice here was not made by cold. It is a binding, sung into being, that stops a moment and holds it. A fire caught inside such ice burns forever and warms nothing."},
    "r3_joke": {t:"Hrumm's old joke", x:"Why did the mountain never lose an argument? Because it always took the high ground. The giant tells it again and again, and laughs alone each time, a little longer than the joke deserves."},
    "r3_cairn": {t:"The climbers' cairn", x:"Every traveller who crossed the pass added a stone and scratched a name. The newest names are years old. The last one reads only: “Turned back. Sorry.”"},
    "r3_stairmakers": {t:"The stairmakers", x:"The Giant's Stair was cut by Hrumm's kin, long gone into the deep north. The warning rune beneath the first step reads: “Walk slowly. The mountain is listening.”"},
    "r3_ledger": {t:"The village ledger", x:"Holtvar's ledger records births, weddings and lambs in a neat hand. The last page lists the Grey's approach in miles, a little closer each day, and then simply stops."},
    "r3_bride": {t:"The bride at the chapel door", x:"She was caught mid-step, flowers in one hand, the other reaching back for someone who never reached her. Her groom stands frozen at the bottom of the hill, running."},
    "r3_tracks": {t:"The monk's footsteps", x:"The prints never slip or hurry, even on the ice. Wherever they pass, the snow loses its sparkle and the cold stops biting. It feels less like warmth than like no longer minding."},
    "r3_icecave": {t:"Shapes in the ice", x:"The cave walls hold old things frozen long ago: a sledge, a goat, a giant's carved spoon. Hrumm keeps everything he loves this way. It is the only way he knows."},
    "r3_tally": {t:"The giant's tally", x:"Scratched inside a giant's cup: rows of marks, one for each day of watch. Somewhere past the thousandth mark the lines start to wander, and words creep in: “still here” and “no answer.”"},
    "r3_hum": {t:"The giants' hum", x:"Giants did not sing words to the mountain spirits; they hummed, low enough to feel in the stone. The spirits of the snow still remember it, even gone grey. Some part of them still wants to be called home."},
    "r3_climber": {t:"The climber below the ice line", x:"He reached the edge of Hrumm's frost a heartbeat too late. The Grey took him instead, and now he reaches for the same handhold forever, one step short of being saved."}
  },
  campfire: [
    "Your fire is small against the dark, and the mountain is large. You feed it twig by twig, as carefully as if it were the last one in the world.",
    "Far above, the giant's voice rolls down the slope, mid-story. He pauses for a laugh that never comes, then goes on. You find yourself listening for the ending.",
    "You warm your hands and think of the frozen family at their supper. Their soup must have been hot, once. You wonder who made it.",
    "The snow falls so softly it makes no sound at all. You keep checking that you can still feel your fingers, and that you still care whether you can.",
    "You dream of a high wall and a long watch, and wake with your hand on a sword you don't carry. The fire has burned low. You build it back up.",
    "Somewhere in the dark a frozen bell creaks under the weight of its own ice. It sounds almost like it wants to ring.",
    "You count your supplies twice, then a third time. Up here, every crust of bread is a promise to yourself that you'll keep going."
  ],
  encounters: [
    {id:"r3_icewall", sites:["switchbacks","stair"], x:"A wall of blue ice blocks the path, smooth as glass and twice your height. Old giant-runes show through it like fish under a frozen pond.", c:[
      {t:"Climb it", s:"STR", dc:14, ok:"You hack handholds and haul yourself over the lip, arms burning.", no:"Your grip fails halfway and you slide back down in a shower of ice."},
      {t:"Read the giant-runes for a hidden door", s:"INT", dc:15, d:"hard", ok:"The runes mark a door, and behind it a giant's cache of old travel gear.", no:"The runes blur under the ice; you lose an hour and most of your warmth.", win:{loot:2}},
      {t:"Make a careful route with pitons", s:"ORD", dc:13, d:"easy", ok:"Piton by piton, you build a ladder up the ice and cross safely.", no:"A piton pops loose and clatters away into the drop, taking a pack strap with it."}
    ]},
    {id:"r3_blizzard", sites:["switchbacks"], x:"The sky goes white all at once. The wind screams up the switchbacks and you can't see your own boots.", c:[
      {t:"Push through", s:"VIT", dc:14, ok:"Head down, step by step, you march out the far side of the storm.", no:"The cold gets into your bones; you stumble on, chewing through rations just to stay warm."},
      {t:"Dig a snow shelter and wait", s:"ORD", dc:14, ok:"Your snow hole is snug and quiet; you even find time to dry a pack of food.", no:"The shelter collapses twice before the storm passes.", win:{supply:1}}
    ]},
    {id:"r3_rams", sites:["switchbacks","stair"], x:"Grey-eyed rams stand on the narrow ledge ahead, unmoving, staring at nothing. One of them turns its head toward you, slowly.", c:[
      {t:"Shove past", s:"STR", dc:14, ok:"You shoulder through; the rams barely notice.", no:"A ram leans back into you, and a pack slips over the edge."},
      {t:"Wait them out", s:"DIS", dc:14, ok:"You stand as still as they do until, one by one, they drift away.", no:"The waiting gets into you — the stillness feels good, too good. You shake yourself loose, colder than before."},
      {t:"Climb around", s:"VIT", dc:16, d:"hard", ok:"You scale the cliff face above them and find an old climber's stash in a crevice.", no:"The rock is rotten with frost; you come down hard and shaken.", win:{loot:"rare"}}
    ]},
    {id:"r3_avalanche", sites:["switchbacks"], x:"A low rumble, felt more than heard. High above, the snowfield cracks into a long dark line.", c:[
      {t:"Sprint for the rock overhang", s:"VIT", d:"normal", ok:"You dive under the overhang as the slope thunders past, and come out shaking but whole.", no:"The edge of the slide catches you and rolls you downhill with half your gear."},
      {t:"Read the snow and take the safe line", s:"ORD", d:"easy", ok:"You pick the ridge the snow won't cover and walk it calmly while the world falls beside you.", no:"Your safe line isn't; you scramble clear at the last moment."},
      {t:"Brace behind a boulder and ride it out", s:"STR", d:"hard", ok:"You hold on through the roar, and when it passes the slide has torn open a buried trader's sled.", no:"The snow tears you loose and buries you to the chest. Digging out costs you dearly.", win:{loot:2}}
    ]},
    {id:"r3_crevasse", sites:["switchbacks","stair"], x:"A snow bridge spans a crevasse, sagging in the middle. Below it is nothing but blue, going down forever.", c:[
      {t:"Take a run and leap", s:"STR", d:"normal", ok:"You land hard on the far side, laughing in spite of yourself.", no:"You land short and claw your way up, leaving supplies in the dark."},
      {t:"Rope up and probe every step", s:"ORD", d:"normal", ok:"Your pole finds the solid parts; you cross without a sound.", no:"The rope snags and you lose time and a bundle working it free."},
      {t:"Crawl across flat on your belly", s:"VIT", d:"easy", ok:"Spread out on the snow, you inch over. Cold, slow, and safe.", no:"The cold soaks through your coat and into your chest."}
    ]},
    {id:"r3_mule", sites:["switchbacks"], x:"A pack mule stands frozen in the middle of the road, one hoof raised, saddlebags still buckled. Its ears are pricked as if it heard its name.", c:[
      {t:"Chip the saddlebags free", s:"STR", d:"normal", ok:"The ice gives with a crack, and the bags hold good, dry food.", no:"You hammer at the ice until your hands ache, and get nothing.", win:{supply:2}},
      {t:"Take only what you can reach and go", s:"DIS", d:"easy", ok:"You slip a single parcel from the top bag and leave the rest for whoever comes for the mule.", no:"You can't stop looking at its patient eyes. You leave with nothing.", win:{supply:1}}
    ]},
    {id:"r3_thin_air", sites:["switchbacks"], x:"The air grows thin. Every step takes two breaths, and a soft voice in your head suggests you sit down, just for a moment.", c:[
      {t:"Keep a slow, steady pace", s:"VIT", d:"normal", ok:"Step, breathe, step. The voice fades as the road levels out.", no:"You have to stop again and again, eating into your food to keep going.", win:{next:1}},
      {t:"Refuse to sit down", s:"DIS", d:"hard", ok:"You don't sit. You never sit. At the top of the rise, a forgotten bundle lies in the snow where someone else did.", no:"You sit. When you stand again, you can't say how long it's been.", win:{loot:1, supply:1}}
    ]},
    {id:"r3_cairn", sites:["switchbacks","stair"], x:"A tall cairn marks the highest bend, every stone scratched with a name. Snow has piled against its windward side like a drift of feathers.", c:[
      {t:"Add a stone and read the names", s:"INT", d:"normal", ok:"You add your stone without a name, then read the others until your eyes sting.", no:"The letters are too worn; the wind steals your patience.", win:{lore:"r3_cairn"}},
      {t:"Dig at its base for the climbers' cache", s:"ORD", d:"normal", ok:"Climbers always leave something. You find hard bread and a flask of oil.", no:"You dig in the wrong place until your fingers go numb.", win:{supply:2}}
    ]},
    {id:"r3_child", sites:["holtvar"], x:"A frozen child stands in the lane, holding out a snowball, smiling. Her mittens don't match.", c:[
      {t:"Look away and keep going", s:"DIS", dc:13, ok:"You don't look back. It's harder than any climb today.", no:"You look back. Her smile follows you all afternoon."},
      {t:"Search the house for supplies", s:"ORD", dc:14, ok:"Her family's larder is full and frozen; you take what will thaw.", no:"Every drawer is iced shut, and you give up empty-handed.", win:{supply:1, loot:1}},
      {t:"Notice she's still breathing, very slowly", s:null, int:5, ok:"You wait, and wait — and see a tiny cloud of breath leave her lips. She's alive. They all are.", win:{lore:"r3_alive"}}
    ]},
    {id:"r3_tavern", sites:["holtvar"], x:"In the tavern, a dozen villagers are frozen around one table, mugs raised in a toast. Someone has just said something wonderful.", c:[
      {t:"Search behind the bar", s:"ORD", d:"normal", ok:"Under the counter: dried meat, a wheel of cheese and a forgotten purse.", no:"You knock over a frozen jug and spend the time picking up shards.", win:{supply:1, loot:1}},
      {t:"Sit among them for a moment", s:"DIS", d:"hard", ok:"You raise an empty hand to their toast, and leave before the stillness can keep you. In the empty chair, someone left a gift for a friend who never came.", no:"The quiet is so warm. It takes you far too long to stand up.", win:{loot:"rare"}}
    ]},
    {id:"r3_smithy", sites:["holtvar"], x:"The smith is frozen mid-swing over a horseshoe that still glows dull red inside the ice. Tools hang in neat rows along the wall.", c:[
      {t:"Go through the tool racks methodically", s:"ORD", d:"normal", ok:"Among the hooks and tongs you find good iron fittings and a sturdy flint.", no:"Everything is frozen to the wall. You come away with a split nail.", win:{loot:1}},
      {t:"Pry the hammer from his hands", s:"STR", d:"hard", ok:"The ice cracks and the hammer comes free — finely made, and still faintly warm.", no:"The ice won't give, and you wrench your shoulder trying.", win:{loot:"rare"}}
    ]},
    {id:"r3_dog", sites:["holtvar"], x:"A dog wasn't frozen with the rest. It walks a slow circle around the well, grey-eyed, wagging at no one.", c:[
      {t:"Kneel and speak to it calmly", s:"DIS", d:"normal", ok:"It stops circling and leans against your leg for a long moment before wandering home.", no:"It doesn't see you at all. Watching it, you feel the circle trying to catch you too.", win:{next:1}},
      {t:"Lure it with a scrap of food", s:"ORD", d:"easy", cost:1, ok:"It follows your scrap to a cellar door and scratches — inside is a family's hidden store.", no:"It eats the scrap and goes back to circling.", win:{supply:2}}
    ]},
    {id:"r3_grey_square", sites:["holtvar"], x:"The Grey seeps up from the valley into the market square, curling around frozen ankles. Where it touches the ice, the faces inside go dull.", c:[
      {t:"Cross through the fog without stopping", s:"DIS", d:"hard", ok:"You walk straight through, holding your own name in your head like a coal. On the far side, a dropped satchel waits.", no:"Halfway across you stop and stand there, smiling at nothing, until the cold wakes you.", win:{loot:1, supply:1}},
      {t:"Map a route along the rooftops", s:"ORD", d:"normal", ok:"Eaves to eaves, you go over the fog instead of through it.", no:"A gutter gives way; you drop into the edge of the Grey and climb out shaking."}
    ]},
    {id:"r3_ledger", sites:["holtvar"], x:"The village hall door stands open. On the reeve's desk a ledger lies open under a thin glaze of frost.", c:[
      {t:"Read the last pages", s:"INT", d:"normal", ok:"You thaw the pages with your breath and read Holtvar's last days.", no:"The ink has run; you can read only the word ‘closer’, again and again.", win:{lore:"r3_ledger"}},
      {t:"Search the storeroom behind the hall", s:"ORD", d:"easy", ok:"The village's winter stores, neatly labelled. You take a little and leave the rest.", no:"The storeroom is ice from floor to ceiling.", win:{supply:1}}
    ]},
    {id:"r3_bride", sites:["holtvar"], x:"A bride is frozen mid-step at the chapel door, a bunch of mountain flowers in her hand. The flowers are still blue.", c:[
      {t:"Stop and look at her face", s:"DIS", d:"normal", ok:"You look, and let it hurt, and walk on.", no:"You can't bear it; you turn away so fast you slip on the chapel steps.", win:{lore:"r3_bride"}},
      {t:"Search the chapel", s:"ORD", d:"normal", ok:"Behind the altar: candles, oil and the wedding gifts, wrapped in ribbon.", no:"The pews are frozen together and the vestry door won't open.", win:{loot:1}}
    ]},
    {id:"r3_hearths", sites:["holtvar"], x:"Every house in Holtvar has a hearth, and every hearth holds a fire frozen at full flame. None of them give off any heat.", c:[
      {t:"Build a real fire beside a frozen one", s:"ORD", d:"normal", ok:"Your little fire crackles next to the still one. It feels like company. You rest and eat well.", no:"Damp wood, numb fingers. The match dies and so does your mood.", win:{supply:1, shield:1}},
      {t:"Stand at the window and keep watch instead", s:"DIS", d:"easy", ok:"You watch the road for an hour. Nothing comes. You leave rested and sharp.", no:"Watching the empty road, your thoughts drift somewhere grey.", win:{next:1}}
    ]},
    {id:"r3_firecave", sites:["stair"], x:"A cave off the Stair holds a campfire still burning — but frozen in place, its flames caught like glass.", c:[
      {t:"Warm your hands anyway", s:"VIT", dc:12, ok:"It gives no heat, but sitting out of the wind does you good.", no:"The cave is colder than the mountain. You leave stiffer than you came.", win:{supply:1}},
      {t:"Study the ice magic", s:"INT", dc:14, ok:"You trace how the ice was sung around the flame, and understand a little of what Hrumm did.", no:"The patterns slide away whenever you think you've grasped them.", win:{lore:"r3_icefire"}}
    ]},
    {id:"r3_runesteps", sites:["stair"], x:"The next twenty steps are carved with runes. When you test the first, it glows faintly and the ice above you groans.", c:[
      {t:"Work out the safe sequence", s:"INT", d:"normal", ok:"You step only on the runes that speak of going up. At the top, a niche holds an old offering.", no:"You guess wrong. A sheet of ice slides from above and you barely dodge it.", win:{loot:1}},
      {t:"Jump the steps two at a time", s:"STR", d:"hard", ok:"You bound up the Stair before the mountain can make up its mind.", no:"You miss a step and slam into the stone, scattering supplies.", win:{skip:1}},
      {t:"Read the warning cut beneath the first step", s:null, int:4, ok:"An old warning, for anyone who can read it. You climb slowly, and the mountain lets you.", win:{lore:"r3_stairmakers"}}
    ]},
    {id:"r3_boulder", sites:["stair"], x:"A block of stone the size of a cottage has slid across the Stair. A thin gap runs underneath, rimed with frost.", c:[
      {t:"Heave it aside", s:"STR", d:"hard", ok:"It shifts, then rolls, booming down the mountain. Beneath it lies a crushed but rich trader's pack.", no:"It won't budge, and you've spent your strength trying.", win:{loot:2}},
      {t:"Squeeze through the gap", s:"VIT", d:"normal", ok:"You exhale and wriggle through, scraped but fine.", no:"You get stuck halfway and have to shed half your pack to get free."}
    ]},
    {id:"r3_icecave", sites:["stair"], x:"An ice cave opens off the Stair, its walls full of dim shapes. Something big is frozen in the back, and it isn't moving.", c:[
      {t:"Study the shapes in the walls", s:"INT", d:"normal", ok:"Sledge, goat, spoon. Not a monster's larder — a giant's keepsakes.", no:"The shapes swim in the blue. You leave uneasy.", win:{lore:"r3_icecave"}},
      {t:"Smash through the far wall as a shortcut", s:"STR", d:"normal", ok:"The ice breaks into a tunnel that comes out three bends higher.", no:"The wall holds; your axe-hand goes numb.", win:{skip:1}}
    ]},
    {id:"r3_giant_cup", sites:["stair"], x:"A stone cup big as a wagon lies on its side on a landing, half full of snow. Scratches cover the inside.", c:[
      {t:"Read the scratches", s:"INT", d:"normal", ok:"Day marks, thousands of them, and then words.", no:"The scratches are too many; your eyes swim.", win:{lore:"r3_tally"}},
      {t:"Search the landing methodically", s:"ORD", d:"easy", ok:"Wedged behind the cup is a forgotten bundle of firewood and dried fruit.", no:"Only snow, and more snow.", win:{supply:1}}
    ]},
    {id:"r3_icewraiths", sites:["stair","switchbacks"], x:"Grey shapes drift down the Stair — snow-spirits gone dull and cold-eyed. They pass through anything warm and leave it shivering.", c:[
      {t:"Swat them apart", s:"STR", d:"normal", ok:"They burst like breath on glass. The Stair is clear.", no:"One passes through you, and for a moment you forget why you're climbing."},
      {t:"Recognise the old ward carved on the wall", s:"INT", d:"easy", ok:"You step into the ward's circle, and the shapes flow around you.", no:"The ward is half-erased; you guess wrong."},
      {t:"Hum the low hum the giants used", s:null, int:6, ok:"The spirits slow, then turn and drift back up toward the summit, as if remembering a song.", win:{lore:"r3_hum", next:1}}
    ]},
    {id:"r3_hrumm_voice", sites:["any"], x:"Hrumm's voice booms down the mountain, telling an old joke to no one. He gets to the punchline and waits.", c:[
      {t:"Shout back", s:null, ok:"You shout that it's a terrible joke. The whole mountain shakes with his laughter, and something comes tumbling down the slope to you.", win:{gift:1}},
      {t:"Stay silent and slip past", s:"DIS", dc:14, ok:"You slip by unheard, and hear him tell it again, all the way through.", no:"You laugh despite yourself. The voice falls silent — and then the ice above you starts to slide.", win:{lore:"r3_joke"}}
    ]},
    {id:"r3_grey_bank", sites:["any"], x:"A bank of Grey rolls up the valley below you, faster than fog should move. The wind is pushing it straight toward you.", c:[
      {t:"Outrun it uphill", s:"VIT", d:"normal", ok:"Lungs on fire, you climb until the Grey thins and falls back.", no:"It catches you; you stagger out of it later, with a gap in your memory and your pack lighter."},
      {t:"Hold your ground and let it pass", s:"DIS", d:"normal", ok:"It washes over you. You say your own name, over and over, until it's gone.", no:"For a while you don't remember why you were holding your ground."},
      {t:"Find the high, windward ridge", s:"ORD", d:"easy", ok:"You reach the ridge where the wind is strongest. The Grey can't climb it.", no:"You choose the wrong ridge; it's sheltered, and the fog pools around you."}
    ]},
    {id:"r3_frostbite", sites:["any"], x:"Your fingers have gone white and you can't feel your toes. The cold is patient, and it is winning.", c:[
      {t:"Stop and rub the warmth back", s:"VIT", d:"easy", ok:"It burns as the blood returns, which means it's working.", no:"The feeling comes back slowly, and you lose time and food to the effort."},
      {t:"Bind your hands and feet properly", s:"ORD", d:"normal", ok:"Dry cloth, tight wraps, a pinch of grease. You'll be fine for the next stretch.", no:"Your bindings come loose within the hour.", win:{shield:1}}
    ]},
    {id:"r3_faded_climber", sites:["any"], x:"Just below the frost line, a Faded climber clings to the rock, reaching for the same handhold over and over. The ice stops a hand's breadth above him.", c:[
      {t:"Lift him down to the path", s:"STR", d:"normal", ok:"You prise him from the rock and set him down gently. He stops reaching, and stands looking at the mountain.", no:"He won't let go, and you nearly fall trying.", win:{lore:"r3_climber"}},
      {t:"Take the rope coiled at his belt", s:"ORD", d:"easy", ok:"Good rope, barely used. He doesn't need it any more.", no:"The rope is frozen solid to his harness.", win:{loot:1}}
    ]}
  ],
  story: [
    {id:"r3_oswin_fire", at:4, who:"oswin", sites:["any"], x:"Brother Oswin sits cross-legged in the snow beside a small fire, grey robes untouched by the cold. He offers to share his fire. “The giant fights so hard. Why? They'd be at peace if he'd just let go.”", c:[
      {t:"Accept and sit with him", s:null, ok:"His fire is warm and his tea is better. He asks nothing of you, and that is somehow the strangest part.", win:{set:"shared_with_oswin"}},
      {t:"Decline and walk on", s:null, ok:"He nods as if he expected it. “Another time, then. The mountain is very patient.”"}
    ]},
    {id:"r3_oswin_tracks", at:8, who:"oswin", sites:["any"], x:"Oswin's fire is cold and he is gone. His tracks lead up the mountain, calm and even — and the Grey follows them, filling each footprint like water.", c:[
      {t:"Follow the tracks a little way", s:"VIT", d:"normal", ok:"You trail him up to a bend, where his prints simply stop at the edge of the fog.", no:"The cold beside his trail is wrong somehow, and you turn back weary.", win:{lore:"r3_tracks"}},
      {t:"Keep your distance from the fog", s:"DIS", d:"easy", ok:"You give the trail a wide berth and climb your own way, clear-headed.", no:"Even at a distance, the quiet along his path pulls at you.", win:{next:1}}
    ]}
  ],
  corwin: [
    {id:"r3_corwin_grumble", sites:["any"], x:"Corwin lands on your pack, fluffed up to twice his size. “Cold. Cold, cold, cold. My beak is cold. My feet are cold. Whose idea was a mountain? Not mine.” He complains about the cold for the rest of the climb.", c:[
      {t:"Give him something shiny to cheer him up", s:null, ok:"“...Fine. This helps. Slightly.” He tucks it away, and something glints in the snow behind you next morning.", win:{fed:1, gift:1}},
      {t:"Let him grumble", s:null, ok:"He grumbles about the wind, the snow, the giant, your walking speed and your hat. Then he flies off, still grumbling."}
    ]},
    {id:"r3_corwin_stone", sites:["any"], req:{fedMin:2}, x:"Corwin drops onto your shoulder and complains about the cold for an entire mile. Then, without a word, he drops a smooth stone into your hand. It's warm.", c:[
      {t:"Take the warm stone", s:null, ok:"“Don't make it a thing,” he says. “Found it. Was in the way.” Your hands stay warm until nightfall.", win:{supply:1}}
    ]}
  ],
  finale: {
    name: "The Giant's Watch",
    intro: "Above Holtvar, Hrumm stands on the summit like a second mountain, half-turned to ice. Snow crusts his shoulders and his eyes are full of frost. In his chest, the Shard of Strength burns gold. He sees you, and his voice shakes the pass: “No one goes near them. No one.”",
    stages: [
      {id:"r3_fin_hail", sites:["any"], x:"Hrumm swings his fist, and the sky fills with hail the size of stones. He isn't aiming to kill — just to drive you back down the mountain.", c:[
        {t:"Weather the storm and keep walking", s:"VIT", d:"normal", ok:"The ice batters you, but you keep coming, one step at a time.", no:"You're driven back down the slope, bruised and freezing."},
        {t:"Smash a path through the falling ice", s:"STR", d:"normal", ok:"You break the hail apart as it lands and push forward through the shards.", no:"There's too much of it; you go down under a hail of ice."}
      ]},
      {id:"r3_fin_arm", sites:["any"], x:"He reaches for you, and you grab hold. His arm is a cliff of frozen skin, and the shard burns at the top of it.", c:[
        {t:"Climb his arm hand over hand", s:"STR", d:"normal", ok:"You haul yourself up past his elbow to his shoulder, where the shard's light is warm on your face.", no:"He shakes, and you fall into a drift far below."},
        {t:"Hold on as he roars and shakes", s:"DIS", d:"normal", ok:"You close your eyes and don't let go, no matter how the world spins.", no:"His roar fills your head until you let go without meaning to."}
      ]},
      {id:"r3_fin_convince", sites:["any"], x:"You're face to face with him now, close enough to see his tears frozen on his cheeks. “If I let go, the Grey takes them,” he says. “If I let go, they fade.”", c:[
        {t:"Tell him the Grey can be fought now", s:"INT", d:"normal", ok:"You tell him about the shards you've carried, the guardians you've freed. Slowly, the frost in his eyes begins to melt.", no:"He doesn't believe you. Why would he? He's been alone so long."},
        {t:"Stand before him and don't back down", s:"DIS", d:"normal", ok:"You hold his gaze. “You kept them. Now let me help keep them.” He breathes out, long and slow.", no:"His grief is too big. You flinch, and he sees it."},
        {t:"Speak his promise back to him", s:null, frag:12, ok:"“Not one of them. Not one,” you say. “I know. You kept your promise, Hrumm. You can rest now.” The giant bows his head and lets you take the shard."}
      ]}
    ],
    after: {id:"r3_fin_after", sites:["any"], x:"Holtvar lies below, every face still turned toward its hearth. The thaw-rune is cold in your hand. Hrumm's watch kept them; the choice is yours now.", c:[
      {t:"Speak the thaw-rune and wake the village", s:null, ok:"Ice runs from the eaves like rain. People stumble, gasp and weep — older than they should be, and some never stir, only stand grey where they stood. But the bell rings, and a child throws her snowball.", win:{set:"thawed_village"}},
      {t:"Leave them frozen until the Grey is gone", s:null, ok:"You leave them sleeping under the ice, safe and cold. Someday someone will come back to wake them. You tell yourself it will be you."}
    ]},
    win: "The shard comes free in your hands, and the frost pours off Hrumm like a waterfall. He blinks, as if seeing the mountain for the first time in years. “Did I keep them?” he asks. You tell him he did. The giant sits down in the snow, very slowly, the way old men sit, and closes his eyes. For the first time in years, Hrumm sleeps.",
    last: "As you start down the pass, Holtvar's bell rings once, though no hand touches it.",
    lose: "The cold and the giant's fury drive you back down the mountain, out of supplies. Hrumm's voice follows you: “Not one.” Tomorrow you can try again.",
    skipIf: null,
    skipText: ""
  }
};

EXP_REGIONS[4] = {
  n: 4,
  name: "The Whispering Fen",
  tagline: "A drowned marsh where the Grey lies thickest on the water, and every reed seems to whisper.",
  gate: {DIS:4},
  guardian: "The Lady of the Reeds",
  shard: "Shard of Will",
  intro: "The road ends at the water's edge, and the reeds begin. The Grey lies low here, a waist-deep tide that never goes out. Somewhere in the fen a voice is singing, sweet and patient, and every so often it seems to know the words you'd want to hear. You tighten your pack straps and step in.",
  sites: [
    {id:"maze", name:"The Reed Maze", stats:["INT","ORD"], desc:"Tall reeds and shifting paths, lit by will-o'-wisps that never stay put."},
    {id:"chapel", name:"The Sunken Chapel", stats:["DIS","INT"], desc:"A half-drowned chapel where hymns rise from under the water."},
    {id:"mudflats", name:"The Mudflats", stats:["VIT","DIS"], desc:"Grey sucking mud stretching to the horizon, where every step wants to be the last."}
  ],
  acts: ["Into the Reeds", "Sweet Dreams", "The Still Pool"],
  fragments: [
    {t:"A snapped ferry pole", x:"A ferryman's pole lies broken across a channel, bleached grey. Whoever held it did not let go willingly; the grip is worn smooth from years of guiding others through."},
    {t:"A hymn from under the water", x:"You kneel at the edge of a pool and hear it plainly: a hymn, sung by many voices, rising from below the surface. They sound happy."},
    {t:"A child's shoe", x:"A small leather shoe sits on a lily pad, perfectly dry, its laces neatly tied. You don't look for the other one."},
    {t:"The Lady's shrine", x:"An old shrine to the Lady of the Reeds stands on a hummock, carved with boats and lanterns. The flowers on it are fresh. No one living has left them."},
    {t:"A survivor's warning", x:"Scratched into a ferry post by someone who got out: “She shows you what you lost. Don't look. Whatever you do, don't look.”"},
    {t:"A crested armour plate", x:"In the mud you find a single armour plate, engraved with a crest: a hearth, and a flame rising from it. You know it. Your hands know its weight before your mind does."},
    {t:"Your own dream", x:"You dream, and the dream is yours: a palace, a warm hall, a crow on a lady's shoulder cawing at you, and you laughing back. You wake with the laugh still in your throat."},
    {t:"The Lady's lament", x:"The water whispers it, over and over, in a voice like a mother's: “I only wanted them to stop hurting.”"},
    {t:"Stones that appear", x:"Stepping stones rise out of the black water — but only when you stop wanting anything. The moment you hope, they sink."},
    {t:"Maren's unfinished map", x:"Pinned to a reed stake: a map of the fen in Maren's sharp hand, unfinished, with a pool at its heart circled twice. Beside it, smudged: “don't go in.”"},
    {t:"The ferryman's prayer", x:"Carved inside a capsized boat, the old words: “Lantern before, water beneath, carry them over and bring them home.” The ferrymen spoke them to the Lady, once, and she answered."},
    {t:"Your rank", x:"Scratched into the Lady's shrine, by some old visitor who knew your face: “Hearthguard — on watch the night it fell.” You read it three times. It doesn't stop being true."}
  ],
  lore: {
    "r4_wisps": {t:"The will-o'-wisps", x:"The wisps were the Lady's servants once, lighting safe paths for the ferrymen. Now they lead people toward her. Walk the way they came, and you walk the way they used to go."},
    "r4_name": {t:"The voice that knows your name", x:"It called you the way someone used to call you in from the wall at the end of a watch — easy, fond, a little impatient. You still don't know the name. But you knew the voice, for a moment."},
    "r4_ferrymarks": {t:"The ferryman's marks", x:"Each notch on the post is a crossing, each cross a passenger lost. For years there were no crosses at all. Then, all at once, the post is covered in them."},
    "r4_crying": {t:"The crying in the reeds", x:"It isn't a child. It's the fen remembering one. The Lady keeps every voice that ever drowned here, and plays them back to anyone who'll follow."},
    "r4_marens_notes": {t:"Maren's field notes", x:"“Paths shift at dusk. Wisps lie. Don't sleep near open water.” Then, smaller, as if written later: “He was there again. I didn't follow. I didn't.”"},
    "r4_hymn": {t:"The drowned hymn", x:"The words are an old harvest hymn, sung by people who've forgotten everything else. They sing it so gladly. That is the worst part."},
    "r4_hymn_back": {t:"The hymn, reversed", x:"Sung backwards, the hymn becomes the ferryman's prayer. The Lady didn't make the drowned forget her old purpose — she only turned it inside out."},
    "r4_reflection": {t:"Your reflection", x:"In the still water your reflection wears armour you don't own, or don't remember owning. Every time you lean close to read the crest, the water ripples."},
    "r4_bell": {t:"The sunken bell", x:"The bell tolls once for every traveller the Lady takes. It has been tolling for years, slow and steady, like a heartbeat under the fen."},
    "r4_altar": {t:"The altar inscription", x:"“Lady of the Reeds, who carries the lost across the dark water: carry us gently.” Once she ferried the dying to peace. Now she gives peace to the living, whether they want it or not."},
    "r4_oldprayer": {t:"The oldest prayer", x:"Older than the chapel, cut into the foundation stone: the Lady was a guide, not a gate. She never chose for anyone. She only held the lantern."},
    "r4_eyes": {t:"Eyes open", x:"Their eyes stay open because they're still dreaming. You close one pair, and the drowned face goes slack and ordinary — just someone's son, very tired, finally asleep."},
    "r4_bogman": {t:"The traveller in the peat", x:"His journal is still legible: he crossed the fen three times in his life and never once looked at the lights. On the fourth crossing, he was very old and very tired, and he looked."}
  },
  campfire: [
    "There is no dry ground for a fire, so you light a candle stub in a tin cup. Around you the reeds whisper, and you are careful not to make out the words.",
    "You catch yourself humming the drowned hymn. You stop. It takes a long while for the tune to leave your head.",
    "Your armour plate lies beside you in the dark, the crest catching the candlelight. You don't remember earning it. You're afraid you'll remember how you lost it.",
    "A wisp hovers just beyond the light, patient as a dog. You turn your back on it, and when you look again it's gone.",
    "The water is so still you can see the stars in it. Down there, too, someone seems to be camping, with a much warmer fire.",
    "You sleep sitting up, so you won't dream. It doesn't work. In the morning you remember only warmth, and that is almost worse.",
    "Your boots won't dry and your fingers have wrinkled like an old woman's. You laugh at that, alone in the fen, and the sound startles the frogs into silence."
  ],
  encounters: [
    {id:"r4_wisp", sites:["maze"], x:"A will-o'-wisp drifts out of the reeds and bobs politely in front of you. It offers to lead the way.", c:[
      {t:"Follow it, watching for the true path", s:"INT", dc:16, ok:"You follow, but you read the water as you go and step off its path where it lies.", no:"It leads you in circles until your legs ache, then vanishes."},
      {t:"Ignore it and use your own map", s:"ORD", dc:16, ok:"Compass, map, patience. The wisp sulks off.", no:"Your map is wrong here; the paths have moved since anyone drew them."},
      {t:"Follow it backwards", s:null, int:6, ok:"You walk the way it came instead, and find the old ferrymen's path — and a drowned traveller's pack beside it.", win:{loot:1, lore:"r4_wisps"}}
    ]},
    {id:"r4_name", sites:["any"], x:"Someone calls your name. Your real name — the one you don't know. The voice comes from just behind the reeds.", c:[
      {t:"Keep walking", s:"DIS", dc:16, ok:"You don't turn. You don't answer. After a while the voice gives up.", no:"You stop, and listen, and the fen is happy to keep you listening."},
      {t:"Answer", s:null, cost:1, ok:"You answer, and for one heartbeat you almost remember. Then the voice laughs fondly and is gone, and you've dropped a ration in the water.", win:{lore:"r4_name"}}
    ]},
    {id:"r4_shifting", sites:["maze"], x:"The reeds close behind you as you walk. When you look back, the path you came by is gone.", c:[
      {t:"Mark every turn with a knotted reed", s:"ORD", d:"normal", ok:"Knot by knot, you keep the maze honest.", no:"The reeds untie your knots while you aren't looking.", win:{next:1}},
      {t:"Read which way the water flows", s:"INT", d:"normal", ok:"Water always knows the way out. You follow the current and the reeds open.", no:"The water here doesn't flow at all. It waits."},
      {t:"Cut straight through the reeds", s:"STR", d:"hard", ok:"You hack a straight line through the maze and come out far ahead.", no:"The reeds are tough as wire and the maze swallows your effort.", win:{skip:1}}
    ]},
    {id:"r4_ferrypost", sites:["maze"], x:"An old ferry post stands in a channel, covered in notches and crosses. A ferryman's hut leans beside it, door hanging.", c:[
      {t:"Read the ferryman's marks", s:"INT", d:"normal", ok:"You run your fingers down the notches and understand what they count.", no:"The marks are a private code you can't crack.", win:{lore:"r4_ferrymarks"}},
      {t:"Search the hut", s:"ORD", d:"normal", ok:"Under a loose board: oilcloth, rope and a tin of biscuits only slightly damp.", no:"The floor gives way and you spend the time fishing your boot out of the mud.", win:{loot:1, supply:1}}
    ]},
    {id:"r4_crying", sites:["maze"], x:"A child is crying somewhere in the reeds. It sounds lost and very small.", c:[
      {t:"Follow the sound carefully, marking your way", s:"ORD", d:"normal", ok:"You find no child — only an empty boat, and the crying fading into the water. You mark the place and go.", no:"The crying moves every time you near it. You lose an hour and your bearings.", win:{lore:"r4_crying"}},
      {t:"Refuse to follow", s:"DIS", d:"normal", ok:"It is the hardest thing you've done in days. The crying stops the moment you turn away.", no:"You follow, of course. Anyone would. It leads you nowhere."}
    ]},
    {id:"r4_signposts", sites:["maze"], x:"A crossroads of rotting signposts, every arm pointing toward the same place: the heart of the fen.", c:[
      {t:"Trust your own reckoning", s:"ORD", d:"hard", ok:"You ignore every sign and strike out by the stars. It's the shortest way through the whole maze.", no:"The stars are hidden by the Grey; you walk in a long, wet circle.", win:{skip:1}},
      {t:"Read the oldest sign, under the moss", s:"INT", d:"easy", ok:"The oldest arm points the other way, toward dry land. You follow it a while and rest on firm ground.", no:"The moss has eaten the letters.", win:{supply:1}}
    ]},
    {id:"r4_ribbons", sites:["maze"], x:"Red ribbons are tied to reed stakes, leading off into the maze. Someone's been surveying here, and recently.", c:[
      {t:"Follow the ribbons", s:"ORD", d:"easy", ok:"They lead to a dry hummock where someone cached a little food for the way back.", no:"Some of the ribbons have been moved. You end up knee-deep and annoyed.", win:{supply:1}},
      {t:"Read the notes pinned at the last stake", s:"INT", d:"normal", ok:"Short field notes in a sharp hand you know.", no:"The page is too wet to read.", win:{lore:"r4_marens_notes"}}
    ]},
    {id:"r4_boat", sites:["maze","mudflats"], x:"A flat-bottomed boat is tangled in the reeds, half-sunk, its pole still lashed to the side.", c:[
      {t:"Search the boat", s:"ORD", d:"normal", ok:"In a sealed locker: a lamp, oil and a traveller's keepsake.", no:"The locker is rusted shut and you cut your hand trying.", win:{loot:1}},
      {t:"Bail it out and pole across the channel", s:"VIT", d:"normal", ok:"Aching shoulders, but you glide past a long stretch of marsh.", no:"The boat sinks under you halfway across.", win:{skip:1}}
    ]},
    {id:"r4_hymn", sites:["chapel"], x:"From under the water of the nave, the hymn rises: many voices, glad and warm. It wants you to join in.", c:[
      {t:"Hold your tongue and walk on", s:"DIS", d:"normal", ok:"You clamp your jaw and don't hum a note until you're well past.", no:"You find yourself singing along before you notice.", win:{next:1}},
      {t:"Listen closely for the words", s:"INT", d:"hard", ok:"You catch the verses without letting them catch you. Behind the hymnal stand, someone's prayer-box glints.", no:"The words carry you off; you come back with wet knees and fewer supplies.", win:{lore:"r4_hymn", loot:1}},
      {t:"Hear that it's the ferryman's prayer, sung backwards", s:null, int:7, ok:"You hear it — the old prayer turned inside out. Knowing it, the song loses its grip on you.", win:{lore:"r4_hymn_back"}}
    ]},
    {id:"r4_feast", sites:["chapel","mudflats"], x:"A table set for a feast stands in the middle of the marsh, white cloth and silver. The food is warm.", c:[
      {t:"Refuse", s:"DIS", dc:17, d:"hard", ok:"You walk past, stomach aching. Behind the last chair lies a silver spoon nobody's eating with.", no:"You take one bite. Then you can't remember why you shouldn't take another.", win:{loot:1}},
      {t:"Eat", s:"VIT", dc:14, ok:"It's real, and it's good, and you eat well. But afterward you feel heavy and slow, as if part of you stayed at the table.", no:"Your stomach turns. The food was never quite food.", win:{supply:2, next:-2}},
      {t:"Search for a trap", s:"INT", dc:16, ok:"Under the cloth, the table stands on a drowned man's back. You step away, and take the candlesticks.", no:"You see nothing wrong — and that unsettles you more than finding something.", win:{loot:1}}
    ]},
    {id:"r4_pews", sites:["chapel"], x:"The aisle runs underwater between rows of pews. Faded worshippers kneel in them, heads bowed beneath the surface.", c:[
      {t:"Wade down the aisle without looking", s:"DIS", d:"normal", ok:"Eyes on the altar, step by step. You don't look down. You don't.", no:"You look down. One of them is smiling."},
      {t:"Search the vestry methodically", s:"ORD", d:"normal", ok:"Dry shelves above the waterline: candles, a flint and a sealed jar of honey.", no:"The vestry is drowned to the ceiling.", win:{supply:2}}
    ]},
    {id:"r4_reflection", sites:["chapel","maze"], x:"The font water is perfectly still. Your reflection looks back at you, and it is wearing armour.", c:[
      {t:"Look away", s:"DIS", d:"easy", ok:"You don't need to see it. You walk on, steadier for it.", no:"You look a little too long, and the reflection doesn't blink when you do.", win:{next:1}},
      {t:"Study the reflection closely", s:"INT", d:"normal", ok:"You lean in, trying to read the crest on its breast.", no:"Your reflection leans in too, closer than it should. You jerk back.", win:{lore:"r4_reflection"}}
    ]},
    {id:"r4_bell", sites:["chapel"], x:"Deep under the water, a bell begins to toll. Each stroke presses on your chest like a hand.", c:[
      {t:"Push on between the strokes", s:"DIS", d:"normal", ok:"You walk in the silence between the tolls and are out before it stops.", no:"The tolling slows your steps to match its rhythm. You lose the afternoon."},
      {t:"Count the tolls", s:"INT", d:"normal", ok:"You count, and the number makes you very quiet.", no:"You lose count, and start again, and lose count again.", win:{lore:"r4_bell"}}
    ]},
    {id:"r4_altar", sites:["chapel"], x:"On the altar, candles burn under the water. An offering bowl sits beside them, full of old coins.", c:[
      {t:"Leave an offering of your own", s:null, cost:1, ok:"You set down a little bread. The candles flare, and the chapel feels a fraction kinder.", win:{shield:1}},
      {t:"Read the inscription around the altar", s:"INT", d:"normal", ok:"The words are old and gentle, from a better time.", no:"Silt covers the carving; scrubbing it costs time and patience.", win:{lore:"r4_altar"}},
      {t:"Read the prayer cut into the foundation stone", s:null, int:8, ok:"Beneath the altar, older than the chapel, a prayer from when the Lady was only a guide.", win:{lore:"r4_oldprayer"}}
    ]},
    {id:"r4_figure", sites:["chapel"], x:"Someone is waiting for you at the chapel door, warm and familiar. You don't know who they are. You'd know their arms anywhere.", c:[
      {t:"Walk past them", s:"DIS", d:"hard", ok:"You walk past. They don't follow. On the step where they stood is a keepsake that's real.", no:"You stop to hold them. It's like holding fog. You're cold to the bone when you let go.", win:{loot:"rare"}},
      {t:"Look closely for the seam in the illusion", s:"INT", d:"normal", ok:"There — reeds where the hair should be, water where the eyes should be. The figure unravels.", no:"It's perfect. That's how you know it isn't real — but knowing doesn't help."}
    ]},
