    {id:"r4_sinking", sites:["mudflats"], x:"The ground gives way under you. You're in to the thighs before you know it, and sinking.", c:[
      {t:"Haul yourself out", s:"STR", dc:16, ok:"You grab a root and drag yourself free, filthy and breathing hard.", no:"You struggle, and sink faster. Your pack is the price of getting out."},
      {t:"Spread your weight and crawl", s:"VIT", dc:15, d:"easy", ok:"Flat on your belly, slow and steady, you slide out of the mud's grip.", no:"The cold mud soaks into you and you lose strength crawling free."}
    ]},
    {id:"r4_faded_drift", sites:["mudflats","chapel"], x:"Bloated Faded drift in the shallows, eyes open, staring up at the grey sky.", c:[
      {t:"Move silently past", s:"DIS", dc:15, ok:"You slip by without a ripple. None of them turn.", no:"One of them bumps against your leg. You don't sleep well tonight."},
      {t:"Pull one ashore and close its eyes", s:"STR", dc:16, ok:"You drag him onto the mud and close his eyes. It's the least anyone could do, and no one else did.", no:"He's heavier than he looks. You give up, and his eyes follow you.", win:{lore:"r4_eyes"}}
    ]},
    {id:"r4_maren_water", sites:["mudflats","chapel"], req:{flag:"helped_maren"}, x:"Maren is waist-deep in the water, map case floating behind her, walking toward a light. She's smiling. You've never seen her smile like that.", c:[
      {t:"Pull her back", s:"STR", dc:16, ok:"You grab her collar and haul her to the bank. She comes to coughing and furious, then very quiet. “...Thanks. Again.”", no:"She fights you, stronger than she looks, and you both go under before you drag her out.", win:{supply:1, next:1}},
      {t:"Talk her out of it", s:"DIS", dc:16, ok:"You say her name until she hears it. She stops, looks at the light, and turns her back on it. “He's not there. I know he's not there.”", no:"Your words can't reach past the song. You have to wade in after her, soaked and shaking.", win:{supply:1, next:1}}
    ]},
    {id:"r4_stranger_water", sites:["mudflats","chapel"], req:{noflag:"helped_maren"}, x:"A stranger is waist-deep in the water, walking toward a light. A one-eyed woman, smiling like someone going home.", c:[
      {t:"Pull her back", s:"STR", dc:16, ok:"You drag her to the bank. She blinks at you, shivering, and leaves without a word — but leaves her spare rations behind.", no:"She fights you, and you both go under before you get her out.", win:{supply:1}},
      {t:"Talk her out of it", s:"DIS", dc:16, ok:"You call to her until she stops and turns. “That light,” she says, “it isn't him, is it?” She walks away from it.", no:"She doesn't hear you. You wade in after her and come out soaked to the bone.", win:{next:1}}
    ]},
    {id:"r4_leeches", sites:["mudflats"], x:"Grey leeches cling to your legs when you climb out of a channel. They don't drink blood. They drink something else, and you feel it going.", c:[
      {t:"Grit your teeth and pull them off", s:"VIT", d:"normal", ok:"One by one, until your legs sting and you remember everything you should.", no:"They take a while to get off, and you feel thinner, somehow."},
      {t:"Stay calm and burn them off with your candle", s:"DIS", d:"easy", ok:"Steady hand, careful flame. They curl and drop away.", no:"Your hand shakes; you burn yourself and waste the candle."}
    ]},
    {id:"r4_weary", sites:["mudflats"], x:"Every step drags at your boots. The mud is soft and warm, and you're so tired. You could just lie down for a minute.", c:[
      {t:"March on regardless", s:"VIT", d:"hard", ok:"You walk until the mud turns to firm ground, and at the edge of it find a sodden but intact pack.", no:"You march until you drop, and you have to eat into your stores to get up again.", win:{loot:1, supply:1}},
      {t:"Refuse the urge to rest", s:"DIS", d:"normal", ok:"You say no to it out loud. It helps more than you'd think.", no:"You lie down. When you wake, the light has changed and you've lost the afternoon.", win:{next:1}}
    ]},
    {id:"r4_tide", sites:["mudflats"], x:"The water is coming in across the flats, fast and silent. The hummocks are vanishing one by one.", c:[
      {t:"Race the tide to the far bank", s:"VIT", d:"normal", ok:"You reach the bank just ahead of the water, lungs burning.", no:"The tide catches you knee-deep and you lose a pack to it."},
      {t:"Find the highest hummock and wait", s:"ORD", d:"normal", ok:"You pick well: a dry island where an old traveller left a bundle above the water mark.", no:"Your hummock is not high enough, and the night is very wet.", win:{supply:1}}
    ]},
    {id:"r4_bogman", sites:["mudflats"], x:"A traveller lies in the peat, preserved and peaceful, pack still on his back. He's been here a long, long time.", c:[
      {t:"Dig out his pack", s:"VIT", d:"normal", ok:"The peat is heavy and cold, but the pack is full of well-preserved things, and a journal.", no:"The peat swallows everything you dig loose.", win:{loot:1, lore:"r4_bogman"}},
      {t:"Leave him be and say a word for him", s:null, ok:"You don't know his name, so you just say goodnight. It feels right. You walk on lighter.", win:{next:1}}
    ]},
    {id:"r4_grey_tide", sites:["any"], x:"The Grey thickens around you until it's hard to tell fog from water. Voices you almost know murmur from all sides.", c:[
      {t:"Hold on to yourself and keep walking", s:"DIS", d:"normal", ok:"You list what you know: your boots, your pack, the shards, the road. It's enough.", no:"For a while you aren't sure who is walking."},
      {t:"Push through as fast as you can", s:"VIT", d:"normal", ok:"You wade out the far side, gasping, before it settles in.", no:"You exhaust yourself and still come out the wrong side."},
      {t:"Find the wind and follow it out", s:"ORD", d:"easy", ok:"Wet finger in the air; the fog is thinner upwind. You walk out of it.", no:"There's no wind. There's never wind here."}
    ]},
    {id:"r4_far_lantern", sites:["any"], x:"Far across the water, a single lantern floats, always the same distance ahead no matter how you walk. It isn't a wisp. It looks lonely.", c:[
      {t:"Work out where it's trying to lead", s:"INT", d:"normal", ok:"It isn't leading you anywhere — it's circling the same safe path, over and over, as if remembering it.", no:"You try to follow its path and end up hip-deep.", win:{next:1}},
      {t:"Let it go and make camp on firm ground", s:"ORD", d:"easy", ok:"You turn your back on the light and set up a tidy, dry camp. You rest well.", no:"Nowhere here is dry. You rest badly.", win:{supply:1}}
    ]}
  ],
  story: [
    {id:"r4_maren_map", at:3, who:"maren", sites:["any"], req:{flag:"helped_maren"}, x:"Maren is mapping the fen from a dead tree, eye bloodshot, shoving reeds into her ears to keep out the singing. She climbs down, presses her fen map into your hands, and admits it, once: “I see him every night here. My father.”", c:[
      {t:"Take the map and thank her", s:null, ok:"“Don't get sentimental. Just don't drown. I'd have to redraw everything.” She climbs back up her tree."},
      {t:"Ask her to come with you", s:null, ok:"“No. I'm close to the middle of this mess. I want it on paper.” She hesitates. “...Be careful at the pool.”"}
    ]},
    {id:"r4_maren_cold", at:3, who:"maren", sites:["any"], req:{noflag:"helped_maren"}, x:"Maren is mapping the fen from a dead tree, reeds shoved in her ears against the singing. She sees you and doesn't climb down. After a long silence she says it anyway, as if to the fog: “I see him every night here. My father.”", c:[
      {t:"Tell her you're sorry", s:null, ok:"“Didn't ask you to be.” But she watches you go, and calls after you: “Stay off the lights.”"},
      {t:"Leave her to her work", s:null, ok:"She goes back to her map without another word. The scratch of her pen follows you a long way."}
    ]},
    {id:"r4_the_dream", at:7, sites:["any"], x:"The Lady rises from the water, and the fen dissolves into a warm hall. You are the Hearthguard, polished and proud, laughing with the Queen's crow while music plays. No one is grieving here. No one has ever been sad. She whispers: stay.", c:[
      {t:"Refuse the dream", s:"DIS", dc:16, ok:"You close your eyes and say no. The hall tears like wet paper, and you're standing in the cold fen, shaking — and yourself.", no:"You try to say no, but the warmth is too much. You wake at camp hours later, empty-handed, with the music still in your ears.", win:{set:"refused_the_dream"}, lose:{wake:1}},
      {t:"Stay", s:null, ok:"You stay. It is the best day of your life, again and again. Then you wake at camp, cold, empty-handed, and very alone.", win:{wake:1}}
    ]}
  ],
  corwin: [
    {id:"r4_corwin_nope", sites:["any"], x:"Corwin lands on a reed beside you. He looks at the fen. He looks at the fog. He looks at the water, and the singing, and the drifting Faded. “Nope.”", c:[
      {t:"Watch him go", s:null, ok:"He's gone before the reed stops swaying. You don't blame him at all."}
    ]}
  ],
  finale: {
    name: "The Still Pool",
    intro: "At the heart of the fen lies a pool so still it looks like black glass. The Lady of the Reeds rises from it, beautiful and terrible, robed in weeds and lantern-light. She holds out her hands, and in them is the dream — the hall, the warmth, the life you lost. “One last time,” she says. “Let me make it stop hurting.”",
    stages: [
      {id:"r4_fin_song", sites:["any"], x:"She sings, and the whole fen sings with her. Every voice you've ever missed is in that song.", c:[
        {t:"Resist the song", s:"DIS", d:"normal", ok:"You hold on to the cold and the wet and the weight of your pack. They're real. The song isn't.", no:"You sway toward the water before you catch yourself, knee-deep and shaking."},
        {t:"Steel yourself and walk straight at her", s:"DIS", d:"hard", ok:"Each step is a refusal. By the time you reach the pool's edge, the song has nowhere left to go.", no:"The song pulls you under for a long moment before you fight free.", win:{next:2}},
        {t:"Speak the ferryman's prayer over her song", s:null, frag:11, ok:"“Lantern before, water beneath, carry them over and bring them home.” The Lady falters mid-note, as if she's heard her own name."}
      ]},
      {id:"r4_fin_true", sites:["any"], x:"The pool fills with a dozen Ladies, each one lovelier than the last, each one reaching for you. Only one of them is real.", c:[
        {t:"Study the reflections", s:"INT", d:"normal", ok:"The real one has no reflection of her own — she is the reflection. You turn to face her.", no:"You choose wrong, and the illusion embraces you with cold water."},
        {t:"Look for the one who is weeping", s:"INT", d:"hard", ok:"Every Lady is smiling but one. Her eyes are wet. You walk to her.", no:"They all weep at once, and you can't tell them apart.", win:{next:2}}
      ]},
      {id:"r4_fin_shard", sites:["any"], x:"The shard glows at the bottom of the pool. As you reach for it, the Lady kneels in the water and pleads. “They were hurting. I only wanted them to stop hurting.”", c:[
        {t:"Hold firm and reach past her", s:"DIS", d:"normal", ok:"“I know,” you tell her. “But they have to feel it to live.” Your hand closes on the shard.", no:"Her grief is too close to your own. You pull back."},
        {t:"Plunge your arm into the icy pool", s:"VIT", d:"normal", ok:"The cold is like knives, but you reach down, down, and close your fist on the shard.", no:"The cold drives the breath from you and you jerk your arm out empty."},
        {t:"Say no, the way you did before", s:"DIS", d:"normal", flag:"refused_the_dream", ok:"“You've said no before,” she whispers — and you say it again, gently. You reach into the pool and take the shard.", no:"Even remembering your refusal, the pull is strong. You falter."}
      ]}
    ],
    after: null,
    win: "The shard comes up from the black water, burning with a hard, clear light. The Lady stares at it, then at you, and begins to weep — not the sweet weeping of her song, but real grief, long held. The weeds fall from her. Her shape folds smaller and smaller until a ferryman's lantern floats on the pool where she stood, lit and steady. It drifts ahead of you toward the edge of the fen, waiting for you to follow, the way it used to wait for others.",
    last: "And then, clear as cold water, the first true memory returns: you stood guard over the Hearthstone the night it shattered — and you ran.",
    lose: "The fen wears you down until your supplies are gone, and you stagger back to the reeds' edge with the Lady's song still in your ears. Tomorrow you can try again.",
    skipIf: null,
    skipText: ""
  }
};

EXP_REGIONS[5] = {
  n: 5,
  name: "Crownfall",
  tagline: "The capital of Aldmere, silent and grey beneath its broken spires.",
  gate: {ORD:5},
  guardian: "The Hollow Knight",
  shard: "Shard of Order",
  intro: "Crownfall rises out of the fog like a held breath. No smoke from the chimneys, no bells, no voices — only the faint scrape of iron boots somewhere up in the palace, keeping a patrol for no one. The streets feel familiar in a way you don't like. Your feet know where the cobbles are loose before you do.",
  sites: [
    {id:"lower", name:"The Lower City", stats:["ORD","VIT"], desc:"Markets and alleys where the Faded stand in crowds, all facing the palace."},
    {id:"palace", name:"The Palace Halls", stats:["ORD","DIS"], desc:"Gilded corridors where hollow guards still follow their last orders."},
    {id:"gardens", name:"The Royal Gardens", stats:["INT","DIS"], desc:"Grey roses, a quiet grave, a chapel, and a monk's empty rooms."}
  ],
  acts: ["The Silent City", "The King's Grief", "The Throne Room"],
  fragments: [
    {t:"A royal decree", x:"Nailed to the market cross, the ink still sharp: “By order of the King, the Hearth shall be tended night and day.” Someone has touched the seal so often it has worn smooth."},
    {t:"A Hearthguard tabard", x:"A red tabard with the hearth-and-flame crest, folded neatly in a barracks chest. Inside the collar, in careful stitching, is a name. It is yours. You read it three times and it still won't stay in your head."},
    {t:"A ballroom dance card", x:"A card from the last ball, every line filled in a lady's looping hand. The final dance is marked “for the Hearthguard on watch — if the watch can spare them.” It couldn't."},
    {t:"The fever ward list", x:"A physician's list of the sick, names crossed out one by one. Near the bottom, not crossed out but circled twice: the Queen, and beneath her, the little Prince."},
    {t:"The King's last letter", x:"Unsealed, the hand shaking badly: “I cannot carry this. Make it stop.” It is addressed to no one. It was found by someone anyway."},
    {t:"Oswin's rite", x:"Pages of instructions in a careful, gentle hand — words to speak over the Hearthstone, a breath to hold, a feeling to set down and never pick up again. In the margin: “He will finally rest.”"},
    {t:"The watch roster", x:"The Hearthguard roster for the night the flame broke. One name is on duty at the Hearthstone itself. You don't need to read it twice. You knew before you looked."},
    {t:"Oswin's confession", x:"A single sheet, left on the chapel altar where anyone could find it: “I gave him peace. I gave them all peace.” The ink has run in one place, as if something fell on it."},
    {t:"Callum's orders", x:"Still pinned to the throne room door: “No one passes. Hold until relieved. — Capt. Callum.” No one ever came to relieve him."},
    {t:"The Hearthguard oath", x:"Carved above the guardroom hearth: “I keep the flame. I keep the watch. Whatever falls, I do not.” You find your lips moving along with it before you've finished reading."},
    {t:"A tavern sketch", x:"A charcoal sketch tucked into a helmet: two Hearthguards at a tavern table, one big and grinning, one half-turned, laughing at something he said. The younger one is you."},
    {t:"Callum's last words", x:"It comes back whole, like a door swinging open. Callum's hand on your shoulder, the flame roaring behind him: “Hold the line, kid. Whatever happens.” And then you didn't."}
  ],
  lore: {
    "r5_countersign": {t:"The Hearthguard countersign", x:"Challenge: “Who keeps the flame?” Answer: “All who are cold.” Only the Hearthguard knew it. It came out of your mouth without asking you first."},
    "r5_watchword": {t:"A remembered watchword", x:"For a moment you stand in this same corridor in full armour, bored and young, while someone older calls the watchword down the line. Then the memory goes grey again, but the word stays."},
    "r5_letters": {t:"Letters to the King", x:"Dozens of letters from Brother Oswin, each kinder than the last. “Grief is a wound that does not close, Majesty. But there are ways to set it down.” The final letter is only one line: “Tonight, then.”"},
    "r5_queen": {t:"The Queen's grave", x:"Queen Isolde, beloved. Beneath her name, a smaller stone: the Prince, seven years old. Someone planted grapevines along the wall behind them. They've gone grey, but they're still trying to climb."},
    "r5_decree": {t:"The herald's proclamation", x:"The Faded herald repeats the last proclamation he ever read: the court is in mourning, the ball is cancelled, the King will see no one. Then, a line he always stumbles over: “The King will see only his confessor.”"},
    "r5_portraits": {t:"The scraped portraits", x:"Beneath the grey scratches, the faces are the royal family: the King laughing, the Queen with a crow on her wrist, the Prince on a pony. Someone scraped them out with a knife. Someone who couldn't bear to look."},
    "r5_hearthguard": {t:"The Hearthguard", x:"Twelve knights sworn to the flame, never more. They kept the Hearthstone night and day in shifts of three — except in the last month of mourning, when the King ordered the watch cut to one."},
    "r5_chapel": {t:"The King's prayer book", x:"The pages near the front are prayers for the sick. Then prayers for the dead. Then, for many pages, the same line in the King's hand: “Let me not feel it.”"},
    "r5_fever": {t:"The fever pavilion", x:"The palace physicians moved the sick into the gardens, hoping clean air would help. It didn't. The Queen refused to be parted from her son and stayed in the pavilion to the end."},
    "r5_physician": {t:"The physician's notes", x:"“The Queen and Prince lost tonight. His Majesty would not leave them. His confessor sat with him until dawn. I do not like how calm the monk is. I do not like how the King listens.”"},
    "r5_lullaby": {t:"The Queen's lullaby", x:"Hush now, the flame is lit, the watch is on the wall. Hush now, the night is long, but morning comes for all. The roses hum it still, half a tune behind."},
    "r5_market": {t:"The last market day", x:"Stalls still set out with grey apples and bolts of grey cloth. The traders weren't afraid when the fog came. That was the strange part, a survivor wrote later. Nobody was afraid of anything."}
  },
  campfire: [
    "You make camp in a gatehouse whose doors you somehow know how to bar. The fire is small. Outside, the city doesn't sleep, because it never wakes.",
    "You turn your old name over in your mind like a coin you can't quite read. It's close now. You're not sure you want it.",
    "A Faded lamplighter walks past your fire, lifting his pole to lamps that won't light. He does it carefully, every one. You find you respect him for it.",
    "The palace looms over your camp, every window dark but one. Up there, iron boots keep their patrol. Somewhere in you, a younger self stands straighter.",
    "You eat in silence and think about all the people you've passed — the woodcutters, the scholar, the frozen child, the drowned in the fen. All of it began here, in this city, on one night.",
    "You dream of a crowded tavern and a big man's laugh. When you wake, your face is wet, and you don't remember why.",
    "The cobbles around the fire are worn into a path by years of feet. Thousands of people lived here, argued here, loved here. Now only you are left to remember any of it, and you barely remember yourself."
  ],
  encounters: [
    {id:"r5_crowd", sites:["lower"], x:"A Faded crowd fills the market square, hundreds of grey shapes all turned toward the palace, waiting for a speech that never came. There's no way across but through them.", c:[
      {t:"Weave through them", s:"DIS", dc:17, ok:"You slip between grey shoulders without letting yourself look at their faces. On the far side you breathe again.", no:"A woman turns her empty face to you as you pass, and you freeze too long among them. The cold gets into your pack."},
      {t:"Find the alley route", s:"ORD", dc:18, ok:"You trace the backstreets in your head and find a crooked alley your feet seem to remember. Behind a stall you find something left behind.", no:"The alley dead-ends at a collapsed arch. You lose an hour finding your way back.", win:{loot:1}},
      {t:"Push through", s:"STR", dc:19, ok:"You shoulder a path through the crowd. They sway like reeds and close again behind you — and in the crush, a forgotten purse falls at your feet.", no:"The crowd is heavier than it looks, and they push back without meaning to. You come out bruised and lighter.", win:{loot:2}}
    ]},
    {id:"r5_password", sites:["palace"], x:"Two hollow guards cross their halberds before you, empty helms tilted down. A voice rattles out of the armour: “Password.”", c:[
      {t:"Remember it", s:"INT", dc:18, ok:"You close your eyes and let your mouth find it. The halberds lift — and for a heartbeat you're standing here in armour, bored and young, before the memory greys again.", no:"The word is right there and then gone. The halberds don't move, and you back away the long way round.", win:{lore:"r5_watchword"}},
      {t:"Stand to attention like you belong", s:"ORD", dc:17, ok:"Heels together, chin up, eyes front. The hollow guards snap a salute to you and step aside.", no:"Your posture is almost right. Almost isn't enough for them, and they march you back to the outer gate."},
      {t:"Give the Hearthguard countersign", s:null, int:7, ok:"“All who are cold,” you answer, before they've finished asking. Both guards drop to one knee as you pass.", win:{lore:"r5_countersign"}}
    ]},
    {id:"r5_ballroom", sites:["palace"], x:"The ballroom is full. Faded courtiers turn and bow and turn again, gowns sweeping, in perfect step to music that stopped years ago. The only way to the far doors is across the floor.", c:[
      {t:"Cross the floor in step with the dance", s:"ORD", dc:18, ok:"You find the count — one, two, three, turn — and dance your way across with a grey partner who never looks at you. At the far door, she curtsies.", no:"You miss a step and the whole room stops, every face turning toward you at once. You back out, shaken."},
      {t:"Edge along the wall", s:"DIS", dc:17, ok:"You keep your back to the wall and your eyes on the door, refusing the pull of the silent music. You make it.", no:"Halfway along, you realise you've been swaying in time. You've lost track of how long."}
    ]},
    {id:"r5_locket", sites:["gardens"], req:{noflag:"kept_queens_locket"}, x:"The Queen's grave lies beneath a grey trellis of grapevines. On the stone sits a small silver locket, closed, as if someone set it down and couldn't bring themselves to pick it up again.", c:[
      {t:"Take the locket", s:null, ok:"It's cold, then warm in your hand. You don't know why you want it. You only know someone should be carrying it.", win:{set:"kept_queens_locket"}},
      {t:"Leave it and say a word for her", s:null, ok:"You don't know her. You say something anyway — something about being sorry, and about the vines still climbing. It feels like the right thing to say.", win:{lore:"r5_queen"}}
    ]},
    {id:"r5_oswin_desk", sites:["gardens"], x:"A small, tidy room off the garden cloister: a monk's quarters. The bed is made. The desk is buried in letters, all addressed to the King, all in the same gentle hand.", c:[
      {t:"Read them", s:"INT", dc:18, ok:"You read until the light fails. The letters are kind, patient, loving — and every one of them leads to the same door.", no:"The words blur into each other, calm and endless. You put them down feeling oddly sleepy.", win:{lore:"r5_letters"}},
      {t:"Search for anything useful", s:"ORD", dc:17, ok:"Beneath the bed, a travelling satchel packed for a long journey and never taken.", no:"You turn the room over and find only more letters, and the tea leaves he left out for guests.", win:{loot:1}},
      {t:"Burn them", s:"DIS", dc:18, ok:"The letters catch quickly, and you warm your hands over all those kind words. It doesn't feel like enough.", no:"You hold the match too long, reading one last line. The flame bites your fingers and goes out.", win:{supply:1}}
    ]},
    {id:"r5_stair", sites:["palace"], x:"The great stair has collapsed in the middle, leaving a gap over a long fall into dusty dark. Above, the upper gallery waits.", c:[
      {t:"Jump the gap", s:"STR", dc:18, ok:"You take three running steps and throw yourself across. Your hands catch the far edge, and you haul yourself up.", no:"You land short, scramble, and lose your grip on your pack strap. Something tumbles into the dark."},
      {t:"Climb the scaffold", s:"VIT", dc:18, ok:"The old masons' scaffold groans but holds. You climb hand over hand until your arms burn, and pull yourself onto the gallery.", no:"A plank gives way under you. You make it, but slowly, and the cold gets into your bones."}
    ]},
    {id:"r5_bakery", sites:["lower"], x:"A Faded baker stands at her counter, kneading dough that isn't there, flour long since gone grey on her arms. The ovens behind her are cold.", c:[
      {t:"Search the storeroom methodically", s:"ORD", d:"normal", ok:"Behind the sacks you find hard biscuits sealed in a tin, still good. You leave a coin on the counter. It seems right.", no:"Grey dust and mouse-chewed sacks. Nothing to show for it but sneezing.", win:{supply:2}},
      {t:"Eat the stale bread on the shelf", s:"VIT", d:"easy", ok:"It's like chewing a brick, but it fills you.", no:"Your stomach turns against it. You lose more than you gained.", win:{supply:1}}
    ]},
    {id:"r5_well", sites:["lower"], x:"A street has collapsed into the old cistern below. Down in the dark you can see the glint of something — a dropped strongbox, maybe, or just water.", c:[
      {t:"Climb down", s:"VIT", d:"hard", ok:"The cold water reaches your chest, but your hands find the strongbox and drag it up. Inside: a merchant's last savings.", no:"The cold steals your breath and your grip. You come up empty and shivering.", win:{loot:"rare"}},
      {t:"Rig a rope from the market awnings", s:"ORD", d:"normal", ok:"A careful knot, a hooked pole, patience. Something comes up on the line.", no:"The rope frays and drops back into the dark with your best hook on it.", win:{loot:1}}
    ]},
    {id:"r5_herald", sites:["lower"], x:"On the steps of the guildhall, a Faded herald unrolls a scroll and reads it aloud in a voice like dry leaves. Then he rolls it up, and unrolls it, and begins again.", c:[
      {t:"Listen to the whole proclamation", s:"INT", d:"normal", ok:"You make out every word on the third time through. One line catches like a splinter.", no:"His voice slides away from you, word by word, until you've forgotten why you stopped.", win:{lore:"r5_decree"}},
      {t:"Walk on without listening", s:"DIS", d:"easy", ok:"You keep your eyes on the palace and your mind on your feet.", no:"His voice follows you down the street for longer than it should."}
    ]},
    {id:"r5_children", sites:["lower"], x:"In a courtyard, Faded children play at knights with wooden swords, frozen mid-game. One of them wears a paper crest pinned to his shirt: a hearth and a flame.", c:[
      {t:"Go quietly around them", s:"DIS", d:"easy", ok:"You pass without disturbing their game. You don't look at the paper crest again.", no:"You stop and stare at the crest too long. Something in your chest goes heavy and stays that way."},
      {t:"Search the toy chest by the door", s:"ORD", d:"normal", ok:"Among the wooden swords, a real one — small, old, and well made. Some knight's gift to a son.", no:"You dig through tin soldiers and rag dolls and find nothing you can use.", win:{loot:1}}
    ]},
    {id:"r5_rooftops", sites:["lower"], x:"The street ahead has fallen into the old sewers. The only way forward is over the rooftops, slick with grey moss.", c:[
      {t:"Climb and cross", s:"VIT", d:"normal", ok:"Roof to roof, chimney to chimney, until you drop down on the far side, breathing hard but whole.", no:"A slate slides under your boot. You catch yourself, but your pack doesn't."},
      {t:"Map a route from the bell tower", s:"ORD", d:"normal", ok:"From the tower you sketch the whole quarter and find a dry path along the old city wall.", no:"The fog hides half the streets. Your route sends you in a long circle.", win:{next:2}},
      {t:"Smash through the blocked passage", s:"STR", d:"hard", ok:"You break through a boarded cellar into a smugglers' run — and a smuggler's forgotten stash.", no:"The boards hold and your shoulder doesn't. You go round the long way, aching.", win:{loot:"rare"}}
    ]},
    {id:"r5_tavern", sites:["lower"], req:{minFrag:9}, x:"A tavern sign creaks over a narrow door: a red flame on a black field. Inside, the corner table has two tankards on it, still waiting. You know which seat is yours.", c:[
      {t:"Sit a while", s:"VIT", d:"easy", ok:"You sit, and rest, and almost hear a big laugh from the empty seat across from you. When you get up, you feel steadier.", no:"The stillness is too much. You leave before you've rested at all.", win:{supply:1}},
      {t:"Search behind the bar", s:"ORD", d:"normal", ok:"The landlord kept a strongbox under the floorboard, the way you somehow knew he would.", no:"You search the wrong floorboard, then the next. It's been too long.", win:{loot:2}}
    ]},
    {id:"r5_drill", sites:["palace"], x:"In the courtyard, a company of hollow guards drills with long pikes, sweeping and turning in perfect unison. Their drill covers the only path to the inner doors.", c:[
      {t:"Time the gap and walk through", s:"DIS", d:"normal", ok:"You wait, count, and walk calmly between the sweeping pikes without flinching once.", no:"You flinch. A pike shaft catches your shoulder and sends your pack sprawling."},
      {t:"Fall in and march with them", s:"ORD", d:"easy", ok:"Left, right, turn — you fall into the old drill like you never left it. The company carries you to the inner doors.", no:"You turn left when they turn right. They don't stop; you have to dodge."},
      {t:"Break their line", s:"STR", d:"hard", ok:"You catch a pike, wrench it free, and the whole drill clatters to a halt. The fallen guard had a captain's purse on his belt.", no:"Their line is stronger than you are. You're knocked back to the gate.", win:{loot:2}}
    ]},
    {id:"r5_portraits", sites:["palace"], x:"A long gallery of royal portraits, every face scratched out with grey gouges. The frames are perfect; only the faces are gone.", c:[
      {t:"Study the brushwork beneath", s:"INT", d:"normal", ok:"Tilting the lantern, you can just make out the shapes beneath the scratches — a family, happy.", no:"The gouges swim before your eyes. You walk on with a headache and nothing else."},
      {t:"Walk the gallery without looking", s:"DIS", d:"easy", ok:"Eyes on the far door. The faceless family watches you go.", no:"You glance up once and can't look away. It costs you time and warmth."},
      {t:"Recognise the crow on the Queen's wrist", s:null, int:6, ok:"Not every face was scraped clean. On the Queen's wrist, untouched, sits a scruffy black crow with a very familiar look of disapproval.", win:{lore:"r5_portraits"}}
    ]},
    {id:"r5_kitchens", sites:["palace"], x:"The palace kitchens are vast and cold. A Faded cook stirs an empty pot with great care, tasting nothing from the spoon, nodding, and stirring again.", c:[
      {t:"Raid the pantry in order", s:"ORD", d:"normal", ok:"Shelf by shelf: dried fruit, salted meat, a wheel of cheese gone hard as wood but still good.", no:"Most of it has gone grey and tasteless. You eat some anyway and regret it.", win:{supply:2}},
      {t:"Taste what's in the cook's pot", s:"VIT", d:"easy", ok:"There's something in it after all — a thin, warm broth. The cook nods at you approvingly.", no:"It's cold and grey and tastes of nothing. You feel worse for trying.", win:{supply:1}}
    ]},
    {id:"r5_treasury", sites:["palace"], x:"The treasury corridor. You know about the pressure plates — some old instinct tells you — but not which ones, and the floor is thick with grey dust.", c:[
      {t:"Map the floor tile by tile", s:"ORD", d:"hard", ok:"You test every tile, chalk the safe ones, and walk out with a crown jewel no one will miss.", no:"Click. Darts thunk into the wall beside your head, and you run for it, leaving supplies behind.", win:{loot:"rare"}},
      {t:"Go slowly and trust your nerve", s:"DIS", d:"normal", ok:"Step, breathe, step. At the end, a small coffer someone dropped while fleeing.", no:"Your nerve breaks halfway and you bolt. Something clicks. Something else falls.", win:{loot:1}}
    ]},
    {id:"r5_armoury", sites:["palace"], req:{minFrag:5}, x:"The Hearthguard armoury. Twelve racks, twelve names painted above them. Eleven racks are empty. The twelfth holds a captain's spare shield, polished to a shine by someone who kept polishing it long after he needed to.", c:[
      {t:"Search the racks", s:"ORD", d:"normal", ok:"Behind a loose board, a bundle of good rations and a whetstone, stored the regulation way.", no:"Empty hooks, rust, and dust. Whoever came here last took everything that mattered.", win:{supply:2}},
      {t:"Read the names above the racks", s:"INT", d:"normal", ok:"Twelve names. You know one of them before you read it, and you skip past it quickly.", no:"The paint has faded. You can make out only the captain's: Callum.", win:{lore:"r5_hearthguard"}}
    ]},
    {id:"r5_chapel", sites:["gardens"], x:"The King's private chapel. The candles burned down to stubs long ago. The prayer bench is worn into two shallow hollows where someone knelt for a very long time.", c:[
      {t:"Read the prayer book", s:"INT", d:"normal", ok:"You turn the pages slowly. The prayers change as you go, and then they stop being prayers at all.", no:"The thin pages stick and tear. You can't make out enough to matter.", win:{lore:"r5_chapel"}},
      {t:"Kneel and resist the stillness", s:"DIS", d:"normal", ok:"You kneel where he knelt and feel the Grey's pull, soft and heavy. You stand again. That's the whole prayer.", no:"It's so quiet. You kneel there longer than you meant to, and the cold creeps in."},
      {t:"Check the alms box", s:"ORD", d:"easy", ok:"A few coins and a sealed pouch of dried figs, left for the poor.", no:"Empty. The poor came first, a long time ago.", win:{supply:1}}
    ]},
    {id:"r5_fever_ward", sites:["gardens"], x:"A white pavilion in the gardens, its curtains stirring in no wind. Inside are rows of empty cots, and two that sit apart: one large, one small.", c:[
      {t:"Read the ward records", s:"INT", d:"normal", ok:"The pavilion's purpose becomes clear, line by careful line.", no:"The ink has bled into grey smears. All you can read are the dates, ending all at once.", win:{lore:"r5_fever"}},
      {t:"Sit with the empty cots a moment", s:"VIT", d:"normal", ok:"You sit between the two beds until the chill passes, and find a blanket folded beneath one, still warm somehow.", no:"The cold of the place gets into you and won't leave.", win:{supply:1}},
      {t:"Recognise the physician's private hand", s:null, int:8, ok:"The marginal notes aren't the ward clerk's. They're the physician's own, written at night, and they say more than she ever said aloud.", win:{lore:"r5_physician"}}
    ]},
    {id:"r5_maze", sites:["gardens"], x:"The Queen's hedge maze has grown wild and grey, the paths closing in. Somewhere in the centre, a fountain still trickles.", c:[
      {t:"Work out the pattern", s:"INT", d:"normal", ok:"Left twice, then right at every rose. At the centre, coins glint in the fountain basin.", no:"Every turn looks the same. You come out where you went in, an hour later.", win:{loot:1}},
      {t:"Keep one hand on the hedge", s:"ORD", d:"hard", ok:"Slow and sure, the old trick works. At the centre you find the Queen's garden chest, untouched.", no:"The hedge has grown through itself; the trick fails. You lose your bearings and some of your food.", win:{loot:"rare"}}
    ]},
    {id:"r5_roses", sites:["gardens"], x:"A bed of grey roses hums softly — the same few bars, over and over, a lullaby half a tune behind. It makes your eyelids heavy.", c:[
      {t:"Refuse to listen", s:"DIS", d:"hard", ok:"You set your jaw and walk through the humming bed. At its heart, a rose has grown around a dropped ring.", no:"You sit down among them, just for a moment. When you wake, the light has changed.", win:{loot:2}},
      {t:"Learn the tune", s:"INT", d:"normal", ok:"You hum it back, and the roses fall quiet as if surprised to hear it from someone else.", no:"The tune slips sideways in your head and you lose your way among the beds.", win:{lore:"r5_lullaby"}}
    ]},
    {id:"r5_swing", sites:["gardens"], x:"A child's swing hangs from an old oak, creaking back and forth in air that doesn't move. Nobody is on it.", c:[
      {t:"Catch it and hold it still", s:"STR", d:"easy", ok:"You catch the ropes. The swing stops, and something in the garden seems to sigh. Tucked in the bark above is a child's hidden treasure.", no:"It pulls against you with a strength no swing should have. You let go, rattled.", win:{loot:1}},
      {t:"Walk past and don't look back", s:"DIS", d:"normal", ok:"The creaking follows you a long way. You don't turn around.", no:"You turn around. It's still swinging. You stand there much too long."}
    ]},
    {id:"r5_fountain", sites:["any"], x:"A wishing fountain in a small square, its basin thick with coins. A carved plaque reads: “For the Prince's health.” Every coin is from the same month.", c:[
      {t:"Gather the coins carefully", s:"ORD", d:"normal", ok:"You fish out a good handful. Someone wished very hard. It didn't work, but the coins still spend.", no:"Your hands go numb in the grey water before you've found anything worth keeping.", win:{loot:1}},
      {t:"Leave them be", s:"DIS", d:"easy", ok:"You leave the wishes where they are. It feels right, and you walk on clearer-headed.", no:"You leave them, but the thought of all those wishes weighs on you.", win:{next:2}}
    ]},
    {id:"r5_bells", sites:["any"], x:"Every bell in Crownfall begins to toll at once, slow and grey, for an hour that never comes. The sound gets inside your skull.", c:[
      {t:"Cover your ears and march", s:"VIT", d:"normal", ok:"You put your head down and walk through the tolling until it fades.", no:"The bells shake you to your bones. You stumble on, drained."},
      {t:"Count the strokes and keep your head", s:"DIS", d:"normal", ok:"Twelve, thirteen, fourteen… you count until it ends, and you're still yourself.", no:"You lose count, and then you lose a while."},
      {t:"Work out which tower started it", s:"INT", d:"hard", ok:"The palace chapel bell rang first. Following it, you find the bell-ringer's store of candles and food.", no:"The echoes bounce between towers. You give up, deafened and lost.", win:{supply:2}}
    ]},
    {id:"r5_patrol", sites:["any"], x:"Somewhere above, iron boots strike stone — slow, regular, tireless. The Hollow Knight is making his rounds. The steps are coming this way.", c:[
      {t:"Hide and hold your breath", s:"DIS", d:"normal", ok:"You press into a doorway as an empty suit of armour passes, a light gleaming in its helm. It doesn't see you.", no:"Your breath catches as he passes. The helm turns. You run, and lose things running."},
      {t:"Track his route", s:"ORD", d:"normal", ok:"You learn his circuit: every corridor, every turn. Now you know where he won't be.", no:"His route makes no sense. Then you realise it's yours — the old night watch. That's worse.", win:{next:2}}
    ]}
  ],
  story: [
    {id:"r5_corwin_reveal", at:5, who:"corwin", sites:["any"], req:{flag:"fed_corwin"}, x:"Corwin lands on the Queen's grave and doesn't say anything for a long moment. Then, quietly: “She used to feed me grapes. Nobody's fed me grapes since.” He was hers. He's been looking for her for years.", c:[
      {t:"Sit with him", s:null, ok:"He shuffles closer, gruff again: “You've fed me. You're tolerable. There's a servants' passage behind the kitchens — I'll show you when it counts.”"},
      {t:"Offer him a shiny thing", s:null, ok:"He takes it, very gently, and sets it on her stone instead of keeping it. “I'll show you the servants' passage,” he mutters. “Don't make it weird.”", win:{fed:1, gift:1}}
    ]},
    {id:"r5_corwin_reveal_b", at:5, who:"corwin", sites:["any"], req:{noflag:"fed_corwin"}, x:"Corwin lands on the Queen's grave and doesn't say anything for a long moment. Then, quietly: “She used to feed me grapes. Nobody's fed me grapes since.” He was hers. He's been looking for her for years.", c:[
      {t:"Sit with him", s:null, ok:"You sit together a while. Eventually he shakes himself out. “Don't tell anyone about this. I have a reputation.”"},
      {t:"Offer him a shiny thing", s:null, ok:"He looks at it, then at you. “…Fine. It's a start.” He takes it and flies up to the palace roof.", win:{fed:1, gift:1}}
    ]},
    {id:"r5_oswin_chapel", at:8, who:"oswin", sites:["any"], req:{flag:"shared_with_oswin"}, x:"Brother Oswin kneels in the King's chapel, where the King once knelt. He doesn't rise. “I taught him the rite. I gave him what he asked for — an end to the pain. Look how quiet it is, Hearthguard. Isn't it a gift?”", c:[
      {t:"Ask him why", s:null, ok:"“You ran that night, Hearthguard. You know what it is to want the pain to stop.” He stands. “You shared your fire with me. I won't forget that.” Then he walks into the Grey, toward the Throne."},
      {t:"Tell him it was never his to take", s:null, ok:"He only nods, as if you've said something sad. “You shared your fire with me. I won't forget that.” He walks into the Grey toward the Throne, and doesn't look back."}
    ]},
    {id:"r5_oswin_chapel_b", at:8, who:"oswin", sites:["any"], req:{noflag:"shared_with_oswin"}, x:"Brother Oswin kneels in the King's chapel, where the King once knelt. He doesn't rise. “I taught him the rite. I gave him what he asked for — an end to the pain. Look how quiet it is, Hearthguard. Isn't it a gift?”", c:[
      {t:"Ask him why", s:null, ok:"“You ran that night, Hearthguard. You know what it is to want the pain to stop.” He doesn't fight you. He simply walks into the Grey, toward the Throne."},
      {t:"Tell him it was never his to take", s:null, ok:"“Perhaps,” he says gently. “But you ran that night, Hearthguard. You know what it is to want the pain to stop.” Then he is gone into the Grey, toward the Throne."}
    ]}
  ],
  corwin: [
    {id:"r5_corwin_kitchen", sites:["palace"], x:"Corwin is in the palace kitchens, head-first in a sugar bowl. He emerges grey with dust. “I know where everything is in this place. Don't ask how. Do you have anything shiny, or are you just going to stare?”", c:[
      {t:"Give him a trinket", s:null, ok:"He snatches it and tucks it away somewhere you'd rather not know about. “Pleasure doing business. Check your pack tomorrow.”", win:{fed:1, gift:1}},
      {t:"Ask what he knows about the palace", s:null, ok:"“The roof leaks, the cook was a tyrant, and the King liked figs.” He pauses. “That's all you get for free.”"}
    ]},
    {id:"r5_corwin_window", sites:["gardens"], req:{minFrag:6}, x:"Corwin sits on the sill of a high garden window, staring into an empty bedchamber. When he notices you, he puffs up. “I was not being sentimental. I was resting my eyes. Got anything shiny?”", c:[
      {t:"Give him something shiny", s:null, ok:"He takes it and sets it carefully on the sill, facing in. “For later,” he says, and doesn't explain.", win:{fed:1, gift:1}},
      {t:"Leave him be", s:null, ok:"You nod and leave him to his window. “Rude,” he calls after you, without any heat."}
    ]}
  ],
  finale: {
    name: "The Throne Room",
    intro: "The throne room doors stand open. Beyond them, a single figure in Hearthguard plate walks the length of the hall and back, and back again, a pale light burning in his helm where a face should be. You know the walk. You followed it for years.",
    stages: [
      {id:"r5_fin_patrol", sites:["any"], x:"The Hollow Knight halts. The light in his helm turns to you — an intruder in the King's hall — and his sword comes up in the old Hearthguard guard. He strikes without a word.", c:[
        {t:"Parry and hold your ground", s:"STR", d:"normal", ok:"Steel rings on steel. You take every blow on your blade and don't give a single step.", no:"His strength is the strength of a man who never stopped training. You're driven back across the floor."},
        {t:"Weather the blows and wear him down", s:"VIT", d:"normal", ok:"You take the strikes on your shoulder, your arm, your shield, and keep standing. His rhythm slows.", no:"He doesn't tire. You do. Every breath costs more."}
      ]},
      {id:"r5_fin_oath", sites:["any"], x:"He pauses between strikes, helm cocked, as if something about you is almost familiar. If he would only hear the words, he might remember what he's guarding.", c:[
        {t:"Recite the Hearthguard oath", s:"ORD", d:"normal", ok:"You stand at attention and speak it, word for word, as you were taught. His blade lowers by an inch.", no:"You stumble over the words. The light in his helm flares and he comes at you again."},
        {t:"Speak the oath you found", s:null, frag:10, ok:"“I keep the flame. I keep the watch. Whatever falls, I do not.” His voice joins yours on the last line, rusty and low."}
      ]},
      {id:"r5_fin_helm", sites:["any"], x:"The Hollow Knight stands still at last, and the light in his helm flickers. He knows you. The Shard of Order burns there like an eye, and to take it you'll have to look straight into it.", c:[
        {t:"Hold his gaze and take the shard", s:"DIS", d:"normal", ok:"You reach into the cold helm, meet the light that was once your captain's eyes, and close your hand around the shard. You don't look away. Not this time.", no:"The shame comes up in you like a tide and you flinch from his gaze. You'll have to steady yourself and try again."}
      ]}
    ],
    after: null,
    win: "Callum's empty armour sinks to one knee in front of you, the shard warm in your hand. From somewhere inside the hollow plate comes his voice, rough and fond: “You came back. Good. Finish it.” Piece by piece, the armour comes apart and settles on the throne room floor like a tired man finally lying down. Outside, the hollow guards lower their halberds. Beyond the palace, through the far windows, a path opens into the Grey — toward the throne at its heart.",
    last: "In the silence, you realise you've been standing at attention. You stay that way a while longer, for him.",
    lose: "You fall back from the throne room with the iron footsteps behind you, steady and endless. He'll be there tomorrow. He's always there.",
    skipIf: "fed_corwin",
    skipText: "Corwin drops onto your shoulder. “This way. Servants' passage. The Queen used it to sneak me figs.” He leads you through a hidden door behind the kitchens, past the worst of the palace."
  }
};

EXP_REGIONS[6] = {
  n: 6,
  name: "The Grey Throne",
  tagline: "Beyond Crownfall, the Grey stands like a wall — and something sits at its heart.",
  gate: {ALL:5},
  guardian: "The Grey",
  shard: "The Heart Shard",
  intro: "Past the last street of Crownfall, the fog stops drifting and stands up like a wall. You lift the lantern from Last Light, the five shards inside it burning green and blue and white and gold and red, and step in. Everything you have carried this far comes with you. So does everything you left behind.",
  sites: [
    {id:"fog", name:"The Fog Wall", stats:["VIT","DIS"], desc:"Grey so thick it presses on your chest and whispers in your own voice."},
    {id:"halls", name:"The Echoing Halls", stats:["INT","ORD"], desc:"Corridors built of memory, where every place you've been comes back wrong."},
    {id:"steps", name:"The Ashen Steps", stats:["STR","DIS"], desc:"An endless stair of ash, and Faded pilgrims climbing it toward the throne."}
  ],
  acts: ["Into the Fog", "The Echoes", "The Throne"],
  fragments: [
    {t:"The lantern from Last Light", x:"Deep in the fog, where it should gutter, the lantern from Last Light burns brighter instead. The five shards lean toward the dark like flowers toward a window."},
    {t:"A pilgrim's prayer", x:"Scratched on a stone by the path: “Take it from me. Take all of it. I don't want to feel anything ever again.” Below it, hundreds of marks, one for every pilgrim who agreed."},
    {t:"Oswin's footprints", x:"His sandal prints, ahead of you in the ash. Back in Crownfall they wandered. Here they are steady, unhurried, sure of where they're going."},
    {t:"The warm edge", x:"You reach a place where the fog is warm — not cold, warm, like breath. Something at the centre of all this is still alive, and still hurting."},
    {t:"The Warden's flower", x:"A single moss-flower like the ones that bloomed where Elowen fell — but grey here, petals curled shut. Far behind you, the real ones are still blooming. You hope."},
    {t:"Edric's page", x:"One page from the Drowned Archive, drifting in the fog. Blank. Whatever was written on it, the Grey has drunk it all. You think of Maren, and fold it into your coat anyway."},
    {t:"Hrumm's bell", x:"The bell from Holtvar, the one frozen mid-ring, hanging from nothing in the fog. It rings once, very slowly. It takes a long time to stop."},
    {t:"The Lady's lantern", x:"A ferryman's lantern floating at eye level, unlit. In the fen she wept and became one to guide travellers home. Here, it is waiting for someone to light it."},
    {t:"The shattered pedestal", x:"At the top of the steps, ringed by fog: the Hearthstone's pedestal, split in six clean pieces. You've stood beside it before. You remember exactly where."},
    {t:"Two names", x:"Carved into the arm of the fog-throne, over and over, as if by a fingernail: the Queen's name and the Prince's. Some of the carvings are very old. Some are new."},
    {t:"Oswin's last letter", x:"Left on the pedestal, folded once: “If you come, Hearthguard, I won't stop you. I only ask that you understand what you're giving back to them.”"},
    {t:"The King's crown", x:"A crown lies at the foot of the throne, cold as river stone. Whoever wore it doesn't need it anymore. He has been something else for a long time."}
  ],
  lore: {
    "r6_voice": {t:"What the Grey says", x:"It doesn't lie, which is the worst of it. You ran. People faded. It only leaves out the rest — that you came back, and that you're still walking."},
    "r6_hollow": {t:"The woodcutter's axe", x:"The axe in the Faded woodcutter's hands is Thornwood ash, notched from years of honest work. The real woodcutters of the Hollow lowered theirs and wept. This one is only the Grey's memory of them, and it can't let go."},
    "r6_names": {t:"Naming the lost", x:"The woodcutters of the Hollow. The scholar who wrote “We were not meant to forget.” The child with the snowball. The courtiers in the ballroom. You say them aloud, and for a breath the fog thins around each one."},
    "r6_blank": {t:"The blank books", x:"Edric bound every memory he could steal so nothing would be forgotten. The Grey keeps its own library: every book empty, every page clean, nothing remembered and so nothing lost. It is the same fear, wearing a different face."},
    "r6_prayer": {t:"The ferryman's prayer", x:"Carry me over, carry me home, the water is wide but I'm not alone. You spoke it in the fen. The Lady's lantern stirs when you speak it again."},
    "r6_pilgrims": {t:"The pilgrims of the Grey", x:"They came from every corner of Aldmere, the ones who heard there was a place where nothing hurt. They're not prisoners. That's what makes them hard to lead down. Some of them follow you anyway."},
    "r6_mirror": {t:"The Last Light mirror", x:"An inscription on the frame, in Hearthguard script: “The tower at the edge, where the watch looks home.” Last Light was never just a watchtower. It was the place they sent the guards who needed to remember why they served."},
    "r6_countersign": {t:"Callum's drill", x:"Challenge: “Who keeps the flame?” Answer: “All who are cold.” Callum made you shout it a hundred times your first winter. You thought it was a password. It was a promise."},
    "r6_torn_map": {t:"Maren's torn map", x:"A scrap of a cartographer's map, the line of the Grey drawn in a firm, impatient hand, and a safe path marked in red. In the corner, a tiny lighthouse — her signature. She got this far once, alone."},
    "r6_grey": {t:"The heart of the Grey", x:"It isn't a monster. It's a man's grief, too big for one person, poured out over a kingdom so he wouldn't have to hold it. Every Faded soul is carrying a little of what he couldn't."},
    "r6_bell": {t:"Hrumm's count", x:"The bell rings once for every name Hrumm carved and scratched over and over. You count with it. Not one of them, he promised. Not one."}
  },
  campfire: [
    "There's no wood in the Grey, so you sit around the lantern instead. Five shards, five places, five people you freed. The light falls on your hands and they look like someone else's — someone who has done this before.",
    "You think of the woodcutters in the Hollow lowering their axes, and the one who looked at you and said “Hearthguard?” You know now why you couldn't answer.",
    "You think of Maren saying “Let's keep moving” and meaning everything else. You find you've been saying it to yourself all day.",
    "Somewhere behind you, Hrumm is asleep in the snow, and the Lady's lantern is floating over the fen, and Callum's armour lies quiet on the throne room floor. You carry all of them now. It's heavier than you expected, and lighter.",
    "The Grey murmurs at the edge of the lantern light in your own voice. You don't answer. You eat, slowly, and check your boots, and keep the watch.",
    "You remember Last Light the morning you woke: one beacon flickering, no name, no past. You had nothing then. You had less to lose. You wouldn't go back.",
    "You hold the lantern close and feel the warmth of the shards against your chest. Life, Memory, Strength, Will, Order. One more. Just one more."
  ],
  encounters: [
    {id:"r6_voice", sites:["fog"], x:"The fog speaks, and it's your voice — tired, kind, reasonable. “You ran once. Run again.”", c:[
      {t:"Keep walking", s:"DIS", dc:20, ok:"You put one foot in front of the other and let it talk. It sounds like you. It isn't you anymore.", no:"It's so reasonable. You stop, just for a moment, and the cold gets in."},
      {t:"Answer it", s:"INT", dc:20, ok:"“Yes,” you tell it. “And then I came back.” The voice has nothing to say to that. It goes quiet for a long while.", no:"You argue, and it agrees with everything you say, until you can't remember which side you were on.", win:{lore:"r6_voice"}},
      {t:"“You've said no before.”", s:"DIS", dc:18, flag:"refused_the_dream", ok:"You refused the Lady's perfect dream in the fen. This is easier. “No,” you say again, and walk on.", no:"You said no once. It's harder the second time, when the voice is your own."}
    ]},
    {id:"r6_visions", sites:["halls"], x:"The hall fills with grey figures: the woodcutters of the Thornwood Hollow, Edric's books open and blank, Holtvar's villagers still mid-laugh. All of them grey. All of them here.", c:[
      {t:"Push through the visions", s:"DIS", dc:21, ok:"You walk through them without letting them hold you. They are memories, not chains.", no:"A grey woodcutter turns his face to you as you pass, and you can't look away. You come out the other side shaking."},
      {t:"Name each one aloud", s:"INT", dc:21, ok:"The woodcutter. The scholar. The child with the snowball. As you name them, the fog thins, and you find someone's dropped pack in the clearing it leaves.", no:"You reach for a name and find only grey. The visions close in.", win:{supply:1, lore:"r6_names"}}
    ]},
    {id:"r6_lantern", sites:["fog"], x:"Your lantern flickers. Inside it, the five shards dim one by one — Life, Memory, Strength, Will, Order. The Grey is drinking them too.", c:[
      {t:"Shield it with your body", s:"VIT", dc:20, ok:"You curl around the lantern and let the cold take you instead. Slowly, the shards brighten again.", no:"The cold goes right through you to the glass. The shards come back, but you're weaker."},
      {t:"Rearrange the shards in the order you found them", s:"ORD", dc:20, ok:"Thornwood, the Archive, Ironpeak, the fen, Crownfall. In order, they lean together and burn steady.", no:"You fumble the order. The light steadies, but only after you've lost time and warmth."}
    ]},
    {id:"r6_pilgrims", sites:["steps"], x:"Faded pilgrims climb the ashen stairs toward the throne, one slow step at a time. Some still carry the things they came with — a hat, a doll, a woodcutter's axe.", c:[
      {t:"Climb past them", s:"STR", dc:20, ok:"You take the stairs two at a time, past them, around them, up. They don't notice you go.", no:"The steps crumble under your boots and you slide down among them. It takes a long time to climb back."},
      {t:"Lead them back down", s:"ORD", dc:22, ok:"One by one, you turn them, take their hands, and walk them down toward the edge of the fog. The last one presses something into your palm.", no:"They turn back toward the throne the moment you let go. You lose hours, and supplies, and hope.", win:{lore:"r6_pilgrims", loot:"rare"}}
    ]},
    {id:"r6_maren", sites:["any"], req:{flag:"helped_maren"}, x:"At the edge of the fog, a figure with a map case and one sharp eye. Maren. She doesn't ask how you got this far. “Figured you'd need a cartographer,” she says. “You're hopeless with directions.”", c:[
      {t:"Let her mark the path", s:null, ok:"She marks the last safe path in red ink, rolls up the map, and shoves it into your hands. “Don't get lost. I'm not coming in after you twice.”", win:{skip:1}}
    ]},
    {id:"r6_torn_map", sites:["any"], req:{noflag:"helped_maren"}, x:"A torn scrap of map lies in the ash, the edge of the Grey drawn in a firm, impatient hand. A cartographer was here — alone.", c:[
      {t:"Read what's left of it", s:"INT", dc:20, ok:"Half a path in red ink, half your guesswork. Together, they're enough.", no:"The map ends where you need it most. You wander until the fog gives you back.", win:{lore:"r6_torn_map", next:2}},
      {t:"Leave it where she dropped it", s:null, ok:"Maybe she'll come back for it. You hope she does."}
    ]},
    {id:"r6_woodcutter", sites:["fog"], x:"A grey woodcutter stands in the fog where no tree has ever grown, axe raised mid-swing, exactly like the ones in the Thornwood Hollow. He's not real. He doesn't know that.", c:[
      {t:"Gently take the axe from his hands", s:"STR", d:"normal", ok:"Just as before, he lets it go. He sighs, sits, and fades into ordinary fog.", no:"His grip is iron. The axe stays raised, and you back away.", win:{lore:"r6_hollow"}},
      {t:"Slip past him", s:"DIS", d:"easy", ok:"You leave him to his swing. Somewhere far away, the real one is at peace.", no:"You stop to watch him swing, and swing, and the fog sinks into you."}
    ]},
    {id:"r6_briars", sites:["steps"], x:"Grey briars grow across the stairs, thick as the Warden's. They tighten as you approach, the way they did in the Thornwood.", c:[
      {t:"Sing the druids' song", s:"INT", d:"normal", ok:"You remember enough of the old song to calm a forest. The briars uncurl and let you through.", no:"You lose the tune halfway. The thorns tighten around your sleeves."},
      {t:"Tear through them", s:"STR", d:"hard", ok:"You rip the grey briars apart with your bare hands. In the tangle, something someone lost on the way up.", no:"They tear you as much as you tear them. You come out bleeding supplies.", win:{loot:"rare"}}
    ]},
    {id:"r6_flower", sites:["fog"], x:"In the fog, a single moss-flower blooms green — the kind that grew where the Warden fell. Everything around it is grey. It shouldn't be here at all.", c:[
      {t:"Carry it, keep it warm", s:"VIT", d:"normal", ok:"You cup it against your chest and walk on. The fog seems to avoid you, a little.", no:"The cold of your hands is too much for it. It closes, and you feel the loss more than you should.", win:{shield:1}},
      {t:"Leave it to grow", s:"DIS", d:"easy", ok:"Some things should stay where they've rooted. You walk on lighter.", no:"You walk on, but keep looking back for it until you've lost your way.", win:{next:2}}
    ]},
    {id:"r6_books", sites:["halls"], x:"Shelves upon shelves, like the Drowned Archive — but these books are dry, and every page is blank. Edric would have wept to see it.", c:[
      {t:"Look for what's missing", s:"INT", d:"normal", ok:"You understand at last what Edric feared, and why. You're not sure he was entirely wrong.", no:"Blank page after blank page, until your own thoughts start to feel blank too.", win:{lore:"r6_blank"}},
      {t:"Search the shelves in order", s:"ORD", d:"normal", ok:"Shelf by shelf, until one book isn't blank: a pressed flower, a ribbon, and a reader's forgotten coins.", no:"Every book is the same. You lose count, and then you lose time.", win:{loot:1}}
    ]},
    {id:"r6_water", sites:["halls"], x:"Grey water floods the hall, rising fast — the same cold rush you felt beneath the lake in the Archive.", c:[
      {t:"Swim for the stairs", s:"VIT", d:"normal", ok:"You swim, gasping, and haul yourself onto dry stone as the water peaks behind you.", no:"The cold steals your breath. You make it, but your pack is soaked through."},
      {t:"Find the drain, like before", s:"ORD", d:"easy", ok:"There's always a drain lever. Edric built them everywhere, and the Grey copied him. The water swirls away.", no:"There's no lever where you expect it. You climb out the hard way."}
    ]},
    {id:"r6_rolls", sites:["halls"], x:"A long scroll hangs from the ceiling: a list of names, like Edric's, each with “TAKEN” beside it. At the very bottom is a space where a name has been scraped away to bare grey.", c:[
      {t:"Puzzle out the scraped name", s:"INT", d:"hard", ok:"You trace the scratches with your thumb, letter by letter. You don't say it aloud. Not yet. But you keep it, and something else comes free from behind the scroll.", no:"The scratches mean nothing. You walk away with a headache and a hollow feeling.", win:{loot:"rare"}},
      {t:"Search the list for anyone you met", s:"ORD", d:"normal", ok:"The scholar is here, and Holtvar's baker, and Maren's father. Next to Edric's name, someone has crossed out “TAKEN” and written “RETURNED.”", no:"Too many names. You can't find a single one you know.", win:{supply:1}}
    ]},
    {id:"r6_bell", sites:["fog"], x:"Hrumm's bell from Holtvar hangs in the fog, ringing once, slowly, like it rang in the frozen village. The sound carries far.", c:[
      {t:"Walk toward the sound", s:"VIT", d:"normal", ok:"You follow the bell through the deepest fog and come out at a clear patch of path, the toll fading behind you.", no:"The sound seems to come from everywhere. You march in circles until your legs give out."},
      {t:"Count the rings and take a bearing", s:"ORD", d:"normal", ok:"One ring for every name he swore to protect. By the time it stops, you know exactly where you are.", no:"You lose count, and with it your bearing.", win:{lore:"r6_bell", next:2}}
    ]},
    {id:"r6_joke", sites:["steps"], x:"Somewhere above you, an echo of Hrumm's huge voice booms down the stairs, telling his old joke to no one — the one about the goat and the avalanche. He never did get to the punchline.", c:[
      {t:"Shout the punchline back", s:null, ok:"You don't know the punchline, so you make one up. The echo laughs, enormous and delighted, and for a moment the stairs feel warmer.", win:{supply:1}},
      {t:"Climb on while it's distracted", s:"STR", d:"normal", ok:"You take the steps hard and fast while the echo rumbles on.", no:"The laughter shakes the stair. You slip and lose ground."}
    ]},
    {id:"r6_ice", sites:["steps"], x:"The ash gives way to ice, a frozen stair like the Giant's Stair on Ironpeak. Old giant-runes glint beneath the surface.", c:[
      {t:"Climb it", s:"STR", d:"normal", ok:"You kick footholds into the ice and climb, the way you climbed Ironpeak.", no:"The ice is harder here. You slide back twice, bruised and cold."},
      {t:"March it barefoot-cold and fast", s:"VIT", d:"hard", ok:"You run the frozen stair before the cold can catch you, and at the top find a cache of furs left by some earlier pilgrim.", no:"The cold catches you halfway. You crawl the rest.", win:{supply:2}}
    ]},
    {id:"r6_holtvar", sites:["any"], req:{flag:"thawed_village"}, x:"Footsteps behind you in the ash — a Holtvar woman, older than she should be, a bundle of firewood on her back. “The ones you woke,” she says. “We're keeping the beacon at Last Light. Thought you'd want to know someone's on watch behind you.”", c:[
      {t:"Thank her", s:null, ok:"She presses bread and a little dried meat into your hands, then turns and walks back toward the edge of the fog, toward home.", win:{supply:2}}
    ]},
    {id:"r6_lady", sites:["fog"], x:"A ferryman's lantern floats ahead of you in the fog, unlit — the Lady's lantern, from the fen. It drifts, waiting.", c:[
      {t:"Follow it without hoping", s:"DIS", d:"normal", ok:"You follow it the way you crossed the stepping stones in the fen: by wanting nothing. It leads you true.", no:"You want too much — to see her, to be shown the way home. The lantern drifts off and leaves you."},
      {t:"Speak the ferryman's prayer", s:"INT", d:"normal", ok:"The old words come back to you. The lantern sparks, just for a moment, and lights the way ahead.", no:"You stumble over the words. The lantern hangs dark and still.", win:{lore:"r6_prayer"}}
    ]},
    {id:"r6_feast", sites:["halls"], x:"A long table set for a feast, like the one in the fen — but every dish is grey ash, and every chair is pulled out, waiting for you to sit.", c:[
      {t:"Turn your back on it", s:"DIS", d:"hard", ok:"You turn away and don't look back. Behind the table, where you'd never have looked if you'd sat down, someone left a pack of real food.", no:"You sit, just to rest. The ash tastes like nothing, and nothing tastes like home.", win:{supply:2}},
      {t:"Search beneath the table", s:"ORD", d:"normal", ok:"Under the tablecloth, a dropped silver spoon with the royal crest.", no:"Ash, and more ash, and your hands come up grey.", win:{loot:1}}
    ]},
    {id:"r6_reeds", sites:["steps"], x:"Reeds grow between the ashen steps, whispering a name — your real name, the one the Lady called in the fen. It's closer now. Almost clear.", c:[
      {t:"Don't stop to listen", s:"DIS", d:"normal", ok:"You'll hear it when you're ready, from someone who means it. You climb on.", no:"You stop to listen. The reeds whisper on and on, and never quite say it."},
      {t:"Push through the reeds", s:"VIT", d:"normal", ok:"You wade up through the whispering reeds and out the other side, cold and steady.", no:"The reeds are knee-deep and grasping, like the fen's mud. You're exhausted when you reach the top."}
    ]},
    {id:"r6_dance", sites:["halls"], x:"The Echoing Halls become the Crownfall ballroom. Grey courtiers dance without music, and one of them holds out her hand to you, holding a dance card with your duty written on the last line.", c:[
      {t:"Dance the last dance", s:"ORD", d:"normal", ok:"You take her hand and dance the dance you missed. At the end she curtsies, and steps aside to show you the door.", no:"You lose the step and the dancers close around you. It takes a long time to find a way out."},
      {t:"Decline and walk on", s:"DIS", d:"normal", ok:"“I'm on watch,” you tell her. She nods, as if that's the right answer.", no:"You hesitate too long, and the dance draws you in."}
    ]},
    {id:"r6_callum", sites:["steps"], x:"A voice barks down the ashen stair — Callum's, drilling recruits a lifetime ago. “Feet planted, kid! What do we hold?”", c:[
      {t:"Plant your feet and hold", s:"STR", d:"normal", ok:"You set your stance, and the fog that had been pushing you back pushes against stone instead.", no:"You plant your feet. It isn't enough. The Grey shoves you back down a flight."},
      {t:"Shout back as you were taught", s:"ORD", d:"easy", ok:"“The line, Captain!” Your voice echoes up the stairs, and for a moment you climb like a soldier again.", no:"The words stick in your throat. You never got to say goodbye."},
      {t:"Give the countersign", s:null, int:8, ok:"“Who keeps the flame?” he calls. “All who are cold,” you answer — and the fog ahead parts like a door held open.", win:{lore:"r6_countersign"}}
    ]},
    {id:"r6_tabard", sites:["any"], x:"A red Hearthguard tabard lies in the ash, the flame crest still bright. Inside the collar, your name is stitched. You left it in Crownfall. It found its way here anyway.", c:[
      {t:"Put it on", s:null, ok:"It still fits. You stand straighter in it, and the cold seems to give you a little room.", win:{shield:1}},
      {t:"Leave it", s:null, ok:"Not yet. You'll earn it back first."}
    ]},
    {id:"r6_teapot", sites:["fog"], x:"A cold teapot on a flat stone in the fog, two cups set out beside it. Brother Oswin's, surely — the same tea he offered at the Warden's shrine and on the mountain. He knew you'd come this way.", c:[
      {t:"Resist the urge to sit and rest", s:"DIS", d:"normal", ok:"It would be so easy to sit. You don't. You leave the cups untouched.", no:"You sit, just for a moment. The fog is very soft here. It takes a long time to get up."},
      {t:"Search the little camp", s:"ORD", d:"normal", ok:"Beneath the stone, a wrapped bundle: rations, and a note in a careful hand. “For the road. — O.”", no:"Nothing but tea leaves and cold ashes.", win:{supply:2}}
    ]},
    {id:"r6_mirror", sites:["halls"], x:"A tall mirror of fog shows you yourself the morning you woke at Last Light: alone, confused, one beacon flickering. You look so lost.", c:[
      {t:"Look closely at who you were", s:"INT", d:"normal", ok:"You were frightened, and empty, and you got up and walked anyway. That counts for something.", no:"The reflection stares back, grey and blank, until you can't tell which of you is which."},
      {t:"Walk away from it", s:"DIS", d:"easy", ok:"That person isn't you anymore. You turn your back on the mirror.", no:"You keep glancing back, and lose your way."},
      {t:"Read the inscription on the frame", s:null, int:9, ok:"Hearthguard script, worn almost smooth. You understand at last why you woke where you did.", win:{lore:"r6_mirror"}}
    ]},
    {id:"r6_heart", sites:["any"], req:{minFrag:6}, x:"The fog grows warm around you, and for a moment you hear it — not your voice, but someone else's. A man weeping, very quietly, as if he's been doing it so long he's forgotten how to stop.", c:[
      {t:"Follow the sound", s:"VIT", d:"normal", ok:"You walk toward it until the warmth is almost painful. You understand now what you're walking into.", no:"It comes from everywhere. You walk until you're spent, no closer.", win:{lore:"r6_grey"}},
      {t:"Steel yourself and stay on your path", s:"DIS", d:"normal", ok:"Not yet. You'll go to him when you're ready, with the lantern in your hands.", no:"The grief in it is too much. You sit down in the fog for a while.", win:{next:2}}
    ]}
  ],
  story: [],
  corwin: [
    {id:"r6_corwin_quiet", sites:["any"], x:"Corwin lands on your shoulder in the fog. For once, he says nothing at all. He just presses close against your neck, and stays there.", c:[
      {t:"Let him stay", s:null, ok:"You walk on together in silence. After a long while, very quietly, he says: “She'd have liked you.”"},
      {t:"Offer him something shiny", s:null, ok:"He looks at it and shakes his head. “Keep it. You'll need it more.” Which is how you know how bad it is in here.", win:{gift:1}}
    ]},
    {id:"r6_corwin_scout", sites:["any"], req:{fedMin:3}, x:"Corwin lands on your shoulder, says nothing, then takes off into the fog ahead of you. “I'll scream if anything wants to eat you,” he calls back. “I'll scream louder if it wants to eat me.”", c:[
      {t:"Follow his voice", s:null, ok:"Every few minutes, a raucous scream from the fog ahead — and you step around whatever it was warning you about.", win:{next:1}}
    ]}
  ],
  finale: {
    name: "The Heart of the Grey",
    intro: "At the top of the Ashen Steps, the fog opens onto a round hall with no roof and no walls. In the centre lies the Hearthstone's broken pedestal, and beyond it, on a throne made of fog, sits the shape of a man with his head in his hands. Brother Oswin stands between you and him, as gentle as ever.",
    stages: [
      {id:"r6_fin_oswin", sites:["any"], x:"Oswin raises a hand — not to strike, only to ask you to stop. “Please. He's finally quiet. They all are. If you light that flame, it will hurt them again. All of them, all at once.”", c:[
        {t:"Hold your ground and walk past him", s:"DIS", d:"normal", ok:"You don't stop. He doesn't stop you. He only watches you pass, as if it hurts him to.", no:"His calm is the Grey's own calm, and it wraps around you. You stand there too long, nodding."},
        {t:"Tell him why the pain matters", s:"INT", d:"normal", ok:"“They're not at peace. They're gone. Grief is just love with nowhere to go — and you took away the love too.” Oswin flinches, and steps aside.", no:"He has an answer for everything, said kindly. You lose the thread of your own argument."},
        {t:"Remind him of the tea", s:null, flag:"shared_with_oswin", ok:"“You shared your tea with me once. You were kind. Be kind now.” Oswin's face crumples. He steps aside — and then, quietly, falls in behind you.", win:{shield:1}}
      ]},
      {id:"r6_fin_king", sites:["any"], x:"The Grey shows you the night it fell: the flame shattering, Callum shouting your name — and you, running. Then it shows you the King on his throne of fog, so thin with grief he's barely there.", c:[
        {t:"Resist it", s:"DIS", d:"normal", ok:"You watch yourself run and you don't look away. The vision breaks against your will like fog against stone.", no:"You watch yourself run, and some part of you wants to follow. The cold floods in."},
        {t:"Accept it", s:"VIT", d:"normal", ok:"“Yes. I ran. I'm here now.” You say it and stand under the weight of it. It doesn't crush you.", no:"You try to carry it all at once. Your knees buckle."},
        {t:"Reach him through his grief", s:"INT", d:"normal", ok:"You speak their names to him — the Queen, the Prince — softly, the way someone should have said them a long time ago. He lifts his head.", no:"The names catch in your throat. The King doesn't hear you over his own silence."},
        {t:"Give him the Queen's locket", s:null, flag:"kept_queens_locket", ok:"You kneel and press the silver locket into his grey hands. He opens it. Inside are two small portraits, and he looks at them for a long, long time."}
      ]},
      {id:"r6_fin_flame", sites:["any"], x:"The King has the last shard inside him, and he gives it to you — a small, warm, red-gold thing, like a held breath let go. Six shards. One pedestal. One flame, waiting to catch.", c:[
        {t:"Reignite the Hearthstone", s:"BEST", d:"normal", ok:"You set the six shards in their places and put everything you are behind them. The flame catches.", no:"The light sputters in your hands. Not yet. Steady yourself. Try again."}
      ]}
    ],
    after: null,
    win: "The flame catches. The Grey doesn't die — it burns, and for one long moment the whole kingdom feels everything at once: grief, love, fear, joy, all of it, years of it, pouring back in. The King weeps at last, holding nothing and everything, and fades peacefully as himself. Oswin sits down by the flame, his hands open in his lap, and says, “It hurts.” From the edge of the light, Maren's voice: “Good. That means it's working.” Across Aldmere, the Faded begin to wake — not all of them, and not all at once — and far away at Last Light, the beacon becomes a true one. You remember your name. And you choose to stay on watch.",
    last: "Hold the line, Hearthguard.",
    lose: "The light gutters and the Grey closes over the hall, patient as ever. The lantern still burns in your hands. Tomorrow, you climb again.",
    skipIf: null,
    skipText: ""
  }
};

/*EXP-CONTENT-END*/
</script>
<script>
(() => {
const FITTING_URL = 'https://claude.ai/artifact/Nd4DYgNyJeBScB5iRw4p6X';
const ICON = {
  fitting:'<path d="M8 3.5l-5 3 2 4 2-1V20h10V9.5l2 1 2-4-5-3q-1.5 2-4 2t-4-2z"/>',
  habits:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.8 2.8L16.5 9"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r="1.2" fill="currentColor"/>',
  shelf:'<rect x="3" y="5" width="12.5" height="14" rx="2"/><path d="M8 9.5v5l4-2.5z"/><path d="M18.5 6.5v12M21 8.5v8"/>',
  wish:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
  plan:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8.5 15l2.2 2.2 4.8-4.7"/>',
  todo:'<rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/>',
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
const APPS = [
  {key:'fitting', name:'Fitting Room', desc:'Your closet and outfit builder', pill:'Ready'},
  {key:'habits', name:'Habits', desc:'Daily quests, XP, levels and a monthly boss', pill:'Ready', href:'#habits'},
  {key:'plan', name:'Planner', desc:'To-dos and calendar together', pill:'Ready', href:'#plan'},
  {key:'wish', name:'Wishlist', desc:'Things you want, with prices and links', pill:'Ready', href:'#wish'},
  {key:'shelf', name:'Shelf', desc:'Anime, shows, movies, books and manga you rated', pill:'Ready', href:'#shelf'},
];
const root = document.getElementById('root');

function greeting(){ const h=new Date().getHours(); return h<5?'Good night':h<12?'Good morning':h<18?'Good afternoon':'Good evening'; }
function dateLine(){ return new Date().toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'}); }

/* ---------- Home: app tiles in the order you choose ---------- */
const HOME = { order:null, arranging:false };
let homeDoc=null;
function ordered(){
  const keys=APPS.map(a=>a.key), o=[...new Set((HOME.order||[]).map(k=>k==='todo'||k==='cal'?'plan':k))].filter(k=>keys.includes(k));
  return [...o, ...keys.filter(k=>!o.includes(k))].map(k=>APPS.find(a=>a.key===k));
}
function saveOrder(){
  HOME.order = [...root.querySelectorAll('.tile[data-app]')].map(t=>t.dataset.app);
  try{ localStorage.setItem('dock-order', JSON.stringify(HOME.order)); }catch(e){}
  if(homeDoc) homeDoc.set({order:HOME.order}).catch(()=>{});
}
function home(){
  document.title = 'App Dock';
  const A=HOME.arranging;
  root.innerHTML = `
    <span class="label">${dateLine()}</span>
    <div class="homehead"><h1>${greeting()}, Bantiflok</h1><button type="button" class="arrange ${A?'on':''}" data-arrange="1">${A?'Done':'Arrange'}</button></div>
