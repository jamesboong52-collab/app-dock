    ${A?'<p class="note" style="margin-top:6px">Drag the tiles, or use the arrows, to put your apps in the order you like.</p>':''}
    <div class="grid ${A?'arranging':''}">${ordered().map(a=>A?`
      <div class="tile" data-app="${a.key}">
        <span class="ic">${svg(a.key)}</span>
        <span><b>${a.name}</b><p>${a.desc}</p></span>
        <span class="meta movers"><button type="button" class="mv" data-mv="-1" aria-label="Move ${a.name} earlier">←</button><span class="grip" aria-hidden="true">⠿</span><button type="button" class="mv" data-mv="1" aria-label="Move ${a.name} later">→</button></span>
      </div>`:`
      <button type="button" class="tile" data-app="${a.key}" data-go="${a.key}">
        <span class="ic">${svg(a.key)}</span>
        <span><b>${a.name}</b><p>${a.desc}</p></span>
        <span class="meta"><span class="pill">${a.pill}</span><span class="go" aria-hidden="true">→</span></span>

    r.onupgradeneeded=()=>{ const x=r.result; x.createObjectStore('items',{keyPath:'id'}); x.createObjectStore('outfits',{keyPath:'id'}); x.createObjectStore('blobs'); };

function bestStreak(hid){

function bucketsFor(r){

    for(let m=0;m<12;m++){ const f=new Date(r.from.getFullYear(),m,1), t=new Date(r.from.getFullYear(),m+1,0); let sum=0,n=0;

/* Goal progress: one dot per day from the start of the goal to today, axis runs to the deadline */
function sparkline(g){
  const hist=(g.history||[]).slice().sort((a,b)=>a.t-b.t); if(!hist.length) return '';
  const start=atMidnight(new Date(Math.min(hist[0].t, g.created||hist[0].t))), due=atMidnight(new Date(g.due)), today=atMidnight(new Date());
  const last=today<due?today:due, total=Math.max(1, Math.round((due-start)/86400000));
  const days=[]; let hi=0;
  for(let d=start; d<=last; d=addDays(d,1)){
    const end=addDays(d,1).getTime(); while(hi<hist.length && hist[hi].t<end) hi++;
    if(hi===0) continue; const k=dkey(d), upd=hist.some(p=>dkey(new Date(p.t))===k);
    days.push({d, v:hist[hi-1].v, upd, i:Math.round((d-start)/86400000)});
  }
  if(!days.length) return '';
  const W=330, H=130, L=6, R=6, T=18, B=22;
  const vals=days.map(x=>x.v).concat(g.target!=null?[g.target]:[]); let lo=Math.min(...vals), up=Math.max(...vals); const pad=((up-lo)||1)*0.12; lo-=pad; up+=pad;
  const X=i=>L+(i/total)*(W-L-R), Y=v=>T+(1-(v-lo)/(up-lo))*(H-T-B);
  const ty=g.target!=null?Y(g.target):null, pts=days.map(x=>[X(x.i),Y(x.v)]);

  document.getElementById('bcel')?.remove();
  const w=document.createElement('div'); w.id='bcel'; w.className='bcel';
  w.innerHTML=`<div class="bcard" role="dialog" aria-label="${escH(b.name)}">${medal(b,b.earned,130,{pct:b.value/b.goal,next:true})}<b>${escH(b.name)}</b><span class="btier t-${b.tier}">${TIERS[b.tierIdx].name}</span><p>${escH(b.desc)}</p>
    ${b.earned?`<p class="note">Unlocked${log[b.id]?' on '+new Date(log[b.id]).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):''}.</p>`:`<div class="meter big" style="width:100%"><i style="width:${b.value/b.goal*100}%"></i></div><p class="note">${fmtProg(b)}${b.unit?' '+b.unit:''}</p>`}
    <button class="addbtn" style="background:var(--c-hab)" data-bclose="1">Close</button></div>`;
  document.body.appendChild(w);
}
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); const cel=document.getElementById('bcel');
  if(cel && (e.target===cel || b?.dataset.bclose)){ cel.remove(); return; }
  if(b?.dataset.badge){ badgeDetail(b.dataset.badge); }
});

/* ---------- Quest mode: XP, levels, daily & weekly quests, monthly boss ---------- */
const XP_CHECK=10, XP_PERFECT=50, XP_BOSS=500, BOSS_HEAL=30;
const hRef = () => { const hs=H.habits.filter(h=>!h.archived); const f=(id,re)=>hs.find(h=>h.id===id)||hs.find(h=>re.test(h.name));
  return { wake:f('s1',/up at|wake/i), bed:f('s2',/make the bed|blinds/i), stretch:f('s3',/stretch/i), hyg:f('s4',/hygiene/i), screen:f('s5',/screen/i), read:f('s6',/pages|book/i), econ:f('s7',/economist/i), chess:f('s8',/chess/i), cook:f('s9',/cook/i), dark:f('s10',/no dark/i), room:f('s11',/room/i), insta:f('s12',/insta/i), sleep:f('s13',/in bed|sleep/i), gym:f('s14',/workout|gym/i) }; };
const dayDoneMap = k => H.days[k]||{};
const activeHabitsOn = d => H.habits.filter(h=>!h.archived && activeOn(h,d));
const checksOn = d => { const m=dayDoneMap(dkey(d)); return activeHabitsOn(d).filter(h=>m[h.id]).length; };
const perfectOn = d => { const hs=activeHabitsOn(d), m=dayDoneMap(dkey(d)); return hs.length>0 && hs.every(h=>m[h.id]); };
function seeded(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
function pick(pool, n, key){ const r=seeded(key), a=pool.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.slice(0,n); }

/* daily quests: progress is read straight from that day's checklist */
function dailyPool(){
  const R=hRef(), cnt=(d,list)=>{ const m=dayDoneMap(dkey(d)); return list.filter(h=>h&&m[h.id]).length; };
  const subs=(d,h)=>{ if(!h) return 0; const m=dayDoneMap(dkey(d)); return (h.subs||[]).length ? (h.subs.filter((_,i)=>m[SUBK(h.id,i)]).length) : (m[h.id]?1:0); };
  const q=(id,name,desc,xp,need,list,fn)=>({id,name,desc,xp,need, ok:list.every(Boolean), prog:fn});
  return [
    q('morning','Morning Ritual','Up at 8:00, make the bed and stretch',40,3,[R.wake,R.bed,R.stretch],d=>cnt(d,[R.wake,R.bed,R.stretch])),
    q('mind','Mind Forge','Read 30 pages and The Economist',40,2,[R.read,R.econ],d=>cnt(d,[R.read,R.econ])),
    q('chess','Chess Grind','Openings, tactics and a game',35,(R.chess?.subs||[]).length||1,[R.chess],d=>subs(d,R.chess)),
    q('body','Body Forge','Work out and stretch',40,2,[R.gym,R.stretch],d=>cnt(d,[R.gym,R.stretch])),
    q('iron','Iron Discipline','No dark, under 30 min Insta, calm morning screens',50,3,[R.dark,R.insta,R.screen],d=>cnt(d,[R.dark,R.insta,R.screen])),
    q('night','Night Watch','Clean your room and be in bed by 23:00',35,2,[R.room,R.sleep],d=>cnt(d,[R.room,R.sleep])),
    q('fresh','Fresh Start','Every hygiene step',20,(R.hyg?.subs||[]).length||1,[R.hyg],d=>subs(d,R.hyg)),
    q('hearth','Hearth Keeper','Cook a meal',20,1,[R.cook],d=>cnt(d,[R.cook])),
  ].filter(x=>x.ok);
}
function dailyQuests(d){
  const pool=dailyPool(), n=activeHabitsOn(d).length||1, k=dkey(d);
  const big = seeded('big'+k)()<0.3 ? {id:'flawless',name:'Flawless Victory',desc:'Finish every habit today',xp:80,need:n,prog:dd=>checksOn(dd)}
                                    : {id:'ten',name:'Ten Strikes',desc:'Tick off 10 habits today',xp:40,need:Math.min(10,n),prog:dd=>checksOn(dd)};
  return [big, ...pick(pool,2,'d'+k)].map(q=>{ const p=Math.min(q.need,q.prog(d)); return {...q, p, done:p>=q.need}; });
}
/* weekly quests (Mon–Sun) */
function weekStart(d){ const x=atMidnight(d); return addDays(x, -((x.getDay()+6)%7)); }
function weeklyQuests(d){
  const R=hRef(), ws=weekStart(d), today=atMidnight(new Date()), days=[...Array(7)].map((_,i)=>addDays(ws,i)).filter(x=>x<=today);
  const daysWith=h=>h?days.filter(x=>dayDoneMap(dkey(x))[h.id]).length:0;
  const pool=[
    {id:'w-read',name:'Page Turner',desc:'Read 30 pages on 5 days',xp:150,need:5,ok:!!R.read,prog:()=>daysWith(R.read)},
    {id:'w-chess',name:'Grandmaster Week',desc:'Study chess on 5 days',xp:150,need:5,ok:!!R.chess,prog:()=>daysWith(R.chess)},
    {id:'w-gym',name:'Iron Week',desc:'Work out on 4 days',xp:150,need:4,ok:!!R.gym,prog:()=>daysWith(R.gym)},
    {id:'w-perfect',name:'Triple Crown',desc:'3 perfect days this week',xp:200,need:3,ok:true,prog:()=>days.filter(perfectOn).length},
    {id:'w-checks',name:'Seventy Strikes',desc:'70 check-ins this week',xp:150,need:70,ok:true,prog:()=>days.reduce((s,x)=>s+checksOn(x),0)},
    {id:'w-dark',name:'Clean Week',desc:'No dark all 7 days',xp:200,need:7,ok:!!R.dark,prog:()=>daysWith(R.dark)},
    {id:'w-sleep',name:'Well Rested',desc:'In bed by 23:00 on 5 nights',xp:150,need:5,ok:!!R.sleep,prog:()=>daysWith(R.sleep)},
    {id:'w-cook',name:'Chef\'s Week',desc:'Cook on 4 days',xp:120,need:4,ok:!!R.cook,prog:()=>daysWith(R.cook)},
  ].filter(x=>x.ok);
  return pick(pool,3,'w'+dkey(ws)).map(q=>{ const p=Math.min(q.need,q.prog()); return {...q,p,done:p>=q.need}; });
}

/* monthly boss */
function bossFor(monthDate){
  const y=monthDate.getFullYear(), m=monthDate.getMonth(), first=new Date(y,m,1), last=new Date(y,m+1,0), today=atMidnight(new Date());
  const look=BOSSES[m], name=look.name, nHab=Math.max(1,H.habits.filter(h=>!h.archived).length), D=last.getDate();
  const maxHP=Math.max(300, Math.round(nHab*D*XP_CHECK*0.7/50)*50);
  let hp=maxHP, defeatedOn=null, dmgToday=0, heals=0;
  for(let d=first; d<=last && d<=today; d=addDays(d,1)){
    const dmg=checksOn(d)*XP_CHECK + (perfectOn(d)?XP_PERFECT:0);
    if(dkey(d)===dkey(today)) dmgToday=dmg;
    if(!defeatedOn){ hp-=dmg; if(hp<=0){ hp=0; defeatedOn=new Date(d); }
      else if(d<today && (dayRate(d)??1)<0.5){ hp=Math.min(maxHP,hp+BOSS_HEAL); heals++; } }
  }
  return {name,look,maxHP,hp,defeatedOn,dmgToday,heals,daysLeft:Math.max(0,Math.round((last-today)/86400000)), month:first};
}
/* XP & levels over the whole history, with streak bonuses, perfect-day combos and attributes */
const ATTRS = [
  {k:'STR', name:'Strength',   color:'#D2533A', keys:['gym','stretch'],          desc:'Workout, stretching'},
  {k:'INT', name:'Intellect',  color:'#4C7BD9', keys:['read','econ','chess'],    desc:'Reading, The Economist, chess'},
  {k:'DIS', name:'Discipline', color:'#8C5BD1', keys:['dark','screen','insta'],  desc:'No dark, screen limits'},
  {k:'VIT', name:'Vitality',   color:'#2E9E6A', keys:['wake','sleep','hyg','cook'], desc:'Sleep, wake-up, hygiene, cooking'},
  {k:'ORD', name:'Order',      color:'#D99A1E', keys:['bed','room'],             desc:'Bed made, clean room'},
];
const xpFor = l => 50*(l-1)*l;
/* Attributes (also the hero's stats in Expeditions): levels 1-10.
   XP per step 75, 85, 100, 120, 145, 175, 210, 245, 285 -> total 1,440 XP for Lv 10.
   Habit XP is normalised: each attribute earns at most ATTR_DAY XP a day from its habits, split evenly
   across them, so a 2-habit and a 4-habit attribute grow at the same pace. Quests add a little on top
   (+1 to every attribute per daily quest, +3 per weekly quest). A fully consistent attribute reaches
   Lv 10 in ~75-80 days; ~70% consistency lands around Lv 8 by the end of a 3-month campaign.
   Only days since the current Expeditions campaign started count (Ascension resets levels, never habits). */
const ATTR_MAX = 10, ATTR_STEPS = [0, 0, 75, 160, 260, 380, 525, 700, 910, 1155, 1440], ATTR_DAY = 15, ATTR_DQ = 1, ATTR_WQ = 3;              /* total XP needed to reach level l */
const streakBonus = run => Math.min(10, 2*Math.floor((run-1)/7));   /* +2 XP per full week of streak, max +10 */
const comboBonus = c => Math.min(100, XP_PERFECT + 10*(c-1));      /* perfect-day combo: 50, 60, 70 ... max 100 */
function attrOfHabit(){ const R=hRef(), m={}; ATTRS.forEach(a=>a.keys.forEach(k=>{ if(R[k]) m[R[k].id]=a.k; })); return id=>m[id]||'VIT'; }
function gameState(){
  const keys=Object.keys(H.days).sort(), today=atMidnight(new Date()), first=keys.length?new Date(keys[0]+'T00:00'):today;
  const attrOf=attrOfHabit(), run={}, attrXP={STR:0,INT:0,DIS:0,VIT:0,ORD:0};
  const br={habits:0, streak:0, perfect:0, daily:0, weekly:0, boss:0}, perDay={}, log=[];
  let combo=0, bestCombo=0, questsDone=0, activeDays=0, perfectDays=0;
  const weeks=new Set(), months=new Set();
  for(let d=first; d<=today; d=addDays(d,1)){
    const k=dkey(d), m=dayDoneMap(k), isToday=k===dkey(today); let dayXP=0;
    for(const h of H.habits){ if(m[h.id]){ run[h.id]=(run[h.id]||0)+1; } else run[h.id]=0; }
    const inCamp = !window.EXP_CAMP_START || k>=window.EXP_CAMP_START, act=activeHabitsOn(d), per={};
    act.forEach(h=>{ const a=attrOf(h.id); per[a]=(per[a]||0)+1; });
    for(const h of act){ if(!m[h.id]) continue; const sb=streakBonus(run[h.id]), x=XP_CHECK+sb;
      if(inCamp){ const a=attrOf(h.id); attrXP[a]+=ATTR_DAY/per[a]; }
      br.habits+=XP_CHECK; br.streak+=sb; dayXP+=x;
      if(isToday) log.push({t:h.name, xp:x, note:sb?`${run[h.id]}-day streak +${sb}`:''}); }
    if(dayXP) activeDays++;
    if(perfectOn(d)){ combo++; perfectDays++; bestCombo=Math.max(bestCombo,combo); const c=comboBonus(combo); br.perfect+=c; dayXP+=c; if(isToday) log.push({t:'Perfect day', xp:c, note:combo>1?`${combo}-day combo`:'', special:true}); }
    else if(d<today) combo=0;
    dailyQuests(d).forEach(q=>{ if(q.done){ br.daily+=q.xp; dayXP+=q.xp; if(inCamp) for(const a in attrXP) attrXP[a]+=ATTR_DQ; questsDone++; if(isToday) log.push({t:`Quest: ${q.name}`, xp:q.xp, special:true}); } });
    perDay[k]=dayXP; weeks.add(dkey(weekStart(d))); months.add(`${d.getFullYear()}-${d.getMonth()}`);
  }
  weeks.forEach(k=>weeklyQuests(new Date(k+'T00:00')).forEach(q=>{ if(q.done){ br.weekly+=q.xp; if(!window.EXP_CAMP_START || dkey(addDays(new Date(k+'T00:00'),6))>=window.EXP_CAMP_START) for(const a in attrXP) attrXP[a]+=ATTR_WQ; questsDone++; } }));
  let slain=0; months.forEach(k=>{ const [y,mo]=k.split('-').map(Number); const b=bossFor(new Date(y,mo,1)); if(b.defeatedOn){ slain++; br.boss+=XP_BOSS; } });
  const xp=Object.values(br).reduce((s,v)=>s+v,0);
  let lvl=1; while(xp >= xpFor(lvl+1)) lvl++;
  const attrs=ATTRS.map(a=>{ const x=Math.round(attrXP[a.k]), need=l=>ATTR_STEPS[l]; let l=1; while(l<ATTR_MAX && x>=need(l+1)) l++;
    const max=l>=ATTR_MAX; return {...a, xp:x, lvl:l, max, floor:need(l), ceil:max?need(l):need(l+1)}; });
  return {xp, lvl, floor:xpFor(lvl), ceil:xpFor(lvl+1), slain, title:lvlTitle(lvl), rank:rankOf(lvl), br, attrs, perDay, log, combo, bestCombo, questsDone, activeDays, perfectDays, todayXP:perDay[dkey(today)]||0};
}
/* art */


function radar(attrs){
  const cx=110, cy=104, R=78, n=attrs.length, max=ATTR_MAX;
  const pt=(i,f)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [cx+Math.cos(a)*R*f, cy+Math.sin(a)*R*f]; };
  const ring=f=>attrs.map((_,i)=>pt(i,f).map(v=>v.toFixed(1)).join(',')).join(' ');
  const shape=attrs.map((a,i)=>pt(i,Math.max(.06,a.lvl/max)).map(v=>v.toFixed(1)).join(',')).join(' ');
  return `<svg viewBox="0 0 220 210" class="radar" role="img" aria-label="Attributes: ${attrs.map(a=>`${a.name} level ${a.lvl}`).join(', ')}">
    ${[2,4,6,8,10].map(l=>`<polygon points="${ring(l/ATTR_MAX)}" class="rgrid"/>`).join('')}
    ${attrs.map((_,i)=>{ const [x,y]=pt(i,1); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="rgrid"/>`; }).join('')}
    <polygon points="${shape}" class="rshape"/>
    ${attrs.map((a,i)=>{ const [x,y]=pt(i,Math.max(.06,a.lvl/max)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${a.color}" stroke="var(--surface)" stroke-width="2"/>`; }).join('')}
    ${attrs.map((a,i)=>{ const [x,y]=pt(i,1.2); return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" class="rlabel">${a.k} ${a.lvl}${(window.EXP_STARS||{})[a.k]?' '+'★'.repeat(window.EXP_STARS[a.k]):''}</text>`; }).join('')}
  </svg>`;

const BASE = {1:30, 2:20, 3:10}, PER_DAY = 0.5, DAY = 86400000;

/* Deadlines: from 7 days before the due date a to-do gains 3 points per day; once overdue, 5 more per day */
const dueLeft = t => t.due ? Math.round((new Date(t.due+'T00:00') - atMidnight(new Date()))/DAY) : null;
const dueBonus = t => { if(t.done || !t.due) return 0; const d=dueLeft(t); if(d>7) return 0; if(d>=0) return (7-d)*3; return 21 + (-d)*5; };
const score = t => BASE[t.prio] + PER_DAY*ageDays(t) + dueBonus(t);

  const txt = d<0 ? `Overdue by ${-d} ${d===-1?'day':'days'}` : d===0 ? 'Due today' : d===1 ? 'Due tomorrow' : d<=7 ? `Due in ${d} days` : `Due ${dt}`;
  return `<span class="due ${d<0?'late':d<=2?'soon':''}" title="${dt}">${txt}</span>`; }
const level = sc => sc>=30?1:sc>=20?2:3;

/* How many outfits the Fitting Room builder can make, and how many more one new piece adds */
const LEGACY_CAT = {outer:'hoodie', top:'tshirt', bottom:'pants'};
function slotCounts(items){ const c={hat:0,jacket:0,mid:0,top:0,bottom:0,shoes:0,acc:0};
  for(const it of items){ const sec=LEGACY_CAT[it.cat]||it.cat; const s=WSECT.find(x=>x[0]===sec); if(s) c[s[2]]++; } return c; }
function outfitCount(c){ if(!c.top||!c.bottom) return 0; return c.top*c.bottom*(c.hat+1)*(c.jacket+1)*(c.mid+1)*(c.shoes+1)*(c.acc+1); }
function outfitGain(section){ if(!W.closet) return null; const s=WSECT.find(x=>x[0]===section); if(!s) return null;
  const c=slotCounts(W.closet), before=outfitCount(c); c[s[2]]++; return outfitCount(c)-before; }
async function loadCloset(){

      r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('items',{keyPath:'id'}); d.createObjectStore('outfits',{keyPath:'id'}); d.createObjectStore('blobs'); };
      r.onsuccess=()=>{ try{ const q=r.result.transaction('items').objectStore('items').getAll(); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }catch(e){ rej(e); } };
      r.onerror=()=>rej(r.error); });

function thumb(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const i=new Image();
  i.onload=()=>{ const sc=Math.min(1,360/Math.max(i.naturalWidth,i.naturalHeight)); const c=document.createElement('canvas'); c.width=Math.round(i.naturalWidth*sc); c.height=Math.round(i.naturalHeight*sc);
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(i,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',0.8)); };
  i.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('This photo could not be read. Try a JPG or PNG, or a screenshot.')); }; i.src=u; }); }
const domain = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } };

function drawWish(){
  const el=document.getElementById('wish-list'); if(!el) return;
  const open=W.items.filter(i=>!i.bought), bought=W.items.filter(i=>i.bought);
  const sum = a => a.reduce((s,i)=>s+(+i.price||0),0);
  document.querySelector('[data-wview="open"]').textContent=`Wanted · ${open.length}`;
  document.querySelector('[data-wview="bought"]').textContent=`Bought · ${bought.length}`;
  const st=document.getElementById('wish-store');
  if(st) st.textContent = W.mode==='cloud' ? 'Saved to your account, synced across devices.' : W.mode==='local' ? 'Saved in this browser only.' : '';
  if(W.mode==='loading' && !W.items.length){ el.innerHTML='<div class="empty">Loading your wishlist…</div>'; return; }
  const list = W.view==='open' ? open.sort((a,b)=>a.want-b.want || a.created-b.created) : bought.sort((a,b)=>b.boughtAt-a.boughtAt);
  const total = W.view==='open'
    ? `<div class="wtotal"><span class="label">Everything on the list</span><b>${money(sum(open))}</b><span class="label">Must haves</span><b>${money(sum(open.filter(i=>i.want===1)))}</b></div>`
    : (bought.length?`<div class="wtotal"><span class="label">Spent on wishlist items</span><b>${money(sum(bought))}</b></div>`:'');
  if(!list.length){ el.innerHTML = W.view==='open' ? '<div class="empty"><b>Your wishlist is empty</b>Tap "Add to wishlist" to save something you want.</div>' : '<div class="empty">Things you buy show up here.</div>'; return; }
  el.innerHTML = total + `<div class="wgrid">${list.map(i=>{
    const gain = i.type==='clothes' && !i.bought ? outfitGain(i.section) : null;
    const sec = WSECT.find(s=>s[0]===i.section);
    return `<article class="witem ${i.bought?'is-bought':''}">
      <div class="wimg">${i.img?`<img src="${i.img}" alt="${escH(i.title)}">`:svg(i.type==='clothes'?'fitting':'wish')}</div>
      <div class="wbody">
        <div class="wtop"><b>${escH(i.title)}</b>${i.price!=null&&i.price!==''?`<span class="wprice">${money(+i.price)}</span>`:''}</div>
        <div class="sub">${i.want===1?'<span class="must">Must have</span>':'<span>Nice to have</span>'}${sec?`<span>· ${sec[1]}</span>`:''}${i.link&&domain(i.link)?`<a href="${escH(i.link)}" target="_blank" rel="noopener">· ${escH(domain(i.link))} ↗</a>`:''}</div>
        ${gain!=null?`<div class="gain">${gain>0?`+${gain.toLocaleString('de-DE')} new outfits with your closet`:`Add a top and pants in Fitting Room to see how many outfits this adds`}</div>`:''}
        <div class="wact">${i.bought?`<button class="x" data-wunbuy="${i.id}">Move back</button>`:`<button class="wbtn" data-wbuy="${i.id}">Bought it</button>`}<button class="x" data-wdel="${i.id}">Delete</button></div>
      </div></article>`; }).join('')}</div>`;
}

document.addEventListener('change', async e=>{

});
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  const find=id=>W.items.find(x=>x.id===id);
  if(b.dataset.wtype){ W.form.type=b.dataset.wtype; document.querySelectorAll('[data-wtype]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); document.getElementById('w-sect-wrap').hidden = W.form.type!=='clothes'; }
  else if(b.dataset.wwant){ W.form.want=+b.dataset.wwant; document.querySelectorAll('[data-wwant]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); }
  else if(b.dataset.wview){ W.view=b.dataset.wview; document.querySelectorAll('[data-wview]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); drawWish(); }
  else if(b.dataset.wbuy){ const i=find(b.dataset.wbuy); if(i) wUpdate(i,{bought:true,boughtAt:Date.now()}); }

(async()=>{

/* ---------- Calendar ---------- */
const CAL_COLORS = [['blue','var(--c-fit)'],['green','var(--c-hab)'],['orange','var(--c-todo)'],['purple','var(--c-wish)'],['pink','var(--c-shelf)'],['teal','var(--c-cal)']];
const CAL_REPEAT = [['none','Once'],['daily','Every day'],['weekly','Every week'],['monthly','Every month'],['yearly','Every year']];
const C = { events:[], mode:'loading', month:null, sel:null };
let cdb=null; const CKEY='dock-calendar';
const cColor = k => (CAL_COLORS.find(c=>c[0]===k)||CAL_COLORS[0])[1];
const parseD = k => new Date(k+'T00:00');
function cSave(){ try{ localStorage.setItem(CKEY, JSON.stringify(C.events)); }catch(e){} }
async function cPut(ev){ const {id,...doc}=ev;
  if(C.mode==='cloud'){ if(id) await cdb.doc('events/'+id).set(doc); else await cdb.collection('events').doc().set(doc); }
  else { if(id){ const i=C.events.findIndex(x=>x.id===id); C.events[i]={id,...doc}; } else C.events.push({id:uid(),...doc}); cSave(); drawCal(); } }
async function cDel(id){ if(C.mode==='cloud') await cdb.doc('events/'+id).delete(); else { C.events=C.events.filter(x=>x.id!==id); cSave(); drawCal(); } }
function occursOn(ev, d){
  const s=parseD(ev.date); if(d<s) return false; if(ev.until && d>parseD(ev.until)) return false;
  switch(ev.repeat){
    case 'daily': return true;
    case 'weekly': return d.getDay()===s.getDay();
    case 'monthly': return d.getDate()===s.getDate();
    case 'yearly': return d.getDate()===s.getDate() && d.getMonth()===s.getMonth();
    default: return dkey(d)===ev.date;
  }
}
const eventsOn = d => C.events.filter(e=>occursOn(e,d)).sort((a,b)=>(a.allDay?'':a.start||'').localeCompare(b.allDay?'':b.start||'') || a.title.localeCompare(b.title));
const todosOn = k => T.items.filter(t=>t.due===k).sort((a,b)=>(a.done-b.done) || score(b)-score(a));
const timeText = e => e.allDay||!e.start ? 'All day' : e.end ? `${e.start}–${e.end}` : e.start;

function calHTML(){ return `<div class="calhead"><button class="back" data-cnav="-1" aria-label="Previous month">‹</button><b id="cal-title"></b><button class="back" data-cnav="1" aria-label="Next month">›</button><button class="shpill" data-ctoday="1">Today</button></div>
  <div class="calgrid" id="cal-grid"></div>
  <div class="calday"><div class="caldayhead"><div><span class="label" id="cal-dlabel"></span><b id="cal-dtitle"></b></div><div class="acts"><button class="addbtn ghost" data-paddtodo="" id="cal-addtodo">+ To-do</button><button class="addbtn" style="background:var(--c-cal)" data-cadd="1">+ Event</button></div></div><div id="cal-list"></div></div>
  <h3 class="sh">Coming up</h3><div id="cal-next"></div><p class="note" id="cal-store"></p><div id="cal-sheet"></div>`; }
function drawCal(){
  const g=document.getElementById('cal-grid'); if(!g) return;
  const today=atMidnight(new Date()); if(!C.month) C.month=new Date(today.getFullYear(), today.getMonth(), 1); if(!C.sel) C.sel=dkey(today);
  document.getElementById('cal-title').textContent = C.month.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const first=addDays(C.month, -((C.month.getDay()+6)%7)), sel=parseD(C.sel);
  let html=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<span class="cwd">${w}</span>`).join('');
  for(let i=0;i<42;i++){ const d=addDays(first,i), k=dkey(d), evs=eventsOn(d), tds=todosOn(k).filter(t=>!t.done), inM=d.getMonth()===C.month.getMonth(), nAll=evs.length+tds.length;
    if(i===35 && !inM) break;
    html+=`<button class="cday ${inM?'':'out'} ${k===dkey(today)?'today':''} ${k===C.sel?'sel':''}" data-cday="${k}" aria-label="${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}${evs.length?`, ${evs.length} event${evs.length>1?'s':''}`:''}${tds.length?`, ${tds.length} to-do${tds.length>1?'s':''} due`:''}">
      <span class="cnum">${d.getDate()}</span><span class="cev">${[...tds.map(t=>`<i class="tdue"><em>${escH(t.title)}</em></i>`), ...evs.map(e=>`<i style="--ec:${cColor(e.color)}"><em>${escH(e.title)}</em></i>`)].slice(0,3).join('')}${nAll>3?`<small>+${nAll-3}</small>`:''}</span></button>`; }
  g.innerHTML=html;
  document.getElementById('cal-dlabel').textContent = C.sel===dkey(today)?'Today':sel.toLocaleDateString('en-GB',{weekday:'long'});
  document.getElementById('cal-dtitle').textContent = sel.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const card = (e,d)=>`<button class="cevent" data-cedit="${e.id}" style="--ec:${cColor(e.color)}"><span class="ctime">${d?`<b>${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</b>`:''}${timeText(e)}</span><span class="ctitle">${escH(e.title)}${e.repeat&&e.repeat!=='none'?` <small>· ${CAL_REPEAT.find(r=>r[0]===e.repeat)[1].toLowerCase()}</small>`:''}</span>${e.notes?`<span class="cnotes">${escH(e.notes)}</span>`:''}</button>`;
  const tcard = (t,d)=>{ const lv=t.done?t.prio:level(score(t)); return `<div class="cevent ctodo ${t.done?'done':''}" style="--ec:var(--c-todo)"><button class="check" data-check="${t.id}" aria-label="${t.done?'Mark as not done':'Mark as done'}">${t.done?'✓':''}</button><button class="tbody" data-popen="${t.id}" aria-label="Open ${escH(t.title)} in the to-do list"><span class="ctime">${d?`<b>${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</b>`:''}To-do due · ${areaOf(t)==='work'?'Work':'Personal'}</span><span class="ctitle">${escH(t.title)}</span></button><span class="tp">P${lv}</span></div>`; };
  const day=eventsOn(sel), dayT=todosOn(C.sel);
  document.getElementById('cal-list').innerHTML = C.mode==='loading' ? '<p class="note">Loading…</p>' : (day.length||dayT.length) ? dayT.map(t=>tcard(t)).join('')+day.map(e=>card(e)).join('') : '<p class="note" style="margin:4px 0 0">Nothing planned. Add an event or a to-do for this day.</p>';
  const next=[]; for(let i=1;i<=60 && next.length<6;i++){ const d=addDays(sel,i); todosOn(dkey(d)).filter(t=>!t.done).forEach(t=>{ if(next.length<6) next.push(tcard(t,d)); }); eventsOn(d).forEach(e=>{ if(next.length<6) next.push(card(e,d)); }); }
  document.getElementById('cal-next').innerHTML = next.length ? next.join('') : '<p class="note">Nothing in the next 60 days.</p>';
  const at=document.getElementById('cal-addtodo'); if(at) at.dataset.paddtodo=C.sel;
  const st=document.getElementById('cal-store'); if(st) st.textContent = C.mode==='cloud'?'Saved to your account, synced across devices.':C.mode==='local'?'Saved in this browser only.':'';
}
function calSheet(ev){
  const it = ev ? {...ev} : {title:'', date:C.sel, allDay:false, start:'', end:'', repeat:'none', until:'', color:'blue', notes:''};
  const box=document.getElementById('cal-sheet');
  const paint=()=>{ box.innerHTML=`<div class="shscrim" data-cclose="1"><form class="shform" id="calform" autocomplete="off">
    <div class="shhead"><b>${ev?'Edit event':'New event'}</b><button type="button" class="x" data-cclose="1">Close</button></div>
    <input id="c-title" placeholder="What's happening?" maxlength="120" required value="${escH(it.title)}" aria-label="Title">
    <div class="wrow"><label class="cfield"><span class="label">Date</span><input type="date" id="c-date" value="${it.date}" required></label>
      <label class="cfield callday"><input type="checkbox" id="c-allday" ${it.allDay?'checked':''}> All day</label></div>
    <div class="wrow" ${it.allDay?'hidden':''} id="c-times"><label class="cfield"><span class="label">Starts</span><input type="time" id="c-start" value="${it.start||''}"></label><label class="cfield"><span class="label">Ends</span><input type="time" id="c-end" value="${it.end||''}"></label></div>
    <span class="label">Repeat</span><div class="shchips">${CAL_REPEAT.map(([k,l])=>`<button type="button" class="shpill" data-crep="${k}" aria-pressed="${it.repeat===k}">${l}</button>`).join('')}</div>
    ${it.repeat!=='none'?`<label class="cfield"><span class="label">Repeat until (optional)</span><input type="date" id="c-until" value="${it.until||''}"></label>`:''}
    <span class="label">Colour</span><div class="cswatches">${CAL_COLORS.map(([k,v])=>`<button type="button" data-ccol="${k}" aria-pressed="${it.color===k}" aria-label="${k}" style="--ec:${v}"></button>`).join('')}</div>
    <input id="c-notes" placeholder="Notes (optional)" maxlength="300" value="${escH(it.notes||'')}" aria-label="Notes">
    <div class="wrow" style="justify-content:space-between;align-items:center">${ev?`<button type="button" class="x" data-cdel="${ev.id}" style="color:#D64545">${ev.repeat&&ev.repeat!=='none'?'Delete all repeats':'Delete'}</button>`:'<span></span>'}<button class="addbtn" style="background:var(--c-cal)">${ev?'Save':'Add event'}</button></div>
  </form></div>`; };
  const grab=()=>{ const v=id=>document.getElementById(id); it.title=v('c-title').value; it.date=v('c-date').value||it.date; it.allDay=v('c-allday').checked;
    if(v('c-start')){ it.start=v('c-start').value; it.end=v('c-end').value; } if(v('c-until')) it.until=v('c-until').value; it.notes=v('c-notes').value; };
  paint();
  box.onclick=e=>{ const b=e.target.closest('button,[data-cclose]'); if(!b) return;
    if(b.dataset.cclose && (e.target===b||b.tagName==='BUTTON')){ box.innerHTML=''; return; }
    if(b.dataset.crep){ grab(); it.repeat=b.dataset.crep; paint(); }
    else if(b.dataset.ccol){ grab(); it.color=b.dataset.ccol; paint(); }
    else if(b.dataset.cdel){ if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent='Tap again to delete'; return; } cDel(b.dataset.cdel); box.innerHTML=''; } };
  box.onchange=e=>{ if(e.target.id==='c-allday'){ grab(); paint(); } };
  box.onsubmit=async e=>{ e.preventDefault(); grab(); if(!it.title.trim()||!it.date) return;
    const doc={...(ev?{id:ev.id}:{}), title:it.title.trim(), date:it.date, allDay:!!it.allDay, start:it.allDay?'':(it.start||''), end:it.allDay?'':(it.end||''), repeat:it.repeat, until:it.repeat==='none'?'':(it.until||''), color:it.color, notes:(it.notes||'').trim(), created:ev?.created||Date.now()};
    try{ await cPut(doc); box.innerHTML=''; C.sel=doc.date; const d=parseD(doc.date); C.month=new Date(d.getFullYear(),d.getMonth(),1); drawCal(); }catch(err){} };
  setTimeout(()=>document.getElementById('c-title')?.focus(),50);
}
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b || !document.getElementById('cal-grid')) return;
  if(b.dataset.cnav){ C.month=new Date(C.month.getFullYear(), C.month.getMonth()+(+b.dataset.cnav), 1); drawCal(); }
  else if(b.dataset.ctoday){ const t=atMidnight(new Date()); C.month=new Date(t.getFullYear(),t.getMonth(),1); C.sel=dkey(t); drawCal(); }
  else if(b.dataset.cday){ C.sel=b.dataset.cday; const d=parseD(C.sel); if(d.getMonth()!==C.month.getMonth()) C.month=new Date(d.getFullYear(),d.getMonth(),1); drawCal(); }
  else if(b.dataset.cadd){ calSheet(null); }
  else if(b.dataset.cedit){ const ev=C.events.find(x=>x.id===b.dataset.cedit); if(ev) calSheet(ev); }
});
(async()=>{
  try{ const d=await (window.claude?.use?.('db') ?? null);
    if(d){ cdb=d; C.mode='cloud'; cdb.collection('events').onSnapshot(s=>{ C.events=s.docs.map(x=>({id:x.id,...x.data()})); drawCal(); }); return; } }catch(e){}
  C.mode='local'; try{ C.events=JSON.parse(localStorage.getItem(CKEY)||'[]'); }catch(e){ C.events=[]; } drawCal();
})();

/* ---------- Shelf: anime, shows, movies, books, manga ---------- */
const SH_TYPES = [['anime','Anime','watch'],['tv','TV show','watch'],['movie','Movie','watch'],['book','Book','read'],['manga','Manga','read']];
const SH_STATUS = [['active',{watch:'Watching',read:'Reading'}],['done',{watch:'Finished',read:'Finished'}],['plan',{watch:'Plan to watch',read:'Plan to read'}],['dropped',{watch:'Dropped',read:'Dropped'}]];
const SH_SORTS = [['best','Best rated'],['worst','Worst rated'],['recent','Recently updated'],['finished','Recently finished'],['az','A–Z']];
const SHF = { items:[], mode:'loading', type:(()=>{ try{ return localStorage.getItem('dock-shelf-type')||'anime'; }catch(e){ return 'anime'; } })(), status:'all', sort:'best', q:'', edit:null };
let sdb=null; const SKEY='dock-shelf';
const verb = t => (SH_TYPES.find(x=>x[0]===t)||[])[2] || 'watch';
const unitOf = t => t==='book'?'pages':t==='manga'?'chapters':t==='movie'?'':'episodes';
const stLabel = (s,t) => (SH_STATUS.find(x=>x[0]===s)||[,{watch:s,read:s}])[1][verb(t)];
function shSave(){ try{ localStorage.setItem(SKEY, JSON.stringify(SHF.items)); }catch(e){} }
async function shPut(it){ const {id,...doc}=it; doc.updated=Date.now();
  if(SHF.mode==='cloud'){ if(id) await sdb.doc('shelf/'+id).set(doc); else await sdb.collection('shelf').doc().set(doc); }
  else { if(id){ const i=SHF.items.findIndex(x=>x.id===id); SHF.items[i]={id,...doc}; } else SHF.items.push({id:uid(),...doc}); shSave(); drawShelf(); } }
async function shDel(id){ if(SHF.mode==='cloud') await sdb.doc('shelf/'+id).delete(); else { SHF.items=SHF.items.filter(x=>x.id!==id); shSave(); drawShelf(); } }

function shelfHTML(){

/* ---------- starting a run ---------- */
function expStart(n, siteId){

    extra.forEach(x=>list.splice(1+Math.floor(rnd()*(list.length-1)),0,x));

function expRollLoot(rnd, ord, minRare){

/* ---------- playing ---------- */
const expRun = () => EXP.st.run;

const expAuto = c => !c.s || !!c.int || ((c.flag||c.frag) && !c.s);

function expRoll(){

function expApply(){

  if(run.region===4 && /maren/.test(e.id) && st.flags.helped_maren && !st.built.includes('maptable')){ st.built.push('maptable'); res.note='Maren gave you her map. (Map Table built for free.)'; }

  if(w.loot){ const k = w.loot==='rare' ? 1 : w.loot; for(let j=0;j<k;j++){ const m=expRollLoot(rnd, run.lv.ORD, w.loot==='rare'); run.loot.push(m); res.fx.push('+ '+EXP_MATS[m][0]); } }
  if(w.lore){ if(!run.lore.includes(w.lore)) run.lore.push(w.lore); if(!st.lore.includes(w.lore)) st.lore.push(w.lore); res.fx.push('Lore: '+(expR(run.region).lore[w.lore]?.t||'')); }

  if(w.gift){ st.gift=1; res.fx.push('Corwin owes you one'); }

  if(w.skip){ run.skipNext=true; res.fx.push('You can skip the next encounter'); }

function expContinue(){
  const run=expRun();
  if(run.end){ return expFinish(); }
  run.res=null; run.i++;
  if(run.skipNext && run.i<run.list.length){ run.skipNext=false; run.passes++; run.i++; }
  while(run.i<run.list.length && run.list[run.i].kind==='skip'){ run.i++; run.passes++; }
  if(run.i>=run.list.length){ run.end='done'; return expFinish(); }
  run.phase = (!run.fire && run.i===4) ? 'fire' : 'enc';
  if(run.phase==='fire') run.fire=true;
  expSave(); drawHabits(); expTop();
}
function expFinish(){
  const st=EXP.st, run=expRun(), r=expR(run.region), lv=run.lv, rnd=expRng(st.seed+'|end|'+run.date);
  const completed = run.end==='done';
  let loot = run.end==='wake' ? [] : [...run.loot];
  const flawless = completed && run.fails===0 && run.checks>0;
  if(completed && run.omen && run.omen.loot) for(let j=0;j<run.omen.loot;j++) loot.push(expRollLoot(rnd, lv.ORD));
  if(flawless) loot.push(expRollLoot(rnd, lv.ORD, true));
  if(completed && run.finale) loot.push(expRollLoot(rnd, lv.ORD+20, true));
  loot.sort((a,b)=>EXP_RAR[EXP_MATS[b][1]]-EXP_RAR[EXP_MATS[a][1]]);
  const kept=loot.slice(0,run.slots), left=loot.slice(run.slots);
  kept.forEach(m=>st.mats[m]=(st.mats[m]||0)+1);
  let frag=null, won=false;
  if(completed && !run.replay && !run.finale && (st.frag[run.region]||0)<12){ st.frag[run.region]=(st.frag[run.region]||0)+1; frag=st.frag[run.region]; }
  if(completed && run.finale){ st.won[run.region]=true; won=true; st.trophies.push({campaign:st.campaign, region:run.region, date:run.date}); }
  st.days++;
  const site = run.finale ? r.finale.name : (r.sites.find(s=>s.id===run.site)||{}).name;
  const j = expJournal(run, r, site, completed, frag, won, kept);
  st.journal.unshift({d:st.days, date:run.date, region:run.region, x:j});
  if(st.journal.length>200) st.journal.length=200;
  st.recent=[...run.list.map(x=>x.id), ...(st.recent||[])].slice(0,14);
  st.ret={ date:run.date, region:run.region, site, end:run.end, passes:run.passes, checks:run.checks, fails:run.fails, flawless, kept, left, frag, won, lore:run.lore, finale:run.finale, journal:j, day:st.days, replay:run.replay };
  st.last=run.date; st.run=null;
  if(won && run.region===6) st.ascend=true;
  expSave(); EXP.view='return'; drawHabits(); expTop();
  if(won || flawless || frag===12){ try{ confettiBurst(); }catch(e){} }
}
function expJournal(run, r, site, completed, frag, won, kept){
  const nm = EXP.st.name || 'the Wanderer';
  const rnd=expRng(run.date+'|j');
  const open = ['The light was going when you set out', 'You left Last Light as the shadows grew long', 'The beacon was barely a spark behind you when you started', 'You went out into the dusk'][Math.floor(rnd()*4)];
  let mid = run.fails===0 ? 'Nothing the Grey put in your way could hold you.' : run.fails<=2 ? 'It was not an easy road, but you kept your footing.' : 'Every step was paid for.';
  let end;
  if(run.end==='wake') end='You woke at camp with empty hands and the taste of a dream you would rather keep.';
  else if(run.end==='retreat') end='Your supplies ran out and you turned back before the Grey could close behind you.';
  else if(won) end=`${r.guardian} is free. The ${r.shard} burns at Last Light now.`;
  else if(frag) end=`You came home with something the Grey had hidden: ${r.fragments[frag-1].t.toLowerCase()}.`;
  else end='You came home tired, and a little richer.';
  return `${open} — ${site}, ${r.name}. ${mid} ${end}${kept.length?` (${kept.length} ${kept.length>1?'items':'item'} brought back.)`:''}`.replace(/the Wanderer/,nm);
}
function expTrade(m){ const run=expRun(); const idx=run.loot.indexOf(m); if(idx<0||run.traded) return; run.loot.splice(idx,1); run.sup++; run.traded=true; expSave(); drawHabits(); }
function expAscend(){

  st.trophies.push({campaign:st.campaign, ascended:dkey(new Date())});
  st.campaign++; st.campStart=dkey(addDays(new Date(),1)); st.frag={}; st.won={}; st.flags={}; st.fed=0; st.seen=[]; st.entered=[]; st.ascend=false; st.ret=null;

}
function expBuild(k){ const st=EXP.st, b=EXP_BUILD.find(x=>x.k===k); if(!b||st.built.includes(k)) return;
  if(!Object.entries(b.cost).every(([m,n])=>(st.mats[m]||0)>=n)) return;
  Object.entries(b.cost).forEach(([m,n])=>st.mats[m]-=n); st.built.push(k); expSave(); drawHabits(); try{ dockToast(`${b.n} built at Last Light`); }catch(e){} }
function expCraft(){ const st=EXP.st; const commons=['timber','stone']; const have=commons.reduce((s,m)=>s+(st.mats[m]||0),0); if(have<3) return;
  let need=3; commons.sort((a,b)=>(st.mats[b]||0)-(st.mats[a]||0)).forEach(m=>{ const t=Math.min(need, st.mats[m]||0); st.mats[m]-=t; need-=t; });
  const out=Math.random()<.5?'iron':'cloth'; st.mats[out]=(st.mats[out]||0)+1; expSave(); drawHabits(); try{ dockToast(`Crafted 1 ${EXP_MATS[out][0]}`); }catch(e){} }

    ${t.end==='retreat'&&!t.finale?'<p class="xnote">Retreating keeps your loot, but there is no fragment tonight.</p>':''}
    ${t.kept.length?`<span class="label">Brought home</span><div class="xfx">${t.kept.map(m=>`<span class="rar-${EXP_MATS[m][1]}">${EXP_MATS[m][0]}</span>`).join('')}</div>`:''}
    ${t.left.length?`<p class="xnote">Left behind (no free slots): ${t.left.map(m=>EXP_MATS[m][0]).join(', ')}.</p>`:''}
    ${t.lore.length?`<span class="label">Lore found</span>${t.lore.map(id=>`<details class="xlore"><summary>${escH(r.lore[id].t)}</summary><p>${escH(r.lore[id].x)}</p></details>`).join('')}`:''}
    <span class="label">Journal</span><p class="xjour">${escH(t.journal)}</p>
    <button class="addbtn" data-xview="camp">Back to camp</button></div>`;
}
function expMapView(){
  const st=EXP.st, lv=expLevels(), cur=expCur();
  return `<h3 class="sh">The world</h3><div class="xmap">${[1,2,3,4,5,6].map(n=>{ const r=expR(n), won=st.won[n], open=n<=cur, isCur=n===cur;
    const gate = r.gate ? `<span class="xgate ${expGateOk(n,lv)?'ok':''}">${expGateText(r.gate)}</span>` : '';
    return `<div class="xmapn ${won?'won':isCur?'cur':'fog'}"><span class="xmapi">${won?'✦':n}</span><div><b>${open?escH(r.name):'???'}</b>
      <small>${won?`Cleared · ${escH(r.shard)} returned`:isCur?`${st.frag[n]||0}/12 fragments${(st.frag[n]||0)>=12?' · finale open':''} · ${escH(r.guardian)}`:open?'':'Lost in the Grey'}</small></div>${!won?gate:''}</div>`; }).join('')}</div>
    <p class="xnote">The Grey recedes from every region you clear.</p>`;
}
function expJournalView(){
  const st=EXP.st, t=EXP.jtab, cur=expCur(), lib=st.built.includes('library');
  let body='';
  if(t==='days') body = st.journal.length ? st.journal.map(j=>`<div class="xjent"><span class="label">Day ${j.d} · ${escH(expR(j.region).name)}</span><p>${escH(j.x)}</p></div>`).join('') : '<div class="empty">No entries yet. Your first expedition writes the first page.</div>';
  else if(t==='frag') body = [1,2,3,4,5,6].filter(n=>n<=cur).map(n=>{ const r=expR(n), f=st.won[n]?12:(st.frag[n]||0);
    return `<div class="xjreg"><b>${escH(r.name)}</b>${r.acts.map((a,ai)=>`<span class="label">Act ${['I','II','III'][ai]} — ${f>ai*4?escH(a):'???'}</span>${[0,1,2,3].map(q=>{ const i=ai*4+q; return i<f?`<details class="xlore"><summary>${i+1}. ${escH(r.fragments[i].t)}</summary><p>${escH(r.fragments[i].x)}</p></details>`:`<div class="xlocked">${i+1}. ???</div>`; }).join('')}`).join('')}</div>`; }).join('');
  else body = !lib ? '<div class="empty">Build the <b>Library</b> to keep and reread the lore you find. Until then, lore is only shown on the night you find it.</div>'
    : [1,2,3,4,5,6].filter(n=>n<=cur).map(n=>{ const r=expR(n), ids=Object.keys(r.lore); return `<div class="xjreg"><b>${escH(r.name)}</b>${ids.map(id=>st.lore.includes(id)?`<details class="xlore"><summary>${escH(r.lore[id].t)}</summary><p>${escH(r.lore[id].x)}</p></details>`:'<div class="xlocked">???</div>').join('')}</div>`; }).join('');
  return `<div class="shrow">${[['days','Days'],['frag','Fragments'],['lore','Library']].map(([k,l])=>`<button class="shpill" data-xjtab="${k}" aria-pressed="${t===k}">${l}</button>`).join('')}</div>${body}`;
}
function expBuildView(){
  const st=EXP.st, mats=Object.entries(EXP_MATS);
  const commons=(st.mats.timber||0)+(st.mats.stone||0);
  return `<div class="xcamp">${expTower(st.won)}<div class="xcamphead"><span class="label">Last Light</span><b>Your camp</b><small>Loot only rebuilds the camp. It never makes you stronger — habits do.</small></div></div>
  <div class="xmats">${mats.map(([k,v])=>`<span class="rar-${v[1]}"><b>${st.mats[k]||0}</b>${v[0]}</span>`).join('')}</div>
  ${st.built.includes('workbench')?`<button class="x" data-xcraft="1" ${commons<3?'disabled':''}>Workbench: 3 Timber/Stone → 1 Iron or Cloth</button>`:''}
  ${st.built.includes('banner')?`<div class="xcolors"><span class="label">Banner colour</span>${EXP_COLORS.map(c=>`<button data-xcolor="${c}" aria-pressed="${st.color===c}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('')}</div>`:''}
  <div class="xbuild">${EXP_BUILD.map(b=>{ const has=st.built.includes(b.k), can=!has&&Object.entries(b.cost).every(([m,n])=>(st.mats[m]||0)>=n);
    return `<div class="xbitem ${has?'has':''}"><div><b>${b.n}</b><small>${b.d}</small><span class="xcost">${has?'Built':Object.entries(b.cost).map(([m,n])=>`${n} ${EXP_MATS[m][0]}`).join(' · ')}</span></div>${has?'<span class="xbuilt">✓</span>':`<button class="addbtn sm" data-xbuild="${b.k}" ${can?'':'disabled'}>Build</button>`}</div>`; }).join('')}</div>
  ${st.built.includes('trophy')?`<h3 class="sh">Trophy Hall</h3><div class="xjreg">${Object.keys(st.won).length?Object.keys(st.won).map(n=>`<div>✦ ${escH(expR(n).shard)} — ${escH(expR(n).guardian)} freed</div>`).join(''):'<p class="xnote">No shards yet.</p>'}${Object.entries(st.stars).filter(([,v])=>v).map(([k,v])=>`<div>${'★'.repeat(v)} ${k}</div>`).join('')}${st.trophies.filter(t=>t.ascended).map(t=>`<div>Campaign ${t.campaign} — ascended ${t.ascended}</div>`).join('')}</div>`:''}`;
}
function expRulesView(){ return `<div class="xrules">
  <h3 class="sh">The basics</h3><ul><li>You get <b>one expedition per day</b>, playable <b>17:00–22:00</b>. If you start before 22:00, you can finish after.</li><li>A run takes <b>~10–15 minutes</b>. Missed days don't stack.</li><li>Your hero's power comes from your <b>habit attributes</b>. Habits are the only way to get stronger.</li></ul>
  <h3 class="sh">Your five stats</h3><table><tr><th>Stat</th><th>Used for</th><th>Passive</th></tr>
  <tr><td>${expChip('STR')}</td><td>fights, climbing, forcing doors</td><td>Loot slots = 2 + half your STR level</td></tr>
  <tr><td>${expChip('INT')}</td><td>ruins, puzzles, maps</td><td>Unlocks hidden choices and extra lore</td></tr>
  <tr><td>${expChip('DIS')}</td><td>resisting traps & temptations, endurance</td><td>1 reroll per 3 DIS levels</td></tr>
  <tr><td>${expChip('VIT')}</td><td>storms, cold, long marches</td><td>Supplies = 4 + half your VIT level</td></tr>
  <tr><td>${expChip('ORD')}</td><td>camp, navigation, planning</td><td>Bonus-supply chance (5% per level), better loot</td></tr></table>
  <p>Levels go from <b>1 to 10</b>.</p>
  <h3 class="sh">Tonight's boost</h3><ul><li><b>+1</b> if you completed at least one of its habits</li><li><b>+2</b> if you completed all of them</li></ul>
  <h3 class="sh">How a run works</h3><ol><li><b>Camp:</b> check your stats and boost, then pick 1 of 3 expedition sites. Each site shows which stats it tests most.</li><li><b>Journey:</b> 7 encounters. Each gives 2–3 choices, and each choice uses one stat. Halfway through, you stop at a <b>campfire</b>: read your finds and trade 1 loot item for 1 supply if you need it.</li><li><b>Return:</b> collect loot, read your journal entry and, if you finished the run, gain a <b>fragment</b>.</li></ol>
  <h3 class="sh">Rolling</h3><p><b>d20 + (stat level × 2) + tonight's boost vs the difficulty</b></p><ul><li>Natural <b>20</b> always succeeds and natural <b>1</b> always fails.</li><li>A failed check costs <b>1 supply</b>, or <b>2</b> on a hard check.</li><li>If your supplies run out, you head home early. You keep your loot but get no fragment.</li><li><b>Rerolls</b> (from Discipline) let you re-roll a failed check.</li></ul>
  <h3 class="sh">Progress</h3><ul><li>Each region holds <b>12 fragments</b>. Collect them all to unlock the region's <b>finale</b>: a harder run with 9 encounters.</li><li>If you lose a finale, try again the next evening.</li><li>Some regions need a minimum stat level to enter. The map shows what's needed. While you're locked out, you can still replay earlier regions for loot and lore, but they won't give fragments.</li></ul>
  <h3 class="sh">Loot & camp</h3><ul><li>Loot rebuilds <b>Last Light</b>, your watchtower camp. It's cosmetic and convenience only and never makes you stronger.</li><li>A <b>Flawless</b> run (all checks passed) guarantees a rare item.</li><li>Each site has a condition every night: <b>Calm</b> (checks 1 easier), <b>Rich</b> (+1 loot) or <b>Wild</b> (checks 1 harder, +2 loot).</li></ul>
  <h3 class="sh">Campaigns & Ascension</h3><ul><li>A campaign lasts about <b>3 months</b>.</li><li>When it ends, you <b>Ascend</b>: game levels reset to 1, and every stat that reached Lv 10 earns a permanent ★.</li><li>A new campaign then begins.</li><li>Your habit history is never affected.</li></ul></div>`; }
function expAscendView(){ const lv=expLevels(); const stars=EXP_STATS.filter(k=>lv[k]>=10);
  return `<div class="xenc xfin xret"><span class="label">Campaign ${EXP.st.campaign} complete</span><b class="xenct">Ascension</b>
    <p>The beacon at Last Light burns over the whole kingdom now. Your story here is told.</p>
    <p>When you ascend, your attribute levels in the game start again from 1 — your habit history stays exactly as it is.</p>
    ${stars.length?`<p>Stats at level 10 earn a permanent star: <b>${stars.map(k=>k+' ★').join(', ')}</b></p>`:'<p class="xnote">No stat reached level 10 this time — no stars, but the trophy is yours.</p>'}
    <button class="addbtn" data-xascend="1">Ascend</button></div>`; }
function expCard(){
  if(!EXP.st) return '';
  const st=EXP.st, day=dkey(new Date()), w=expWindow(), cur=expCur();
  const line = st.ascend ? 'Your campaign is complete. Ascension awaits.' : st.run ? 'An expedition is under way. Pick up where you left off.' : st.last===day ? 'Back home for tonight. Next expedition tomorrow at 17:00.' : w.open ? `The road is open until 22:00 · ${escH(expR(cur).name)} ${st.frag[cur]||0}/12` : 'Opens tonight at 17:00.';
  return `<button class="xentry ${w.open&&st.last!==day||st.run?'live':''}" data-xopen="1">${expTower(st.won,true)}<span><span class="label">Expeditions</span><b>Last Light</b><small>${line}</small></span><span class="go" aria-hidden="true">→</span></button>`;
}
function expAnimate(){
  drawHabits();
  const d=document.querySelector('.xd20'); if(!d) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ d.textContent=d.dataset.final; return; }
  EXP.anim=true; const fin=d.dataset.final; let k=0; d.closest('.xroll').classList.add('spin');
  const wrap=document.querySelector('.xoutwrap'); if(wrap) wrap.hidden=true;
  const t=setInterval(()=>{ d.textContent=1+Math.floor(Math.random()*20); if(++k>=12){ clearInterval(t); d.textContent=fin; EXP.anim=false; d.closest('.xroll').classList.remove('spin'); const w2=document.querySelector('.xoutwrap'); if(w2) w2.hidden=false; } },55);
}
setInterval(()=>{ document.querySelectorAll('[data-xcount]').forEach(el=>{ const ms=+el.dataset.xcount-Date.now(); if(ms<=0){ drawHabits(); return; } const h=Math.floor(ms/36e5), m=Math.floor(ms%36e5/6e4), s=Math.floor(ms%6e4/1e3); el.textContent=`Opens in ${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`; }); }, 1000);
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b || !document.querySelector('.exp, .xentry')) return;
  const d=b.dataset;
  if(d.xopen){ H.tab='exp'; EXP.view=EXP.st?.run?'run':'camp'; drawHabits(); window.scrollTo(0,0); return; }
  if(EXP.anim) return;
  if(d.xview){ EXP.view=d.xview; drawHabits(); expTop(); }
  else if(d.xgo){ const [n,s]=d.xgo.split('|'); expStart(+n,s); }
  else if(d.xregion){ EXP.pickRegion=+d.xregion; drawHabits(); }
  else if(d.xphase){ EXP.st.run.phase=d.xphase; expSave(); drawHabits(); expTop(); }
  else if(d.xchoose!=null){ expChoose(+d.xchoose); }
  else if(d.xreroll){ expReroll(); }
  else if(d.xaccept){ const run=expRun(); run.rer=run.rer; expApply(); }
  else if(d.xnext){ expContinue(); }
  else if(d.xtrade){ expTrade(d.xtrade); }
  else if(d.xjtab){ EXP.jtab=d.xjtab; drawHabits(); }
  else if(d.xbuild){ expBuild(d.xbuild); }
  else if(d.xcraft){ expCraft(); }
  else if(d.xcolor){ EXP.st.color=d.xcolor; expSave(); drawHabits(); }
  else if(d.xascend){ expAscend(); }
  else if(d.xrename){ EXP.nameEdit=true; drawHabits(); document.getElementById('xname-in')?.focus(); }
});
document.addEventListener('submit', e=>{ if(e.target.id!=='xname') return; e.preventDefault(); EXP.st.name=document.getElementById('xname-in').value.trim().slice(0,24); EXP.nameEdit=false; expSave(); drawHabits(); });
(async()=>{
  const fromLocal=()=>{ try{ return JSON.parse(localStorage.getItem(EXP_KEY)||'null'); }catch(e){ return null; } };
  const ready=st=>{ EXP.st=Object.assign(expNew(), st||{}); EXP.mode=edb?'cloud':'local'; window.EXP_CAMP_START=EXP.st.campStart||null; window.EXP_STARS=EXP.st.stars||{}; if(!st) expSave(); drawHabits(); };
  try{ const d=await (window.claude?.use?.('db') ?? null);
    if(d){ edb=d; let first=true;
      d.doc('game/expeditions').onSnapshot(sn=>{ const data=sn.exists?sn.data():null; let st=null; try{ st=data&&data.json?JSON.parse(data.json):null; }catch(e){}
        if(first){ first=false; ready(st||fromLocal()); return; }
        if(st && !EXP.anim && !(EXP.saving && Date.now()-EXP.saving<4000)){ EXP.st=Object.assign(expNew(),st); window.EXP_CAMP_START=EXP.st.campStart||null; window.EXP_STARS=EXP.st.stars||{}; drawHabits(); } }, ()=>{ if(first){ first=false; ready(fromLocal()); } });
      return; } }catch(e){}
  ready(fromLocal());
})();

/*EXP-ENGINE-END*/
/* ---------- Navigation: in-page state, no page loads ---------- */
const fitHost = document.getElementById('fit-host');
let fitMounted = false;
function showFitting(){
  if(!fitMounted){
    const sr = fitHost.attachShadow({mode:'open'});
    sr.innerHTML = `<style>${window.FITTING_CSS}</style>${window.FITTING_HTML}`;
    window.mountFitting(sr); fitMounted = true;
  }
  document.getElementById('ask')?.remove();
  root.hidden = true; fitHost.hidden = false; document.title = 'Fitting Room · App Dock';
}
function go(key){
  document.body.dataset.app = key==='habits' ? 'habits' : '';
  if(key==='fitting'){ showFitting(); }
  else {
    fitHost.hidden = true; root.hidden = false;
    if(key==='todo' || key==='cal'){ P.tab = key==='cal'?'cal':'list'; key='plan'; }
    if(key==='habits' || key==='plan' || key==='wish' || key==='shelf') screen(key); else home();
  }
  window.scrollTo(0,0);
}
document.addEventListener('click', e=>{ const b=e.target.closest('[data-go]'); if(b){ e.preventDefault(); go(b.dataset.go); } });
fitHost.addEventListener('dock-home', ()=>go('home'));
const syncTheme = () => { const t=document.documentElement.getAttribute('data-theme'); if(t) fitHost.setAttribute('data-theme',t); else fitHost.removeAttribute('data-theme'); };
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']}); syncTheme();
go(location.hash.replace('#','') || 'home');
})();
</script>
