<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>App Dock</title>
<meta name="description" content="Bantiflok's App Dock: habits, planner, fitting room, wishlist and shelf.">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1216" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="App Dock">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}body{background:#ECEEF1;-webkit-text-size-adjust:100%}@media (prefers-color-scheme:dark){body{background:#0F1216}}</style>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="dock-firebase.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column, phone first. Home = app grid; each app is its own screen reached by #fitting / #habits / #todo. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --sunk:#E2E5EA; --ink:#15181D; --muted:#5C6471; --line:#D3D8DF;
  --accent:#2C4FB8; --accent-ink:#FFFFFF;
  --c-fit:#2C4FB8; --c-hab:#C9741A; --c-todo:#C2552E; --c-wish:#7A4CC2; --c-shelf:#B3366B; --c-cal:#1E7A8A;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#191D23; --sunk:#13171C; --ink:#E7EAEF; --muted:#959EAB; --line:#2A3039;
  --accent:#88A3FF; --accent-ink:#0D1530; --c-fit:#88A3FF; --c-hab:#F0A35E; --c-todo:#FF9A72; --c-wish:#C2A4F5; --c-shelf:#F28BB5; --c-cal:#6CC9D8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#191D23; --sunk:#13171C; --ink:#E7EAEF; --muted:#959EAB; --line:#2A3039;
  --accent:#88A3FF; --accent-ink:#0D1530; --c-fit:#88A3FF; --c-hab:#F0A35E; --c-todo:#FF9A72; --c-wish:#C2A4F5; --c-shelf:#F28BB5; --c-cal:#6CC9D8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
.label{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 23px/1.15 var(--display);letter-spacing:-.01em;margin:6px 0 0;text-wrap:balance}
h2{font:700 19px/1.15 var(--display);margin:0}

/* Home */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
.tile{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--surface);border-radius:var(--r);text-decoration:none;border:1px solid transparent;min-height:168px;transition:transform .15s ease,border-color .15s ease}
.tile:hover{transform:translateY(-2px);border-color:var(--line)}
.tile .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--surface);background:var(--tc)}
.tile .ic svg{width:26px;height:26px}
.tile b{font:700 15px var(--display);display:block}
.tile p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tile .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tile .go{font-size:18px;color:var(--muted)}
@media (max-width:380px){.grid{grid-template-columns:1fr}}

.homehead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.arrange{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;flex:none}
.arrange.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dockfoot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.dockfoot button{border:0;background:none;padding:4px 0;font:600 13px var(--body);color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.dockfoot button:hover{color:var(--ink)}
.dockfoot button.armed{color:#D64545}
.dockfoot .note{flex-basis:100%;margin:0}
.grid.arranging .tile{cursor:grab;touch-action:none;user-select:none;border:1px dashed var(--line);animation:wob .5s ease-in-out infinite alternate}
.grid.arranging .tile:hover{transform:none}
.grid.arranging .tile.dragging{cursor:grabbing;opacity:.75;animation:none;border-style:solid;border-color:var(--ink);box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.grid.arranging .tile:nth-child(even){animation-delay:-.25s}
@keyframes wob{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.movers{justify-content:space-between}
.mv{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:34px;height:30px;font-size:14px;color:var(--ink)}
.grip{color:var(--muted);font-size:16px}
@media (prefers-reduced-motion: reduce){.grid.arranging .tile{animation:none}}
/* App screens */
.top{display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;text-decoration:none}
.screen-head{display:flex;align-items:center;gap:12px;margin-top:18px}
.screen-head .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--surface);background:var(--tc);flex:none}
.screen-head .ic svg{width:22px;height:22px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:18px}
.day{background:var(--surface);border-radius:12px;padding:8px 0;text-align:center;display:flex;flex-direction:column;gap:2px}
.day span{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day b{font:700 16px var(--display);font-variant-numeric:tabular-nums}
.day.today{background:var(--tc);color:var(--surface)}
.day.today span{color:var(--surface);opacity:.8}
.empty{margin-top:14px;background:var(--surface);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.examples{display:flex;flex-direction:column;gap:6px;margin-top:16px;align-items:center}
.examples span{font-size:13px;background:var(--sunk);border-radius:10px;padding:6px 10px;color:var(--ink);max-width:100%}
.cols{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}
.cols .pill.on{background:var(--tc);color:var(--surface)}

/* To-do */
.add{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.add input{flex:1 1 200px;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 11px;font:700 12px var(--mono);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.addbtn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--c-todo);color:var(--surface)}
.tabs{display:flex;gap:6px;margin-top:18px}
.tabs button{border:0;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--c-todo);color:var(--surface)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 12px 12px 10px;position:relative;overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lv)}
.task[data-lv="1"]{--lv:#D64545}.task[data-lv="2"]{--lv:#E09A2B}.task[data-lv="3"]{--lv:#8C96A3}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;margin-left:4px;padding:0}
.check:hover{border-color:var(--c-todo)}
.task.done .check{background:var(--c-todo);border-color:var(--c-todo);color:var(--surface)}
.task .t{min-width:0}
.task .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.ttl{display:block;width:100%;text-align:left;border:0;background:none;padding:0;font:600 14px/1.4 var(--body);color:var(--ink);overflow-wrap:anywhere;cursor:text}
.ttl:hover{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.tedit{display:flex;flex-direction:column;gap:6px}
.tedit input{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--c-todo);background:var(--bg);color:var(--ink);font:600 14px var(--body)}
.tedit-act{display:flex;gap:8px;align-items:center}
.addbtn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.task.done .t b{text-decoration:line-through;color:var(--muted)}
.task .sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
.up{font:500 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#D64545}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{border:0;font:700 12px var(--mono);padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--lv) 18%,transparent);color:var(--ink)}
.score{font:500 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 4px}
.x[data-armed]{color:#D64545;font-weight:700}
details.how{margin-top:18px;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted)}
details.how summary{cursor:pointer;font-weight:700;color:var(--ink)}
details.how table{border-collapse:collapse;margin-top:8px;width:100%;font-variant-numeric:tabular-nums}
details.how td,details.how th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.note{font-size:12px;color:var(--muted);margin-top:8px}

/* Habits */
.htabs{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;margin-top:16px;width:max-content;max-width:100%}
.htabs button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.htabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
[data-app="habits"] .week{margin-top:16px}
button.day{border:0;font:inherit;color:inherit;cursor:pointer;position:relative;padding-bottom:12px}
button.day:disabled{opacity:.4;cursor:default}
button.day.today{background:var(--surface);color:var(--ink)}
button.day.today span{color:var(--c-hab);opacity:1}
button.day.sel{outline:2px solid var(--c-hab);outline-offset:-2px}
button.day i{position:absolute;left:25%;right:25%;bottom:5px;height:3px;border-radius:2px;background:var(--sunk);overflow:hidden}
button.day i::after{content:"";position:absolute;inset:0;width:calc(var(--p)*100%);background:var(--c-hab);border-radius:2px}
.hsum{display:flex;align-items:center;gap:14px;margin-top:14px}
.hsum b{display:block;font:700 18px var(--display)}
.ring-bg{fill:none;stroke:var(--sunk);stroke-width:7}
.ring{fill:none;stroke:var(--c-hab);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .3s}
.hlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.hrow{background:var(--surface);border-radius:14px;padding:4px 8px 4px 4px}
.hmain{display:flex;align-items:center;gap:8px}
.hcheck .box small{font:700 9px var(--mono);color:var(--c-hab)}
.hedit{display:flex;flex-direction:column;gap:8px;padding:6px 6px 12px 48px}
.hedit input{width:100%;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px var(--body)}
.he-field{display:flex;flex-direction:column;gap:6px}
.he-step{display:flex;gap:6px;align-items:center}
.he-add{align-self:flex-start;color:var(--c-hab)}
.he-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.subs{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px 10px 48px}
.subs .sub{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.subs .sub.on{background:color-mix(in srgb,var(--c-hab) 16%,transparent);border-color:transparent;color:var(--ink)}
.hcheck{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px;text-align:left;font:inherit;color:inherit}
.hcheck .box{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700}
.hrow.on .box{background:var(--c-hab);border-color:var(--c-hab);color:var(--surface)}
.hname{font-weight:600;overflow-wrap:anywhere}
.hrow.on .hname{color:var(--muted)}
.streak{font:500 11px var(--mono);color:var(--c-hab);white-space:nowrap}
.streaks{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap;font:500 10px var(--mono);color:var(--muted)}
.st-now{display:inline-flex;align-items:center;gap:3px;color:var(--c-hab);padding:2px 7px 2px 5px;border-radius:999px}
.st-now svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}
.st-now.rec{background:color-mix(in srgb,var(--c-hab) 16%,transparent)}
.st-now.rec svg{fill:currentColor}
.st-now b{font:700 14px/1 var(--display);font-variant-numeric:tabular-nums}
.st-now.zero{color:var(--muted);opacity:.7}
.st-best{font:500 10px var(--mono);color:var(--muted);padding-right:7px}
.pseg{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.pseg button{border:0;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pseg button[aria-pressed="true"]{background:var(--c-hab);color:var(--surface)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.pnav .back{width:36px;height:36px;padding:0;font-size:18px}
.pnav .back:disabled{opacity:.35}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
.kpis div{background:var(--surface);border-radius:14px;padding:12px}
.kpis b{display:block;font:700 24px var(--display);font-variant-numeric:tabular-nums;margin-top:6px}
.kpis small{font-size:12px;color:var(--muted)}
.chart{position:relative;background:var(--surface);border-radius:14px;padding:12px 12px 8px;margin-top:8px}
.bars{display:block;width:100%;height:170px}
.bars .grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.bars .bar{fill:var(--c-hab)}
.bars .bar.is-today{fill:color-mix(in srgb,var(--c-hab) 70%,var(--ink))}
.bars .nodata{fill:var(--line)}
.yax{position:absolute;left:12px;top:12px;height:148px;display:flex;flex-direction:column;justify-content:space-between;font:500 10px var(--mono);color:var(--muted);pointer-events:none}
.yax span{transform:translateY(-50%)}
.yax span:first-child{transform:translateY(-10%)}
.xax{display:grid;font:500 10px var(--mono);color:var(--muted);text-align:center;margin-top:4px}
.hits{position:absolute;top:12px;right:12px;height:150px;display:grid}
.hits span{outline-offset:-2px}
.tip{position:absolute;top:-6px;width:150px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 8px;border-radius:8px;text-align:center;pointer-events:none}
.sh{font:700 14px var(--display);margin:20px 0 8px}
.phlist{display:flex;flex-direction:column;gap:8px}
.ph{background:var(--surface);border-radius:14px;padding:12px}
.phtop{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.phtop b{font-variant-numeric:tabular-nums}
.ph small{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:4px;background:var(--sunk);margin:8px 0 6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c-hab);border-radius:4px}
.meter.big{height:10px}
.glist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.goal{background:var(--surface);border-radius:14px;padding:14px}
.gtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.gtop b{display:block;font-size:16px;margin-top:4px;overflow-wrap:anywhere}
.gs{font:500 11px var(--mono);white-space:nowrap;color:var(--muted);padding:4px 8px;border-radius:999px;background:var(--sunk)}
.gs.ok{color:var(--surface);background:var(--c-hab)}
.gs.miss{color:#D64545}
.gspeed{margin:8px 0 0;font:600 12.5px var(--mono);color:var(--c-hab)}
.garch{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.garch input,.gfbody input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 10px;font:500 14px var(--body)}
.gfolders{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gfold{background:var(--surface);border-radius:14px;overflow:hidden}
.gfhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;width:100%;border:0;background:none;padding:13px 14px;text-align:left;color:var(--ink);font:inherit}
.gfhead b{font:700 15px var(--display)}
.gfhead small{font:500 11.5px var(--mono);color:var(--muted);margin-left:auto}
.gficon{color:var(--c-hab);width:12px}
.gfbody{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px}
.gfbody>.x{align-self:flex-start}
.garow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.garow>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.garow b{font-size:14.5px;overflow-wrap:anywhere}
.garow small{font-size:12px;color:var(--muted)}
.gaok{font:600 12px var(--mono);color:var(--c-hab)}
.garange{font:500 12px var(--mono)!important;color:var(--muted)}
.garange b{color:var(--ink);font-weight:700;font-size:12.5px}
.gamiss{font:600 12px var(--mono);color:#D64545}
.gnums{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:10px}
.gnums b{font:700 26px var(--display);font-variant-numeric:tabular-nums}
.gnums small{flex-basis:100%;font-size:12px;color:var(--muted)}
.spark{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
.stext{font:500 11px var(--mono);fill:var(--muted)}
.dline{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.sdot.carry{fill:var(--surface);stroke:var(--c-hab);stroke-width:2}
.shit{fill:transparent}
.sday:hover .sdot{stroke:var(--ink)}
.sline{fill:none;stroke:var(--c-hab);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.sdot{fill:var(--c-hab);stroke:var(--surface);stroke-width:2}
.tline{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1;vector-effect:non-scaling-stroke}
.gact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.gupd{display:flex;gap:6px}
.gupd input{width:110px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.gform{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:var(--r);padding:14px;margin-top:10px}
.gform input{width:100%;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.gform .wrow>input{flex:1 1 90px}
.gform .seg button[aria-pressed="true"]{color:var(--c-hab)}
.sugg{border:1px dashed var(--c-hab);background:none;color:var(--c-hab);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}

/* Calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-top:16px}
.calhead b{flex:1;text-align:center;font:700 17px var(--display)}
.calhead .back{width:36px;height:36px;padding:0;font-size:18px}
.calhead .shpill[aria-pressed]{background:none}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.cwd{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cday{min-width:0;aspect-ratio:1/1.05;border:0;border-radius:10px;background:var(--surface);padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;color:var(--ink);cursor:pointer;overflow:hidden}
.cday.out{background:transparent;color:var(--muted)}
.cnum{font:600 13px var(--body);font-variant-numeric:tabular-nums;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cday.today .cnum{background:var(--c-cal);color:var(--surface)}
.cday.sel{outline:2px solid var(--c-cal);outline-offset:-2px}
.cev{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;width:100%}
.cev i{width:6px;height:6px;border-radius:50%;background:var(--ec)}
.cev i em{display:none}
.cev small{font:500 9px var(--mono);color:var(--muted)}
@media (min-width:560px){
  .cday{align-items:stretch;aspect-ratio:auto;min-height:84px}
  .cnum{align-self:flex-end}
  .cev{flex-direction:column;gap:2px}
  .cev i{width:auto;height:auto;border-radius:4px;background:color-mix(in srgb,var(--ec) 20%,transparent);border-left:3px solid var(--ec);padding:1px 4px;text-align:left}
  .cev i em{display:block;font:600 10px/1.3 var(--body);font-style:normal;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
.calday{background:var(--surface);border-radius:14px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.caldayhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.caldayhead b{display:block;font:700 16px var(--display);margin-top:4px}
.caldayhead .addbtn{padding:8px 14px;font-size:13px}
.cevent{width:100%;text-align:left;border:0;background:var(--bg);border-radius:10px;padding:10px 12px;border-left:4px solid var(--ec);display:flex;flex-direction:column;gap:2px;font:inherit;color:var(--ink);cursor:pointer;margin-bottom:6px}
#cal-next .cevent{background:var(--surface)}
.ctime{font:500 11px var(--mono);color:var(--muted);display:flex;gap:6px}
.ctime b{color:var(--ink);font-weight:600}
.ctitle{font-weight:600;overflow-wrap:anywhere}
.ctitle small{font-weight:500;color:var(--muted)}
.cnotes{font-size:12px;color:var(--muted)}
.pviews{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:16px;border-bottom:1px solid var(--line)}
.pviews button{border:0;background:none;padding:10px 6px 11px;font:700 15px var(--body);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;border-bottom:3px solid transparent;margin-bottom:-1px}
.pviews button svg{width:18px;height:18px}
.pviews button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c-todo)}
.pviews button[data-ptab="cal"][aria-selected="true"]{border-bottom-color:var(--c-cal)}
.pviews button small{font:500 11px var(--mono);color:var(--muted)}
.cev i.tdue{border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--c-todo)}
@media (min-width:480px){.cev i.tdue{box-shadow:none;background:color-mix(in srgb,var(--c-todo) 12%,transparent);border-left:3px solid var(--c-todo)}}
.ctodo{flex-direction:row;align-items:center;gap:10px;cursor:default}
.ctodo .check{flex:none;margin:0}
.ctodo.done .check{background:var(--c-todo);border-color:var(--c-todo);color:var(--surface)}
.ctodo.done .ctitle{text-decoration:line-through;color:var(--muted)}
.ctodo .tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ctodo .tp{font:700 11px var(--mono);color:var(--c-todo);flex:none}
.caldayhead .acts{display:flex;gap:6px}
.addbtn.ghost{background:none!important;color:var(--c-todo);box-shadow:inset 0 0 0 1.5px var(--c-todo)}
.add.prefill{animation:pflash 1.2s ease-out}
@keyframes pflash{0%{box-shadow:0 0 0 3px var(--c-todo)}100%{box-shadow:0 0 0 0 transparent}}
.cfield{display:flex;flex-direction:column;gap:6px;flex:1 1 140px}
.callday{flex-direction:row;align-items:center;gap:8px;font-weight:600;font-size:13px;flex:0 0 auto;align-self:flex-end;padding-bottom:10px}
.callday input{width:18px!important;height:18px;accent-color:var(--c-cal)}
.cswatches{display:flex;gap:8px}
.cswatches button{width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);background:var(--ec);box-shadow:0 0 0 1px var(--line)}
.cswatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}

/* Shelf */
.shtools{display:flex;gap:8px;margin-top:16px}
.shtools input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.shrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.shrow::-webkit-scrollbar{display:none}
.shpill{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:600;font-size:13px;color:var(--ink)}
.shpill small{font:500 10px var(--mono);color:var(--muted);margin-left:2px}
.shpill[aria-pressed="true"]{background:var(--c-shelf);border-color:var(--c-shelf);color:var(--surface)}
.shpill[aria-pressed="true"] small{color:var(--surface);opacity:.85}
#sh-status .shpill{background:none;font-size:12px;padding:5px 10px}
#sh-status .shpill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
#sh-status .shpill[aria-pressed="true"] small{color:var(--bg)}
.shsort{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.shsort select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body)}
.shlist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.shitem{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:var(--surface);border-radius:14px;padding:12px;font:inherit;color:inherit;cursor:pointer}
.rank{font:700 13px var(--mono);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.shbody{min-width:0;display:flex;flex-direction:column;gap:5px}
.shbody b{font-weight:600;overflow-wrap:anywhere}
.shmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tbadge{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sbadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.sbadge.s-active{background:color-mix(in srgb,var(--c-hab) 18%,transparent)}
.sbadge.s-done{background:color-mix(in srgb,var(--c-fit) 16%,transparent)}
.sbadge.s-dropped{background:color-mix(in srgb,#D64545 15%,transparent)}
.shbody .meter{margin:0;height:4px}
.shbody .meter i{background:var(--c-shelf)}
.shitem .score{font:700 22px var(--display);font-variant-numeric:tabular-nums;color:var(--c-shelf);min-width:44px;text-align:right}
.shitem .score small{font:500 10px var(--mono);color:var(--muted);margin-left:1px}
.shitem .score.none{color:var(--line)}
.shscrim{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.shform{width:100%;max-width:620px;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.shhead{display:flex;justify-content:space-between;align-items:center}
.shhead b{font:700 17px var(--display)}
.shform input{width:100%;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.shform .wrow>input{flex:1 1 120px}
.shchips{display:flex;flex-wrap:wrap;gap:6px}
.rate{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 0;font:700 13px var(--mono);color:var(--muted)}
.rate button.lit{background:color-mix(in srgb,var(--c-shelf) 22%,var(--surface));border-color:transparent;color:var(--ink)}
.rate button[aria-pressed="true"]{background:var(--c-shelf);color:var(--surface)}

/* Wishlist */
.wadd{margin-top:16px}
.wadd summary{list-style:none;display:inline-block;cursor:pointer}
.wadd summary::-webkit-details-marker{display:none}
.wadd[open] summary{margin-bottom:10px}
#wform{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:var(--r);padding:14px}
#wform input:not([type=file]),#wform select{width:100%;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.wrow{display:flex;gap:8px;flex-wrap:wrap}
.wrow>input{flex:1 1 140px}
.wsect{display:flex;flex-direction:column;gap:6px}
.wphoto{position:relative;border:1.5px dashed var(--line);border-radius:12px;padding:12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.wphoto input{position:absolute;inset:0;opacity:0;cursor:pointer}
#wform .seg button[aria-pressed="true"]{color:var(--c-wish)}
.wtotal{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline;background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:12px}
.wtotal b{font:700 16px var(--display);font-variant-numeric:tabular-nums;text-align:right}
.wgrid{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.witem{display:grid;grid-template-columns:84px 1fr;gap:12px;background:var(--surface);border-radius:14px;padding:10px}
.wimg{width:84px;height:84px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;color:var(--c-wish)}
.wimg img{width:100%;height:100%;object-fit:cover}
.wimg svg{width:30px;height:30px}
.wbody{min-width:0;display:flex;flex-direction:column;gap:3px}
.wtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.wtop b{font-weight:600;overflow-wrap:anywhere}
.wprice{font:700 14px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.witem .sub{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.witem .sub a{color:var(--c-wish);text-decoration:none;font-weight:600}
.must{color:var(--c-wish);font-weight:700}
.gain{font:500 11px var(--mono);color:var(--c-hab);margin-top:2px}
.wact{display:flex;gap:6px;margin-top:auto;padding-top:6px;align-items:center}
.wbtn{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px}
.witem.is-bought .wtop b{text-decoration:line-through;color:var(--muted)}

/* Habits: warm theme (applies while the Habits app is open) */
body[data-app="habits"]{--bg:#F6EEE3;--surface:#FFFBF5;--sunk:#EEE2D2;--line:#E3D3BD;--ink:#2A1F16;--muted:#7A6654;--c-hab:#C2621B;background:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-app="habits"]{--bg:#17110C;--surface:#231A13;--sunk:#1C150F;--line:#3A2C20;--ink:#F3E8DA;--muted:#B39C84;--c-hab:#F0A35E}}
:root[data-theme="dark"] body[data-app="habits"]{--bg:#17110C;--surface:#231A13;--sunk:#1C150F;--line:#3A2C20;--ink:#F3E8DA;--muted:#B39C84;--c-hab:#F0A35E}

/* Quest */
.qstrip{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:0;margin-top:14px;padding:10px 14px;border-radius:14px;background:linear-gradient(135deg,#7A3A12,#B85C1E 60%,#D98A2B);color:#FFF4E6;font:inherit;text-align:left;box-shadow:0 4px 14px rgb(122 58 18 / .25)}
.qs-lvl{font:800 15px var(--display);background:rgba(255,255,255,.18);border-radius:10px;padding:6px 9px}
.qs-mid small{display:block;font:600 11px var(--mono);letter-spacing:.04em;opacity:.9;margin-bottom:5px}
.qs-boss{font:700 12px var(--mono);background:rgba(0,0,0,.2);padding:5px 9px;border-radius:999px;white-space:nowrap}
.xpbar{display:block;height:8px;border-radius:6px;background:rgba(0,0,0,.22);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#FFD978,#FFF1C2)}
.hero{display:flex;gap:14px;align-items:center;margin-top:14px;padding:16px;border-radius:18px;color:#FFF4E6;background:radial-gradient(120% 140% at 0% 0%,#D98A2B 0%,#A94E17 55%,#5C2A0E 100%);box-shadow:0 6px 20px rgb(92 42 14 / .3)}
.hero .label{color:#FFE3BD}
.herobody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.herobody b{font:800 26px var(--display);line-height:1}
.herobody small{font-size:12px;opacity:.9}
.bosscard{position:relative;margin-top:12px;padding:14px;border-radius:18px;background:linear-gradient(180deg,#2B1C14,#3F2618);color:#F7E7D4;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.bosscard .label{color:#D9B48C}
.bosshead{display:flex;justify-content:space-between}
.bossstage{position:relative;display:grid;place-items:center;padding:0;border-radius:14px;overflow:hidden}
.badge99{font:800 8.5px var(--body);fill:#fff}
.zzz{font:800 13px var(--display)}
.boss{animation:bob 2.6s ease-in-out infinite}
.boss.dead{animation:none;filter:saturate(.45) brightness(.9)}
@keyframes bob{50%{transform:translateY(-6px)}}
.stamp{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);font:800 26px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#FFD978;border:4px solid #FFD978;border-radius:10px;padding:2px 12px;background:rgba(43,28,20,.6)}
.bossname{font:800 20px var(--display);text-align:center}
.hpbar{position:relative;height:22px;border-radius:12px;background:#1A100A;overflow:hidden;border:1px solid #5A3A26}
.hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#B3261E,#E8573C);border-radius:12px;transition:width .5s}
.bosscard.won .hpbar i{background:#5A3A26}
.hpbar span{position:relative;display:block;text-align:center;font:700 11px/22px var(--mono);color:#FFF4E6}
.bossnote{font-size:12px;color:#D9C2A8;text-align:center}
.bossnote b{color:#FFD978}
.qreset{font:500 11px var(--mono);color:var(--muted);margin-left:6px}
.qlist{display:flex;flex-direction:column;gap:8px}
.quest{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:12px;border:1px solid var(--line)}
.qcheck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--surface)}
.quest.done{background:color-mix(in srgb,var(--c-hab) 9%,var(--surface));border-color:color-mix(in srgb,var(--c-hab) 35%,transparent)}
.quest.done .qcheck{background:var(--c-hab);border-color:var(--c-hab)}
.qbody{min-width:0}
.qbody b{display:block;font-weight:700}
.qbody small{display:block;font-size:12px;color:var(--muted)}
.qbody .meter{margin:6px 0 0}
.qxp{display:flex;flex-direction:column;align-items:flex-end}
.qxp b{font:800 14px var(--display);color:var(--c-hab)}
.qxp small{font:500 11px var(--mono);color:var(--muted)}
.xppop{position:fixed;z-index:62;transform:translate(-50%,0);font:800 14px var(--display);color:#C2621B;text-shadow:0 1px 0 #fff;pointer-events:none;animation:xpup 2.2s ease-out forwards}
@keyframes xpup{0%{transform:translate(-50%,4px) scale(.8);opacity:0}12%{transform:translate(-50%,-10px) scale(1.12);opacity:1}25%{transform:translate(-50%,-14px) scale(1)}70%{transform:translate(-50%,-24px);opacity:1}100%{transform:translate(-50%,-40px);opacity:0}}
@media (prefers-reduced-motion: reduce){.boss{animation:none}.xppop{animation:none}}

.qs-lvl{display:flex;align-items:center;gap:4px;padding:3px 9px 3px 4px!important}
.qs-lvl svg{display:block}
.herochips{display:flex;flex-direction:column;gap:6px;align-self:flex-start}
.herochips span{font:600 11px var(--mono);background:rgba(0,0,0,.2);border-radius:999px;padding:4px 9px;white-space:nowrap;text-align:center}
.herochips b{font:800 13px var(--display);color:#FFE3A8}
.attrs{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
@media (min-width:560px){.attrs{grid-template-columns:220px 1fr;align-items:center}}
.radar{width:100%;max-width:260px;justify-self:center;overflow:visible}
.rgrid{fill:none;stroke:var(--line);stroke-width:1}
.rgrid.minor{stroke-opacity:.45;stroke-width:.7}
.rshape{fill:color-mix(in srgb,var(--c-hab) 28%,transparent);stroke:var(--c-hab);stroke-width:2;stroke-linejoin:round}
.rlabel{font:700 11px var(--mono);fill:var(--ink)}
.attrlist{display:flex;flex-direction:column;gap:10px}
.attr{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:start}
.adot{width:10px;height:10px;border-radius:50%;margin-top:5px;display:inline-block}
.attr b{display:block;font-weight:700;font-size:14px}
.attr b small{font:600 11px var(--mono);color:var(--muted);margin-left:4px}
.attr>div>small{display:block;font-size:12px;color:var(--muted)}
.attr .meter{margin:5px 0 0;height:5px}
.xplog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.xpline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.xpline:last-child{border-bottom:0}
.xpline small{display:block;font:500 11px var(--mono);color:var(--c-hab)}
.xpline b{font:800 14px var(--display);color:var(--c-hab);white-space:nowrap}
.xpline.sp span{font-weight:700}
.xpline.tot{border-top:2px solid var(--line);border-bottom:0;font-weight:700}
.xpline.tot b{font-size:16px}
.xpdays{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:140px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px 8px}
.xpd{height:100%;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.xpd .trk{flex:1;position:relative;width:100%;margin-top:14px}
.xpd i{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:max(2px,var(--h));width:100%;max-width:18px;border-radius:4px 4px 1px 1px;background:color-mix(in srgb,var(--c-hab) 55%,var(--surface))}
.xpd.now i{background:var(--c-hab)}
.xpv{position:absolute;left:50%;bottom:calc(var(--h) + 3px);transform:translateX(-50%);font:600 9px var(--mono);color:var(--muted);white-space:nowrap}
.xpd small{font:600 10px var(--mono);color:var(--muted)}
.xpsrc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.xpsrc .stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:6px;background:var(--sunk)}
.srow{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:6px;font-size:13px}
.srow .adot{margin-top:0}
.srow b{font:700 13px var(--mono);font-variant-numeric:tabular-nums}
.sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* ---------- HEIC (iPhone photo) support: convert to JPG when the browser can't read it ---------- */
let heicLib = null;
function loadHeicLib(){
  if(window.HeicTo) return Promise.resolve();
  if(!heicLib) heicLib = new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/heic-to@1.6.5/dist/iife/heic-to.js'; sc.onload=res; sc.onerror=()=>{ heicLib=null; rej(new Error('Could not load the HEIC converter. Check your connection and try again.')); }; document.head.appendChild(sc); });
  return heicLib;
}
function canDecode(file){
  return new Promise(res=>{ const u=URL.createObjectURL(file); const i=new Image(); i.onload=()=>{URL.revokeObjectURL(u);res(true)}; i.onerror=()=>{URL.revokeObjectURL(u);res(false)}; i.src=u; });
}
async function toReadable(file){
  const isHeic = /hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name||'');
  if(!isHeic || await canDecode(file)) return file;
  await loadHeicLib();
  try{ return await window.HeicTo({blob:file, type:'image/jpeg', quality:0.9}); }
  catch(e){ console.error('HEIC conversion failed', e); throw new Error('This HEIC photo could not be converted. Try exporting it as JPG.'); }
}

/* ---------- image prep ---------- */
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error('load failed: '+src)); document.head.appendChild(sc); }); }
function readImage(file){
  return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const i=new Image(); i.onload=()=>{ URL.revokeObjectURL(u); res(i); }; i.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('This photo format could not be read. Try a JPG, PNG or HEIC.')); }; i.src=u; });
}
/* Shrink in halving steps: one big jump makes fine textures (knits, mesh, corduroy) turn into wavy moiré */
function toCanvas(im, max){
  const W0=im.naturalWidth||im.width, H0=im.naturalHeight||im.height;
  const sc=Math.min(1, max/Math.max(W0, H0)), tw=Math.round(W0*sc), th=Math.round(H0*sc);
  let src=im, w=W0, h=H0;
  while(w/2 >= tw*1.05){
    const nw=Math.max(tw, Math.round(w/2)), nh=Math.max(th, Math.round(h/2));
    const t=document.createElement('canvas'); t.width=nw; t.height=nh;
    const g=t.getContext('2d'); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high'; g.drawImage(src,0,0,nw,nh);
    src=t; w=nw; h=nh;
  }
  const c=document.createElement('canvas'); c.width=tw; c.height=th;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high'; g.drawImage(src,0,0,tw,th); return c;
}

/* AI cutout: a small segmentation model (U2-Net-p) runs on this device, nothing is uploaded */
let segP = null;
function loadSeg(){
  if(segP) return segP;
  segP = (async()=>{
    if(!window.ort) await loadScript('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.wasm-core.min.js');
    ort.env.wasm.numThreads = 1; ort.env.wasm.simd = true; ort.env.wasm.proxy = false;
    ort.env.wasm.wasmPaths = new URL('ml/', document.baseURI).href;
    const r = await fetch('ml/u2netp-model.wasm'); if(!r.ok) throw new Error('model '+r.status);
    return await ort.InferenceSession.create(await r.arrayBuffer(), {executionProviders:['wasm'], graphOptimizationLevel:'all'});
  })();
  segP.catch(()=>{ segP=null; });
  return segP;
}
async function aiMask(c){
  const sess = await loadSeg();
  const S=320, t=document.createElement('canvas'); t.width=S; t.height=S; const tg=t.getContext('2d',{willReadFrequently:true});
  tg.drawImage(c,0,0,S,S); const px=tg.getImageData(0,0,S,S).data;
  const mean=[0.485,0.456,0.406], std=[0.229,0.224,0.225], arr=new Float32Array(3*S*S);
  let mx=0; for(let i=0;i<S*S;i++) for(let k=0;k<3;k++) if(px[i*4+k]>mx) mx=px[i*4+k]; mx=mx||255;
  for(let i=0;i<S*S;i++) for(let k=0;k<3;k++) arr[k*S*S+i]=(px[i*4+k]/mx-mean[k])/std[k];
  const out = await sess.run({[sess.inputNames[0]]: new ort.Tensor('float32', arr, [1,3,S,S])});
  const m = out[sess.outputNames[0]].data;
  let lo=Infinity, hi=-Infinity; for(const v of m){ if(v<lo)lo=v; if(v>hi)hi=v; }
  const mi=tg.createImageData(S,S);
  for(let i=0;i<S*S;i++){ const v=(m[i]-lo)/((hi-lo)||1); mi.data[i*4+3]=Math.round(v*255); }
  tg.putImageData(mi,0,0);
  const big=document.createElement('canvas'); big.width=c.width; big.height=c.height;
  const bg=big.getContext('2d',{willReadFrequently:true}); bg.imageSmoothingQuality='high'; bg.drawImage(t,0,0,c.width,c.height);
  return bg.getImageData(0,0,c.width,c.height).data;
}
/* Old colour-based fallback, used only if the AI model can't load */
function colorMask(c){
  const w=c.width,h=c.height,g=c.getContext('2d',{willReadFrequently:true}),p=g.getImageData(0,0,w,h).data;
  let mr=0,mg=0,mb=0,n=0; const border=[];
  for(let x=0;x<w;x++) border.push(x,(h-1)*w+x); for(let y=1;y<h-1;y++) border.push(y*w,y*w+w-1);
  for(const i of border){ mr+=p[i*4]; mg+=p[i*4+1]; mb+=p[i*4+2]; n++; } mr/=n; mg/=n; mb/=n;
  const T1=58*58,T2=11*11, dm=i=>{const a=p[i*4]-mr,b=p[i*4+1]-mg,e=p[i*4+2]-mb;return a*a+b*b+e*e;}, dn=(i,j)=>{const a=p[i*4]-p[j*4],b=p[i*4+1]-p[j*4+1],e=p[i*4+2]-p[j*4+2];return a*a+b*b+e*e;};
  const bgm=new Uint8Array(w*h), q=new Int32Array(w*h); let qh=0,qt=0;
  for(const i of border) if(!bgm[i]&&dm(i)<T1){ bgm[i]=1; q[qt++]=i; }
  while(qh<qt){ const i=q[qh++],x=i%w; for(const j of [x>0?i-1:-1,x<w-1?i+1:-1,i-w,i+w]){ if(j<0||j>=w*h||bgm[j]) continue; const m=dm(j); if(m<T1||(dn(i,j)<T2&&m<T1*3.2)){ bgm[j]=1; q[qt++]=j; } } }
  const out=new Uint8ClampedArray(w*h*4); for(let i=0;i<w*h;i++) out[i*4+3]=bgm[i]?0:255; return out;
}
/* Returns {canvas, cut, note}: canvas is the cropped piece on transparency (or the plain photo) */
async function prepareBase(file, cut){
  const im = await readImage(file);
  const c = toCanvas(im, cut ? 1300 : 1400);
  if(!cut) return {canvas:c, cut:false};
  let mask, note='';
  try{ mask = await aiMask(c); }
  catch(e){ console.error('AI cutout unavailable', e); mask = colorMask(c); note='The smart cutout could not load, so a simpler one was used. Use Touch up to fix it, or try again with a better connection.'; }
  const w=c.width, h=c.height, A=new Uint8ClampedArray(w*h);
  for(let i=0;i<w*h;i++){ let a=mask[i*4+3]/255; a=Math.min(1,Math.max(0,(a-0.12)/0.5)); a=a*a*(3-2*a); A[i]=a<0.04?0:Math.round(a*255); }
  /* Fill holes: low-confidence spots fully surrounded by the piece (a logo, a coloured panel) are kept */
  const out=new Uint8Array(w*h), q=new Int32Array(w*h); let qh=0, qt=0;
  const seed=i=>{ if(!out[i] && A[i]<128){ out[i]=1; q[qt++]=i; } };
  for(let x=0;x<w;x++){ seed(x); seed((h-1)*w+x); } for(let y=0;y<h;y++){ seed(y*w); seed(y*w+w-1); }
  while(qh<qt){ const i=q[qh++], x=i%w; if(x>0) seed(i-1); if(x<w-1) seed(i+1); if(i>=w) seed(i-w); if(i<w*h-w) seed(i+w); }
  /* Each enclosed gap is judged on its own: keep it if the AI half-believed it, if its colour differs from the
     background, or if it is a tiny speck. Gaps that look like the floor (e.g. between sleeve and body) stay removed. */
  const px=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
  let br=0,bgc=0,bb=0,bn=0; for(let i=0;i<w*h;i+=7) if(out[i]){ br+=px[i*4]; bgc+=px[i*4+1]; bb+=px[i*4+2]; bn++; }
  if(bn){ br/=bn; bgc/=bn; bb/=bn; }
  const lab=new Int32Array(w*h).fill(-1), comp=[];
  for(let s0=0;s0<w*h;s0++){
    if(out[s0] || A[s0]>=128 || lab[s0]>=0) continue;
    const id=comp.length; let qh2=0, qt2=0, n=0, pr=0, cd=0; q[qt2++]=s0; lab[s0]=id;
    while(qh2<qt2){ const i=q[qh2++], x=i%w; n++; pr+=mask[i*4+3]/255;
      const dr=px[i*4]-br, dg=px[i*4+1]-bgc, db=px[i*4+2]-bb; cd+=Math.sqrt(dr*dr+dg*dg+db*db);
      for(const j of [x>0?i-1:-1, x<w-1?i+1:-1, i-w, i+w]){ if(j<0||j>=w*h||out[j]||A[j]>=128||lab[j]>=0) continue; lab[j]=id; q[qt2++]=j; } }
    comp.push({fill: n < w*h*0.0015 || pr/n > 0.2 || (bn && cd/n > 60 && pr/n > 0.04)});
  }
  let fg=0; for(let i=0;i<w*h;i++){ if(lab[i]>=0 && comp[lab[i]].fill) A[i]=255; else if(lab[i]>=0) A[i]=0; if(A[i]>=128) fg++; }
  if(fg<w*h*0.01) return {canvas:toCanvas(im,1400), cut:false, note:'No clothing piece was found in this photo, so the full photo is kept.'};
  const m=document.createElement('canvas'); m.width=w; m.height=h; const mg=m.getContext('2d',{willReadFrequently:true});
  const md=mg.createImageData(w,h); for(let i=0;i<w*h;i++) md.data[i*4+3]=A[i]; mg.putImageData(md,0,0);
  const base={full:c, mask:m, cut:true, note}; base.canvas=compose(base); return base;
}
/* Photo + mask -> cropped cut-out */
function compose(base){
  const {full, mask}=base, w=full.width, h=full.height;
  const t=document.createElement('canvas'); t.width=w; t.height=h; const tg=t.getContext('2d');
  tg.drawImage(full,0,0); tg.globalCompositeOperation='destination-in'; tg.drawImage(mask,0,0);
  const a=mask.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(a[(y*w+x)*4+3]>=128){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  if(x1<0) return t;
  const pad=12; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
  const o=document.createElement('canvas'); o.width=x1-x0+1; o.height=y1-y0+1; o.getContext('2d').drawImage(t,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return o;
}
/* Touch-up editor: paint to bring parts back or remove leftovers */
function openTouchUp(base, onDone){
  const {full, mask}=base, w=full.width, h=full.height, mg=mask.getContext('2d',{willReadFrequently:true});
  const start=mg.getImageData(0,0,w,h), undo=[];
  const wrap=document.createElement('div'); wrap.className='editor';
  wrap.innerHTML=`<div class="ed-top"><button type="button" class="btn" data-ed="cancel">Cancel</button><b>Touch up</b><button type="button" class="btn primary" data-ed="done">Done</button></div>
    <div class="ed-stage"><canvas class="ed-canvas" width="${w}" height="${h}"></canvas></div>
    <div class="ed-tools">
      <div class="ed-seg" role="group" aria-label="Brush"><button type="button" data-mode="keep" aria-pressed="true">Bring back</button><button type="button" data-mode="erase" aria-pressed="false">Remove</button></div>
      <label class="ed-size"><span class="label">Brush</span><input type="range" id="ed-size" min="1" max="12" value="4" step="0.5"></label>
      <button type="button" class="btn" data-ed="undo">Undo</button>
    </div>
    <p class="ed-hint">Dark areas get removed. Paint with <b>Bring back</b> over parts that should stay, or <b>Remove</b> over leftover background.</p>`;
  (typeof ROOT!=='undefined' ? ROOT : document.body).appendChild(wrap);
  const cv=wrap.querySelector('canvas'), g=cv.getContext('2d'), veil=document.createElement('canvas'); veil.width=w; veil.height=h; const vg=veil.getContext('2d');
  let mode='keep', drawing=false, last=null, raf=0;
  const render=()=>{ raf=0; g.clearRect(0,0,w,h); g.drawImage(full,0,0);
    vg.globalCompositeOperation='source-over'; vg.clearRect(0,0,w,h); vg.fillStyle='rgba(16,18,22,.78)'; vg.fillRect(0,0,w,h);
    vg.globalCompositeOperation='destination-out'; vg.drawImage(mask,0,0); g.drawImage(veil,0,0); };
  const queue=()=>{ if(!raf) raf=requestAnimationFrame(render); };
  render();
  const pt=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*w/r.width, (e.clientY-r.top)*h/r.height]; };
  const stroke=(a,b)=>{ const rad=(+wrap.querySelector('#ed-size').value)/100*Math.max(w,h);
    mg.globalCompositeOperation = mode==='keep' ? 'source-over' : 'destination-out';
    mg.strokeStyle='#000'; mg.fillStyle='#000'; mg.lineCap='round'; mg.lineWidth=rad*2;
    mg.beginPath(); mg.moveTo(a[0],a[1]); mg.lineTo(b[0],b[1]); mg.stroke();
    mg.beginPath(); mg.arc(b[0],b[1],rad,0,Math.PI*2); mg.fill(); queue(); };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); undo.push(mg.getImageData(0,0,w,h)); if(undo.length>15) undo.shift(); drawing=true; last=pt(e); stroke(last,last); });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pt(e); stroke(last,p); last=p; });
  const end=()=>{ drawing=false; last=null; }; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  wrap.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.mode){ mode=b.dataset.mode; wrap.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); }
    else if(b.dataset.ed==='undo'){ const s=undo.pop(); if(s){ mg.globalCompositeOperation='source-over'; mg.putImageData(s,0,0); queue(); } }
    else if(b.dataset.ed==='cancel'){ mg.putImageData(start,0,0); wrap.remove(); }
    else if(b.dataset.ed==='done'){ base.canvas=compose(base); wrap.remove(); onDone(); } });
}
/* Colour fix: warmth < 0 cools a yellow lamp tint, > 0 warms; brightness in % */
function finalize(base, warmth, bright){
  const s=base.canvas, o=document.createElement('canvas'); o.width=s.width; o.height=s.height; const g=o.getContext('2d',{willReadFrequently:true});
  if(!base.cut){ g.fillStyle='#fff'; g.fillRect(0,0,o.width,o.height); }
  g.drawImage(s,0,0);
  if(warmth || bright){
    const d=g.getImageData(0,0,o.width,o.height), p=d.data, t=warmth/100, b=1+bright/100;
    const rm=(1+0.22*t)*b, gm=(1+0.04*t)*b, bm=(1-0.28*t)*b;
    for(let i=0;i<p.length;i+=4){ p[i]=p[i]*rm; p[i+1]=p[i+1]*gm; p[i+2]=p[i+2]*bm; }
    g.putImageData(d,0,0);
  }
  return new Promise(res=>o.toBlob(res, base.cut?'image/png':'image/jpeg', 0.88));
}

function updateCount(key){
  const l=rowList(key); const i=l.findIndex(x=>x.id===S.sel[key]); const sec=$(`.row[data-key="${key}"]`); if(!sec) return;
  const opt=CATS.find(c=>c.key===key).optional; const n=opt?l.length-1:l.length; const pos=opt?i:i+1;
  sec.querySelector('[data-count]').textContent = pos<=0 ? `none · ${n}` : `${pos} / ${n}`;
}
function goTo(key, idx, smooth=true){
  const strip=$(`[data-strip="${key}"]`); const l=rowList(key); if(!strip||!l.length) return;
  idx=(idx+l.length)%l.length; S.sel[key]=l[idx].id;
  strip.scrollTo({left:idx*strip.clientWidth, behavior: smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth':'auto'}); updateCount(key);
}

function renderCloset(){
  const list = pool();

    <section>
      <div class="cathead"><h2>${c.plural}</h2><button class="linkbtn" data-addcat="${c.key}" style="font-size:13px">+ Add ${c.one}</button></div>

        <div class="card">
          <button class="ph" data-flip="${it.id}" aria-label="Flip ${esc(it.name||c.chip)}">

      ${S.items.length?`<div style="margin-top:28px;text-align:center"><button class="del" id="wipe" data-wipe="1">Delete all ${S.items.length} clothes and saved outfits</button></div>`:''}

/* Upper-body pieces sit side by side, innermost on the left, like a flat lay photo */
const UPPER_POS = {
  1:[[24,15,52,30]],
  2:[[6,15,44,28],[44,15,44,31]],
  3:[[1,17,36,24],[29,13,38,29],[60,15,39,30]],
};
const ACC_POS = {0:[66,20,30,15],1:[68,18,28,15],2:[66,33,30,15],3:[64,40,32,12]};
function flatLay(o, tag){
  o = normO(o);
  const get = k => o[k] && byId(o[k]);
  const pic = (it, cls, pos, z) => `<img class="${cls}" src="${img(it,'front')}" alt="${esc(it.name||'')}"${pos?` style="left:${pos[0]}%;top:${pos[1]}%;width:${pos[2]}%;height:${pos[3]}%;z-index:${z||1}"`:''}>`;
  const upper = ['top','mid','jacket'].map(get).filter(Boolean);
  let html = '';
  if(get('bottom')) html += pic(get('bottom'),'p-bottom');
  upper.forEach((it,i)=> html += pic(it,'', UPPER_POS[upper.length][i], i+1));
  if(get('acc')) html += pic(get('acc'),'', ACC_POS[upper.length], 5);
  if(get('hat')) html += pic(get('hat'),'p-hat');
  if(get('shoes')) html += pic(get('shoes'),'p-shoes');
  return `<div class="lay">${html}${tag?`<span class="tag">${esc(tag)}</span>`:''}</div>`;
}
const EXAMPLE_LOOK = {id:'__ex', hat:'ex11', top:'ex3', mid:'ex8', acc:'ex13', bottom:'ex1', shoes:'ex9'};
function renderSaved(){
  if(!S.outfits.length){
    $('#view').innerHTML = `<div class="empty" style="margin-bottom:10px">No saved outfits yet. Build one on the Outfit tab and tap <b>Save outfit</b>. It will show up here laid out like this:</div>
      <div style="max-width:300px;margin:0 auto">${flatLay(EXAMPLE_LOOK,'Example')}</div>`;
  } else $('#view').innerHTML = `<div class="looks">${S.outfits.map(o=>`<button class="lay-btn" data-look="${o.id}" aria-label="View outfit" style="border:0;padding:0;background:none">${flatLay(o)}</button>`).join('')}</div>`;
  $('#bar').innerHTML = `<button class="btn grow" data-tab="outfit">Make a new outfit</button>`;
}
function openLook(id){
  const o=S.outfits.find(x=>x.id===id); if(!o) return;
  $('#sheet-root').innerHTML = `<div class="viewer" role="dialog" aria-label="Outfit"><div class="in">
    <div class="top"><span class="label">Saved outfit</span><button class="btn" data-closeview>Close</button></div>
    ${flatLay(o)}
    <div class="acts"><button class="btn grow" data-wear="${o.id}">Edit in builder</button><button class="btn" data-unsave="${o.id}" style="color:var(--danger)">Delete</button></div>
  </div></div>`;
}

/* ---------- add sheet ---------- */
function openSheet(cat){
  if(S.mode==='loading'){ toast('Still connecting, try again in a second'); return; }
  const st={cat:(SECTIONS.some(x=>x.key===cat)?cat:'tshirt'), front:null, back:null, raw:{}};
  $('#sheet-root').innerHTML = `<div class="scrim" data-close><form class="sheet" id="addform" autocomplete="off">
    <h3>Add clothing</h3>
    <span class="label">Type</span>
    <div class="chips">${SECTIONS.map(c=>`<button type="button" class="chip" data-cat="${c.key}" aria-pressed="${c.key===st.cat}">${c.chip}</button>`).join('')}</div>
    <span class="label">Photos</span>
    <div class="drops">
      <label class="drop" id="drop-front"><span class="big">+</span><b>Front</b><small>Required</small><input id="in-front" type="file" accept="image/*,.heic,.heif"></label>
      <label class="drop" id="drop-back"><span class="big">+</span><b>Back</b><small>Optional</small><input id="in-back" type="file" accept="image/*,.heic,.heif"></label>
    </div>
    <div class="touchrow" id="touchrow" hidden><button type="button" class="btn" data-touch="front" hidden>Touch up front</button><button type="button" class="btn" data-touch="back" hidden>Touch up back</button></div>
    <label class="cutrow" for="in-cut"><input type="checkbox" id="in-cut" checked><span><b style="color:var(--ink)">Cut out background</b> · finds the clothing piece and removes everything else</span></label>
    <div class="tune">
      <label for="in-warm"><span class="label">Color</span><span class="ends"><span>Cooler</span><span>Warmer</span></span><input type="range" id="in-warm" min="-60" max="60" step="2" value="0"></label>
      <label for="in-bright"><span class="label">Brightness</span><span class="ends"><span>Darker</span><span>Brighter</span></span><input type="range" id="in-bright" min="-30" max="40" step="2" value="0"></label>
      <button type="button" class="linkbtn" id="tune-reset" style="font-size:12px;justify-self:start">Reset colors</button>
    </div>
    <label class="field"><span class="label">Name (optional)</span><input type="text" id="in-name" placeholder="e.g. Light wash jeans" maxlength="60"></label>
    <p class="err" id="err"></p>
    <div style="display:flex;gap:8px"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary grow" id="save-item">Save to closet</button></div>
  </form></div>`;
  const f=$('#addform');
  f.addEventListener('click',e=>{ const c=e.target.closest('[data-cat]'); if(c){ st.cat=c.dataset.cat; f.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',String(b===c))); }});
  st.ready={}; st.base={}; st.busy=0;
  const saveBtn=()=>$('#save-item');
  async function show(side){
    const base=st.base[side]; if(!base) return;
    const blob=await finalize(base, +$('#in-warm').value, +$('#in-bright').value); st[side]=blob;
    const d=$('#drop-'+side); d.querySelector('img')?.remove(); const im=document.createElement('img'); im.src=URL.createObjectURL(blob); im.alt=side; d.appendChild(im);
    const tb=$(`[data-touch="${side}"]`); tb.hidden=!base.cut; $('#touchrow').hidden = !$('#touchrow').querySelector('[data-touch]:not([hidden])');
  }
  $('#touchrow').addEventListener('click', e=>{ const b=e.target.closest('[data-touch]'); if(!b) return; const side=b.dataset.touch; if(st.base[side]?.cut) openTouchUp(st.base[side], ()=>show(side)); });
  async function process(side){
    const file=st.raw[side]; if(!file) return; const d=$('#drop-'+side); d.classList.add('busy'); $('#err').textContent='';
    st.busy++; saveBtn().disabled=true;
    await new Promise(r=>setTimeout(r,30));
    try{
      if(!st.ready[side] || st.ready[side].src!==file) st.ready[side]={src:file, file:await toReadable(file)};
      st.base[side]=await prepareBase(st.ready[side].file, $('#in-cut').checked);
      if(st.base[side].note) $('#err').textContent=st.base[side].note;
      await show(side);
    }catch(err){ $('#err').textContent=err.message; }
    d.classList.remove('busy'); st.busy--; if(!st.busy) saveBtn().disabled=false;
  }
  for(const side of ['front','back']){
    $('#in-'+side).addEventListener('change', e=>{ const file=e.target.files[0]; if(!file) return; st.raw[side]=file; process(side); });
  }
  $('#in-cut').addEventListener('change', ()=>{ process('front'); process('back'); });
  let tuneT; const retune=()=>{ clearTimeout(tuneT); tuneT=setTimeout(()=>{ show('front'); show('back'); },120); };
  $('#in-warm').addEventListener('input', retune); $('#in-bright').addEventListener('input', retune);
  $('#tune-reset').addEventListener('click', ()=>{ $('#in-warm').value=0; $('#in-bright').value=0; retune(); });
  loadSeg().catch(()=>{});
  f.addEventListener('submit', async e=>{
    e.preventDefault();
    if(st.busy) return;
    if(!st.front){ $('#err').textContent='Add a front photo first.'; return; }
    const btn=$('#save-item'); btn.disabled=true; btn.textContent='Saving…';
    try{
      const front=await storeBlob(st.front); const back=st.back?await storeBlob(st.back):null;
      await addItem({cat:st.cat, name:$('#in-name').value.trim(), front, back});
      closeSheet(); toast('Added to your closet');
    }catch(err){ btn.disabled=false; btn.textContent='Save to closet'; $('#err').textContent = err?.code==='quota_exceeded' ? 'Storage is full. Remove a few items and try again.' : 'Could not save this item. Check your connection and try again.'; }
  });
  $('#sheet-root').addEventListener('click', e=>{ if(e.target.matches('[data-close]')) closeSheet(); });
}
function closeSheet(){ $('#sheet-root').innerHTML=''; }

/* ---------- events ---------- */
ROOT.addEventListener('click', async e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.dockhome){ ROOT.host.dispatchEvent(new CustomEvent('dock-home',{bubbles:true,composed:true})); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(t.dataset.lock){ const k=t.dataset.lock; S.locked[k]=!S.locked[k]; t.setAttribute('aria-pressed',String(!!S.locked[k])); t.textContent=S.locked[k]?'Locked':'Lock'; return; }
  if(t.dataset.nav){ const k=t.dataset.key; const l=rowList(k); goTo(k, l.findIndex(i=>i.id===S.sel[k])+Number(t.dataset.nav)); return; }
  if(t.dataset.flip){ const it=byId(t.dataset.flip); if(!it||!it.back) return; const im=t.querySelector('img'); const s=im.dataset.side==='front'?'back':'front'; im.dataset.side=s; im.src=img(it,s); t.querySelector('.side').textContent=s==='front'?'Front · tap':'Back · tap'; return; }
  if(t.dataset.del){
    if(t.dataset.armed){
      const it=byId(t.dataset.del); if(!it) return;
      if(it.example){ hiddenEx.push(it.id); try{ localStorage.setItem('fr-hidden-ex', JSON.stringify(hiddenEx)); }catch(e){} render(); toast('Deleted'); return; }
      t.disabled=true; t.textContent='Deleting…';
      try{ await removeItem(it); toast('Deleted'); }catch(err){ t.disabled=false; t.textContent='Delete'; delete t.dataset.armed; toast('Could not delete it. Try again.'); }
    }
    else { t.dataset.armed='1'; t.textContent='Confirm'; setTimeout(()=>{ if(t.isConnected && !t.disabled){ delete t.dataset.armed; t.textContent='Delete'; } },3000); }
    return;
  }
  if(t.dataset.wear){ const o=S.outfits.find(x=>x.id===t.dataset.wear); closeSheet(); CATS.forEach(c=>S.sel[c.key]= o[c.key]||NONE.id); S.tab='outfit'; render(); return; }
  if(t.dataset.unsave){
    if(!t.dataset.armed){ t.dataset.armed='1'; t.textContent='Confirm delete'; return; }
    const o=S.outfits.find(x=>x.id===t.dataset.unsave); try{ await removeOutfit(o); closeSheet(); render(); toast('Outfit deleted'); }catch(err){ toast('Could not delete it'); } return; }
  if(t.dataset.addcat){ openSheet(t.dataset.addcat); return; }
  if(t.dataset.wipe){
    if(!t.dataset.armed){ t.dataset.armed='1'; t.textContent='Tap again to delete everything'; setTimeout(()=>{ if(t.isConnected&&!t.disabled){ delete t.dataset.armed; t.textContent=`Delete all ${S.items.length} clothes and saved outfits`; } },4000); return; }
    t.disabled=true; t.textContent='Deleting…';
    try{ for(const o of [...S.outfits]) await removeOutfit(o); for(const it of [...S.items]) await removeItem(it); toast('Closet cleared'); }
    catch(err){ toast('Some items could not be deleted. Try again.'); }
    render(); return;
  }
  if(t.dataset.ccat){ S.closetCat=t.dataset.ccat; render(); return; }
  if(t.dataset.look){ openLook(t.dataset.look); return; }
  if(t.matches('[data-closeview]')){ closeSheet(); return; }
  const act=t.dataset.act;
  if(act==='add') openSheet();
  if(act==='flip'){ S.showBack=!S.showBack; render(); }
  if(act==='shuffle'){ CATS.forEach(c=>{ if(S.locked[c.key]) return; const l=rowList(c.key); if(l.length>1) goTo(c.key, Math.floor(Math.random()*l.length)); }); }
  if(act==='save'){
    if(usingExamples()){ toast('Add your own clothes to save outfits'); return; }
    const o={}; CATS.forEach(c=>{ const v=S.sel[c.key]; o[c.key]= v && v!==NONE.id && rowList(c.key).length ? v : null; });
    const key=JSON.stringify(CATS.map(c=>o[c.key]));
    if(S.outfits.some(x=>JSON.stringify(CATS.map(c=>x[c.key]||null))===key)){ toast('Already saved'); return; }
    try{ await saveOutfit(o); toast('Outfit saved'); const show=(n)=>{ const m=S.outfits.find(x=>JSON.stringify(CATS.map(c=>x[c.key]||null))===key); if(m) openLook(m.id); else if(n) setTimeout(()=>show(n-1),500); }; setTimeout(()=>show(4),200); }catch(err){ toast('Could not save the outfit'); }
  }
});
ROOT.addEventListener('keydown', e=>{
  const strip=e.target.closest?.('[data-strip]'); if(strip && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ e.preventDefault(); const k=strip.dataset.strip; const l=rowList(k); goTo(k, l.findIndex(i=>i.id===S.sel[k])+(e.key==='ArrowRight'?1:-1)); }
  if(e.key==='Escape') closeSheet();
});
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(S.tab==='outfit') CATS.forEach(c=>goTo(c.key, rowList(c.key).findIndex(i=>i.id===S.sel[c.key]), false)); },150); });

/* ---------- boot ---------- */
render();
(async()=>{
  try{
    const [d,a] = await Promise.all([window.claude?.use?.('db') ?? null, window.claude?.use?.('assets') ?? null]);
    if(d && a){
      db=d; assets=a; S.mode='cloud';
      let first=true;
      db.collection('items').orderBy('created').onSnapshot(snap=>{ S.items=snap.docs.map(x=>({id:x.id,...x.data()})); if(S.tab!=='outfit'||first||true) render(); first=false; }, ()=>toast('Lost connection to your closet'));
      db.collection('outfits').orderBy('created','desc').onSnapshot(snap=>{ S.outfits=snap.docs.map(x=>normO({id:x.id,...x.data()})); if(S.tab==='saved') render(); });
      return;
    }
  }catch(e){}
  try{ await local.open(); S.mode='local'; await localLoad(); }catch(e){ S.mode='local'; }
  render();
})();
};

<script>
(() => {
const FITTING_URL = 'https://claude.ai/artifact/Nd4DYgNyJeBScB5iRw4p6X';
const ICON = {
  fitting:'<path d="M8 3.5l-5 3 2 4 2-1V20h10V9.5l2 1 2-4-5-3q-1.5 2-4 2t-4-2z"/>',
  habits:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.8 2.8L16.5 9"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r="1.2" fill="currentColor"/>',
  shelf:'<rect x="3" y="5" width="12.5" height="14" rx="2"/><path d="M8 9.5v5l4-2.5z"/><path d="M18.5 6.5v12M21 8.5v8"/>',
  wish:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
  plan:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8.5 15l2.2 2.2 4.8-4.7"/>',
  todo:'<rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/>',
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
const APPS = [
  {key:'fitting', name:'Fitting Room', desc:'Your closet and outfit builder', pill:'Ready'},
  {key:'habits', name:'Habits', desc:'Daily quests, XP, levels and a monthly boss', pill:'Ready', href:'#habits'},
  {key:'plan', name:'Planner', desc:'To-dos and calendar together', pill:'Ready', href:'#plan'},
  {key:'wish', name:'Wishlist', desc:'Things you want, with prices and links', pill:'Ready', href:'#wish'},
  {key:'shelf', name:'Shelf', desc:'Anime, shows, movies, books and manga you rated', pill:'Ready', href:'#shelf'},
];
const root = document.getElementById('root');

function greeting(){ const h=new Date().getHours(); return h<5?'Good night':h<12?'Good morning':h<18?'Good afternoon':'Good evening'; }
function dateLine(){ return new Date().toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'}); }

/* ---------- Home: app tiles in the order you choose ---------- */
const HOME = { order:null, arranging:false };
let homeDoc=null;
function ordered(){
  const keys=APPS.map(a=>a.key), o=[...new Set((HOME.order||[]).map(k=>k==='todo'||k==='cal'?'plan':k))].filter(k=>keys.includes(k));
  return [...o, ...keys.filter(k=>!o.includes(k))].map(k=>APPS.find(a=>a.key===k));
}
function saveOrder(){

  try{ localStorage.setItem('dock-order', JSON.stringify(HOME.order)); }catch(e){}
  if(homeDoc) homeDoc.set({order:HOME.order}).catch(()=>{});
}
function home(){
  document.title = 'App Dock';
  const A=HOME.arranging;
  root.innerHTML = `
    <span class="label">${dateLine()}</span>
    <div class="homehead"><h1>${greeting()}, Bantiflok</h1><button type="button" class="arrange ${A?'on':''}" data-arrange="1">${A?'Done':'Arrange'}</button></div>
    ${A?'<p class="note" style="margin-top:6px">Drag the tiles, or use the arrows, to put your apps in the order you like.</p>':''}
    <div class="grid ${A?'arranging':''}">${ordered().map(a=>A?`
      <div class="tile" data-app="${a.key}">
        <span class="ic">${svg(a.key)}</span>
        <span><b>${a.name}</b><p>${a.desc}</p></span>
        <span class="meta movers"><button type="button" class="mv" data-mv="-1" aria-label="Move ${a.name} earlier">←</button><span class="grip" aria-hidden="true">⠿</span><button type="button" class="mv" data-mv="1" aria-label="Move ${a.name} later">→</button></span>
      </div>`:`
      <button type="button" class="tile" data-app="${a.key}" data-go="${a.key}">
        <span class="ic">${svg(a.key)}</span>
        <span><b>${a.name}</b><p>${a.desc}</p></span>
        <span class="meta"><span class="pill">${a.pill}</span><span class="go" aria-hidden="true">→</span></span>
      </button>`).join('')}
    </div>
    ${A?'':`<div class="dockfoot"><button type="button" data-export="1">Back up my data</button>${window.DOCK_SITE?`<button type="button" data-import="1">Restore a backup</button><input type="file" id="bk-file" accept=".json,application/json" hidden><button type="button" data-signout="1">Sign out${window.DOCK_SITE.email?' ('+escH(window.DOCK_SITE.email)+')':''}</button>`:''}<p class="note" id="bk-msg"></p></div>`}`;
  document.getElementById('ask')?.remove();
}

/* ---------- Backup: everything in one JSON file (photos included) ---------- */
const bkMsg = t => { const m=document.getElementById('bk-msg'); if(m) m.textContent=t; };
const toDataURL = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
async function readCloset(){
  const d=await (window.claude?.use?.('db') ?? null), a=await (window.claude?.use?.('assets') ?? null);
  if(d && a){
    const [i,o]=await Promise.all([d.collection('items').get(), d.collection('outfits').get()]);
    return { items:i.docs.map(x=>({id:x.id,...x.data()})), outfits:o.docs.map(x=>({id:x.id,...x.data()})),
      blob: async id=>{ const u=window.DOCK_SITE?.blobURL ? await window.DOCK_SITE.blobURL(id) : '/_blob/'+id; if(!u) return null; const r=await fetch(u); return r.ok ? r.blob() : null; } };
  }
  const idb = await new Promise((res,rej)=>{ const r=indexedDB.open('fitting-room',1);
    r.onupgradeneeded=()=>{ const x=r.result; x.createObjectStore('items',{keyPath:'id'}); x.createObjectStore('outfits',{keyPath:'id'}); x.createObjectStore('blobs'); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  const q=(st,fn)=>new Promise((res,rej)=>{ const t=idb.transaction(st,'readonly'), rq=fn(t.objectStore(st)); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); });
  return { items:await q('items',s=>s.getAll()), outfits:await q('outfits',s=>s.getAll()), blob:id=>q('blobs',s=>s.get(id)) };

/* Goal progress: one dot per day from the start of the goal to today, axis runs to the deadline */
function sparkline(g){

  const start=atMidnight(new Date(Math.min(hist[0].t, g.created||hist[0].t))), due=atMidnight(new Date(g.due)), today=atMidnight(new Date());
  const last=today<due?today:due, total=Math.max(1, Math.round((due-start)/86400000));
  const days=[]; let hi=0;
  for(let d=start; d<=last; d=addDays(d,1)){
    const end=addDays(d,1).getTime(); while(hi<hist.length && hist[hi].t<end) hi++;
    if(hi===0) continue; const k=dkey(d), upd=hist.some(p=>dkey(new Date(p.t))===k);
    days.push({d, v:hist[hi-1].v, upd, i:Math.round((d-start)/86400000)});
  }
  if(!days.length) return '';
  const W=330, H=130, L=6, R=6, T=18, B=22;
  const vals=days.map(x=>x.v).concat(g.target!=null?[g.target]:[]); let lo=Math.min(...vals), up=Math.max(...vals); const pad=((up-lo)||1)*0.12; lo-=pad; up+=pad;
  const X=i=>L+(i/total)*(W-L-R), Y=v=>T+(1-(v-lo)/(up-lo))*(H-T-B);

    <line x1="${X(total)}" x2="${X(total)}" y1="${T}" y2="${H-B}" class="dline"/>
    ${pts.length>1?`<polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" class="sline"/>`:''}
    ${days.map((x,j)=>{ const [cx,cy]=pts[j], lastPt=j===days.length-1; return `<g class="sday"><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${lastPt?6:x.upd?4.5:3.5}" class="${x.upd||lastPt?'sdot':'sdot carry'}"/><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="12" class="shit"><title>${x.d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}: ${num(x.v)}${x.upd?'':' (no update)'}</title></circle></g>`; }).join('')}

const endOfPeriod = p => { const n=atMidnight(new Date()); if(p==='week') return addDays(n, 6-((n.getDay()+6)%7)); if(p==='month') return new Date(n.getFullYear(), n.getMonth()+1, 0); return new Date(n.getFullYear(),11,31); };
const daysLeft = due => Math.round((atMidnight(new Date(due)) - atMidnight(new Date()))/86400000);
const gProgress = g => g.type==='check' ? (g.done?1:0) : Math.max(0, Math.min(1, (g.current-g.start)/((g.target-g.start)||1)));

function gReachedAt(g){ if(!gReached(g)) return null;
